workflow: approval
cases:
  - name: approve
    events: [approve]
    expect: { final: approved, states: [decide, approved] }
  - name: the timer fires after two days
    events: [{ advance: 1d }, { advance: 1d }]
    expect: { final: expired }
  - events: [{ advance: 1d }]
    expect: { status: waiting }
