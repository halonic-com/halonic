[package]
name = "halonic-login-item"
description = "Turns Halonic's own login item on or off for this user: one per-user entry that starts the installed Halonic with exactly --background, never a machine-wide one."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The registry calls need `unsafe`. As in elevate-start, this crate turns the
# workspace's `unsafe_code = "forbid"` off in its own Cargo.toml, every block
# has a `// SAFETY:` comment, and nothing unsafe leaves the `windows` module.
# These are the workspace lints with that one change.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
print_stderr = "deny"

# Pinned to the version already in Cargo.lock, so this crate adds no new
# code to the build. Only the windows-sys features it calls are turned on.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  # RegSetKeyValueW, RegGetValueW and RegDeleteKeyValueW under HKCU.
  "Win32_System_Registry",
] }
