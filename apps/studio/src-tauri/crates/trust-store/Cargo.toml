[package]
name = "halonic-trust-store"
description = "The trust records the Studio shell keeps in the profile, in the same files as the CLI's FileTrustStore."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde_json = { version = "1", default-features = false, features = ["std"] }
# Not on the plan's list (section 7), allowed by Liam on HAL-2652 because the
# shell already builds it: wry and tauri-codegen pull it in. Pinned to the
# version in Cargo.lock, so this adds no crate for cargo-deny to audit.
sha2 = { version = "=0.10.9", default-features = false }

[lints]
workspace = true
