[package]
name = "halonic-trust-store"
description = "The trust records the Studio shell keeps in the profile, in the same files as the CLI's FileTrustStore."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
# Not on the plan's list (section 7), allowed by Liam on HAL-2652 because the
# shell already builds it: wry and tauri-codegen pull it in. Pinned to the
# version in Cargo.lock, so this adds no crate for cargo-deny to audit.
sha2 = { version = "=0.10.9", default-features = false }

# Only for `O_NOFOLLOW`, `O_NONBLOCK` and their errors, which the standard
# library doesn't name: no `unsafe` code. Pinned as in `host-settings`, so it
# adds no new code to the build.
[target.'cfg(unix)'.dependencies]
libc = { version = "=0.2.191", default-features = false }

[lints]
workspace = true
