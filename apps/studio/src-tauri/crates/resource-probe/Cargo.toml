[package]
name = "halonic-resource-probe"
description = "Reads the numbers behind the status bar's resources item: this app's memory, the free space on a drive, and how much a folder takes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The standard library can't read free disk space or a process's memory, so
# this crate calls the operating system directly. It is allowed `unsafe` code
# (approved by Liam on HAL-11121), as `process-probe` is (HAL-2719): every
# other crate keeps the workspace's `unsafe_code = "forbid"`, and nothing
# unsafe leaves this crate's API.
# These are the workspace lints with that one change.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

# Pinned to the version already in Cargo.lock, so this crate adds no new code
# to the build.
[target.'cfg(unix)'.dependencies]
libc = { version = "=0.2.191", default-features = false }

# The same version as process-probe. Two more of its features are turned on
# here (approved by Liam on HAL-11121): the free-space call and the
# memory-use call. Only the features the crate calls are on.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }
