[package]
name = "halonic-record-store"
description = "The record logs the Studio shell writes, in the same files as the CLI's FileRecordStore and under the same write lock."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
halonic-run-lock = { path = "../run-lock" }
# Reads each line's collection, so the page can't put another collection's
# change in a log.
serde_json = { version = "1", default-features = false, features = ["std"] }
# Names each log by the SHA-256 of its collection, and gives a log's
# version. The exception Liam allowed for trust-store (HAL-2652) and
# profile (HAL-2719): the shell already builds it through wry and
# tauri-codegen. Pinned to the version in Cargo.lock, so this adds no crate
# for cargo-deny to audit.
sha2 = { version = "=0.10.9", default-features = false }

[lints]
workspace = true
