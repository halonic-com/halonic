[package]
name = "halonic-tunnel"
description = "The phone's end of the end-to-end session with the computer's remote gateway: the pairing codes, the frames, the Noise handshakes and the transport."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# HKDF-SHA256 and SHA-256 for the pairing psk, the check code and the
# commitment (ADR "Pairing and the end-to-end session"). Pinned to the
# versions already in Cargo.lock, the ones snow's sha2 0.10 goes with, so
# they add no crate to the app (HAL-12244). We write no crypto of our own.
[dependencies]
hkdf = "=0.12.4"
sha2 = "=0.10.9"
# The transport. tokio, futures-util, rustls and tokio-rustls are already
# in the app through Tauri and the http plugin; these add none of their
# crypto providers, which the shell's rustls config brings.
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rustls = { version = "0.23", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false }
# The WebSocket upgrade and frames only, over our own stream (Liam on
# HAL-12354): pinned, no TLS feature and no `connect`, so there is one TLS
# stack and one root store in the app. Only this crate uses it, and no
# command hands a raw socket to the page (board decision 4d).
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt-multi-thread", "time"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
