[package]
name = "halonic-sandbox-elevate"
description = "The signed helper that does the agent sandbox's administrator work on Windows: one fixed verb, no options, a hash-checked srt-win.exe from an admin-only folder."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "halonic-sandbox-elevate"
path = "src/main.rs"

# The Windows calls need `unsafe`. As in process-probe (HAL-2719), this crate
# turns the workspace's `unsafe_code = "forbid"` off in its own Cargo.toml,
# every block has a `// SAFETY:` comment, and nothing unsafe leaves the
# `windows` module. These are the workspace lints with that one change.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

# Pinned to the versions already in Cargo.lock, so this crate adds no new
# code to the build. Only the windows-sys features it calls are turned on.
[dependencies]
sha2 = { version = "=0.10.9", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }
