[package]
name = "halonic-profile"
description = "Finds the profile folder exactly as @halonicjs/profile does, so the Studio shell and the CLI share one profile."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# No dependencies: paths are plain text here, joined the platform's way, so
# the answers can be compared with the TypeScript package's character for
# character.

# serde_json reads the shared golden cases in the tests.
[dev-dependencies]
serde_json = { version = "1", default-features = false, features = ["std"] }

[lints]
workspace = true
