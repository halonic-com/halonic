[package]
name = "halonic-app-frame"
description = "The frames of Halonic Inbox and Halonic Messenger on Windows: a small process per app that owns the app's top-level window, so window managers such as FancyZones tell the apps apart by their exe, while Halonic draws the page inside it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# No exe of its own: the installer hard-links Halonic.exe as `Halonic
# Inbox.exe` and `Halonic Messenger.exe`, and Halonic's `main` runs the frame
# when started under one of those names (HAL-20468, `started_as`).

# The Windows calls need `unsafe`. As in window-app-id, this crate turns the
# workspace's `unsafe_code = "forbid"` off in its own Cargo.toml, every block
# has a `// SAFETY:` comment, and nothing unsafe leaves the `platform` and
# `frame` modules. These are the workspace lints with that one change.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"

[dependencies]
# Each frame's taskbar ID and icons, as Halonic set them on its windows.
halonic-window-app-id = { path = "../window-app-id" }
# The frame's title bar takes the colour Halonic's page asks for (HAL-18698).
halonic-window-caption = { path = "../window-caption" }

# Pinned to the version already in Cargo.lock, so this crate adds no new
# code to the build. Only the features it calls are turned on.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  # The frame's background.
  "Win32_Graphics_Gdi",
  # CreateMutexW's (null) security attributes.
  "Win32_Security",
  # The frame's own module handle, for its window class.
  "Win32_System_LibraryLoader",
  # Each frame's place, kept in the user's registry.
  "Win32_System_Registry",
  # The one-frame-per-app mutex, and the process behind a window.
  "Win32_System_Threading",
  # GetDpiForWindow and the process's DPI awareness.
  "Win32_UI_HiDpi",
  # Handing the keyboard focus to Halonic's window in the frame.
  "Win32_UI_Input_KeyboardAndMouse",
  # The process's AppUserModelID.
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
