[package]
name = "halonic-run-store"
description = "The run folders the Studio shell writes, in the same files as the CLI's FolderRunStore and under the same lock."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
halonic-run-lock = { path = "../run-lock" }
# Reads the run id of a log's first line, to tell another run's log.
serde_json = { version = "1", default-features = false, features = ["std"] }

[lints]
workspace = true
