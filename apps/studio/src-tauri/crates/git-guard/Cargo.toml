[package]
name = "halonic-git-guard"
description = "Runs git for the Studio shell: an allow-list of calls, hardened every time, and only in folders the user opened."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Everything here is the standard library and the git program itself, but
# for `libc`, only for `O_NONBLOCK`, which the standard library doesn't name:
# no `unsafe` code. Pinned as in `host-settings` and `trust-store`, so it adds
# no new code to the build.
[target.'cfg(unix)'.dependencies]
libc = { version = "=0.2.191", default-features = false }
