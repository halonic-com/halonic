[package]
name = "halonic-action-send"
description = "Sends one reviewed step of a user-only action stepper with the user's own token, and checks the pages a stepper may open."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Where the user's token is kept: the same backend trait as the secret
# commands, so the tests use its memory backend.
halonic-secrets = { path = "../secrets" }
# Drops key-shaped text from a service's error message.
halonic-shell-log = { path = "../shell-log" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[lints]
workspace = true
