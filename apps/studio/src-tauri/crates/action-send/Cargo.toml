[package]
name = "halonic-action-send"
description = "Sends one reviewed step of a user-only action stepper with the user's own token, and checks the pages a stepper may open."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Where the user's token is kept: the same backend trait as the secret
# commands, so the tests use its memory backend.
halonic-secrets = { path = "../secrets" }
# Drops key-shaped text from a service's error message.
halonic-shell-log = { path = "../shell-log" }
serde = { version = "1", features = ["derive"] }
# Names each request's record file by the SHA-256 of its id. The exception
# Liam allowed for trust-store (HAL-2652) and record-store: pinned to the
# version in Cargo.lock, so this adds no crate for cargo-deny to audit.
sha2 = { version = "=0.10.9", default-features = false }
serde_json = "1"
url = "2"

# Only for `O_NOFOLLOW`, `O_NONBLOCK` and their errors, which the standard
# library doesn't name: no `unsafe` code. Pinned as in `run-store`, so it
# adds no new code to the build.
[target.'cfg(unix)'.dependencies]
libc = { version = "=0.2.191", default-features = false }

[lints]
workspace = true
