[package]
name = "halonic-window-app-id"
description = "Gives one window of the Studio shell its own Windows taskbar identity (AppUserModelID) and icons, so Halonic Inbox and Halonic Messenger each get their own taskbar entry with their own icon."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The Windows call needs `unsafe`. As in process-probe (HAL-2719) and
# elevate-start, this crate turns the workspace's `unsafe_code = "forbid"`
# off in its own Cargo.toml, every block has a `// SAFETY:` comment, and
# nothing unsafe leaves the `platform` module. These are the workspace lints
# with that one change.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

# Pinned to the version already in Cargo.lock (tauri's own), so this crate
# adds no new code to the build. windows-sys has no COM interfaces, and the
# window's property store is one. Only the features it calls are turned on.
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  # PKEY_AppUserModel_ID.
  "Win32_Storage_EnhancedStorage",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  # SHGetPropertyStoreForWindow and IPropertyStore.
  "Win32_UI_Shell_PropertiesSystem",
  # The window's icons: GetSystemMetricsForDpi, CreateIconFromResourceEx,
  # WM_SETICON and DestroyIcon.
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }
