# The Studio shell (a Tauri app) and the Cargo workspace for its Rust code.
#
# The shell is this file's root package and the only thing that pulls Tauri
# in. Plain library crates live under crates/ and stay free of Tauri types,
# so they build and test anywhere.
#
# Today the shell is the Android connect shell (HAL-229, HAL-1375): it loads
# the connect page and offers it the `connect` command. The desktop shell
# (HAL-192) extends this package rather than adding a second one.
[package]
name = "halonic-studio"
description = "The Studio shell: the Tauri app that hosts the Studio on desktop and Android."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Android loads the app as a shared library (cdylib); the desktop binary in
# main.rs links the same code as a Rust library (rlib).
[lib]
name = "halonic_studio"
crate-type = ["cdylib", "rlib"]

# Pinned exactly, because they are released together: tauri 2.12.5 builds
# with tauri-build 2.7.4, and @tauri-apps/cli 2.12.4 in apps/studio matches
# them. Update all three in one pull request.
[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
halonic-connect = { path = "crates/connect" }
halonic-git-guard = { path = "crates/git-guard" }
halonic-keychain = { path = "crates/keychain" }
halonic-secrets = { path = "crates/secrets" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "=2.12.5", features = [] }
# The plugins are pinned with tauri, for the same reason. The http plugin
# is used only from Rust, for its reqwest client (the hello call); it is
# never registered, so no page can make HTTP calls through it. Only
# rustls-tls: no system proxy and no cookie store.
tauri-plugin-http = { version = "=2.8.3", default-features = false, features = ["rustls-tls"] }
tauri-plugin-opener = "=2.7.2"

# Tauri's mock runtime, for the test that every command is refused from the
# served page.
[dev-dependencies]
serde_json = "1"
tauri = { version = "=2.12.5", features = ["test"] }

[lints]
workspace = true

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# The app version. Set from apps/studio/package.json by `pnpm version:sync`;
# never edit it by hand. Every crate inherits it.
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
