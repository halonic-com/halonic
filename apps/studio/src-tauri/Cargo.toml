# The Studio shell (a Tauri app) and the Cargo workspace for its Rust code.
#
# The shell is this file's root package and the only thing that pulls Tauri
# in. Plain library crates live under crates/ and stay free of Tauri types,
# so they build and test anywhere.
#
# Today the shell is the Android connect shell (HAL-229, HAL-1375): it loads
# the connect page and offers it the `connect` command. The desktop shell
# (HAL-192) extends this package rather than adding a second one.
[package]
name = "halonic-studio"
description = "The Studio shell: the Tauri app that hosts the Studio on desktop and Android."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Android loads the app as a shared library (cdylib); the desktop binary in
# main.rs links the same code as a Rust library (rlib).
[lib]
name = "halonic_studio"
crate-type = ["cdylib", "rlib"]

# Pinned exactly, because they are released together: tauri 2.12.5 builds
# with tauri-build 2.7.4, and @tauri-apps/cli 2.12.4 in apps/studio matches
# them. Update all three in one pull request.
[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
# User-only action steppers' calls, sign-in and pages (HAL-17525, HAL-18084).
halonic-action-send = { path = "crates/action-send" }
halonic-agent-host = { path = "crates/agent-host" }
halonic-blob-store = { path = "crates/blob-store" }
halonic-command-paths = { path = "crates/command-paths" }
halonic-connect = { path = "crates/connect" }
halonic-engine-pipe = { path = "crates/engine-pipe" }
halonic-engine-supervisor = { path = "crates/engine-supervisor" }
halonic-git-guard = { path = "crates/git-guard" }
halonic-host-settings = { path = "crates/host-settings" }
halonic-http-guard = { path = "crates/http-guard" }
halonic-keychain = { path = "crates/keychain" }
halonic-login-shell = { path = "crates/login-shell" }
# The phone tunnel's service (HAL-15157). Its commands are granted on
# Android only, but its answer and status types are on every platform, so
# the served-page tests check the events' origin rule on the desktop too.
halonic-phone-tunnel = { path = "crates/phone-tunnel" }
halonic-process-probe = { path = "crates/process-probe" }
halonic-profile = { path = "crates/profile" }
halonic-record-store = { path = "crates/record-store" }
halonic-resource-probe = { path = "crates/resource-probe" }
halonic-run-lock = { path = "crates/run-lock" }
halonic-run-store = { path = "crates/run-store" }
halonic-secret-broker = { path = "crates/secret-broker" }
halonic-server-session = { path = "crates/server-session" }
halonic-secrets = { path = "crates/secrets" }
halonic-shell-log = { path = "crates/shell-log" }
halonic-trust-grant = { path = "crates/trust-grant" }
halonic-trust-store = { path = "crates/trust-store" }
halonic-update-state = { path = "crates/update-state" }
# The title bar takes the frame's colour on Windows (HAL-18698). A plain
# crate on every platform, so its colour reading is tested anywhere; only
# its Windows call is Windows only.
halonic-window-caption = { path = "crates/window-caption" }
halonic-workspace-files = { path = "crates/workspace-files" }
serde = { version = "1", features = ["derive"] }
sys-locale = "0.3"
serde_json = "1"
# The tray icon and its menu (B1 step 5, HAL-14220). The icons are raw
# RGBA (`icons/tray`), so no image decoder is needed. Linux builds need
# libayatana-appindicator3 (CI has it since #4196).
tauri = { version = "=2.12.5", features = ["tray-icon"] }
# The plugins are pinned with tauri, for the same reason. The http plugin
# is used only from Rust, for its reqwest client (the hello call); it is
# never registered, so no page can make HTTP calls through it. Only
# rustls-tls: no proxy settings from the operating system, and no cookie
# store. `http_fetch` sets each client's proxy itself (HAL-12966), which
# also stops reqwest reading the proxy variables by its own rules.
tauri-plugin-http = { version = "=2.8.3", default-features = false, features = ["rustls-tls"] }
tauri-plugin-opener = "=2.7.2"
url = "2"

# The time limits of the owner check and of an engine stream's opening
# answer. Tauri's async runtime is already tokio, so this adds no crate to
# the build, only the timer feature.
tokio = { version = "1", default-features = false, features = ["time"] }

# The native folder picker and the trust question (HAL-2612). rfd is the
# library tauri-plugin-dialog (plan 7.2) shows its dialogs with; the shell
# calls it from Rust instead of registering the plugin, whose script would
# replace `alert` and `confirm` in every page, the served Studio too.
# Pinned to the version tauri-plugin-dialog 2.8.4 uses; gtk3 is the plugin's
# default on Linux, and Windows needs common-controls-v6 for custom buttons.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd = { version = "=0.17.2", default-features = false, features = ["gtk3", "common-controls-v6"] }
# The desktop updater (HAL-1206, plan 4.2, flow-install-update section 4):
# checks latest.json on the release page, checks the installer's signature
# against the key in tauri.conf.json, and runs the NSIS installer. Pinned
# with tauri: 2.14.1 needs tauri ^2.12. Only rustls-tls, as for the http
# plugin: no proxy settings from the operating system (a blocked check is
# fine, C58), and no zip, which only old .zip update bundles need. Its
# client follows Halonic's proxy rules, as `http_fetch` does (HAL-12966,
# src/updates_proxy.rs), not reqwest's own reading of the environment.
# Never granted to a page.
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["rustls-tls"] }
# Desktop notifications for a new card, a new question and done work the
# person asked for (HAL-17448, board approval HAL-17434). Pinned with tauri.
# Granted to the app's own page only (`capabilities/desktop-notifications.json`),
# never to the Studio the computer serves.
tauri-plugin-notification = "=2.8.1"
# Halonic Inbox and Halonic Messenger as their own apps (HAL-17903): a
# second start of Halonic, such as the Start menu's Halonic Inbox, hands its
# arguments to the running one, which opens or brings forward that app's
# window, so every window shares one connection, engine lock and cache.
# Tauri's official plugin, pinned with tauri: 2.5.5 needs tauri ^2.12. Rust
# only: it has no commands, so no page can call it.
tauri-plugin-single-instance = "=2.5.5"
# Each window comes back where it was (HAL-19204, board request): FancyZones
# keeps one place per exe, and Studio, the Inbox and the Messenger are all
# Halonic.exe. Tauri's official plugin keeps each window's position, size
# and maximised state by its label. Pinned with tauri: 2.5.0 needs tauri
# ^2.12. Registered from Rust only: no capability grants its commands, so
# no page can call them (`window_place.rs`). Approved by Liam on HAL-19212.
tauri-plugin-window-state = "=2.5.0"
# "Start Halonic when I log in" (B1 step 6, HAL-14221): our own crate,
# not tauri-plugin-autostart, so the entry is per-user only and its path is
# quoted (crates/login-item/README.md). Desktop only.
halonic-login-item = { path = "crates/login-item" }
# "Keep this computer awake while it's plugged in" (phase 2 G5, HAL-17641):
# our own crate, with the OS lock and power reading. Desktop only.
halonic-keep-awake = { path = "crates/keep-awake" }
# Signing in to an owner's own server with its password (HAL-18944): the
# order of the calls and the session's keychain entry. Desktop only, like
# the reqwest and rustls it is called with.
halonic-owner-sign-in = { path = "crates/owner-sign-in" }
# The updater's own reqwest, named only so src/updates_proxy.rs can give its
# client a proxy and a redirect policy; the bucket check for a Scoop install
# uses the same client type on the same rules. Pinned to the version the updater
# resolves, with no features of our own, so it adds nothing to the build.
reqwest = { version = "=0.13.5", default-features = false }
# The updater's crypto provider, which it installs before it builds a client.
# The bucket check for a Scoop install builds its client without the
# updater, so it installs the same one first (src/updates_managed.rs); so do
# the proxy tests. Pinned to the version the updater resolves, so it adds
# nothing to the build.
rustls = { version = "=0.23.46", default-features = false, features = ["ring"] }
# The feedback shortcut (HAL-18778, board request on HAL-10; approved by
# Liam on HAL-18781): Tauri's official plugin, pinned with tauri: 2.4.1
# needs tauri ^2.12. Registered from Rust only, for quick ask's keys
# (`global_keys.rs`); no capability grants its commands. The feedback
# shortcut is in-window only and uses it just to check the saved text.
tauri-plugin-global-shortcut = "=2.4.1"
# One still of a screen for the feedback shortcut, in memory only.
halonic-screen-still = { path = "crates/screen-still" }

# The agent sandbox's administrator prompt, asked for from the shell's own
# window (HAL-14841). Windows only: no other system has the sandbox setup.
[target.'cfg(windows)'.dependencies]
halonic-elevate-start = { path = "crates/elevate-start" }
# Each focused app's window gets its own taskbar entry (HAL-17903).
halonic-window-app-id = { path = "crates/window-app-id" }

# The pairing scanner (HAL-12246, build plan decision 16 on HAL-12232): the
# official barcode-scanner plugin, approved in board decision 4c. The shell
# loads only its Kotlin side and drives it from Rust (src/pair_scan.rs); the
# plugin's own commands are never registered, so no page can call them.
# Pinned with tauri: 2.5.3 needs tauri ^2.12. Android only; iOS comes later.
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-barcode-scanner = "=2.5.3"

# The phone's key for each paired computer (HAL-12245), sealed by the
# Android Keystore through the shell's `device_keys` module.
halonic-device-keys = { path = "crates/device-keys" }
# The phone's end of the tunnel (HAL-12244), which the phone tunnel's
# commands dial through (HAL-15157).
halonic-tunnel = { path = "crates/tunnel" }

# The owner check before the phone answers an approval (HAL-15194, board
# decision 4b): Android's own BiometricPrompt, strong biometrics only,
# through the shell's `owner_check` module. No plugin from outside.
halonic-owner-check = { path = "crates/owner-check" }

# Tauri's mock runtime, for the test that every command is refused from the
# served page.
[dev-dependencies]
tauri = { version = "=2.12.5", features = ["test"] }
# The .ico picker, so every platform tests each app's window icons (HAL-19716).
halonic-window-app-id = { path = "crates/window-app-id" }

[lints]
workspace = true

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# The app version. Set from apps/studio/package.json by `pnpm version:sync`;
# never edit it by hand. Every crate inherits it.
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# A release build on Windows has no console: what the shell prints to
# stderr goes nowhere. It records through `halonic-shell-log` instead.
print_stderr = "deny"

# The agent host's Noise session, built to WebAssembly (HAL-12236):
#   cargo rustc -p halonic-e2e-noise-wasm --profile noise-wasm --locked \
#     --target wasm32-unknown-unknown --crate-type cdylib
# One codegen unit, no debug info and stripped, so CI can build it again and
# compare it with the committed file byte for byte. A panic aborts, which in
# WebAssembly is a trap that ends the session.
[profile.noise-wasm]
inherits = "release"
codegen-units = 1
lto = true
panic = "abort"
debug = false
strip = true
