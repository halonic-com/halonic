# The Rust version for the Studio shell's crates. It sits here, not at the
# repo root, so a change to it runs the `tauri` CI job. It must stay at or
# above Tauri 2's minimum Rust version. The Android targets are added with
# the shell (HAL-192).
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
