# pnpm 12 reads every setting from this file (only login and registry
# settings may live in .npmrc). Unknown settings are errors, so typos fail.

packages:
  - apps/*
  - packages/core/*
  - packages/adapters/*
  - packages/host/*
  - packages/targets/*/*
  - packages/studio/*
  - packages/studio/features/*
  - packages/testing/*
  - tooling/*

# One version line per shared dependency. Packages use "catalog:" and the
# check fails on any other version for an external dependency.
catalog:
  "@anthropic-ai/sandbox-runtime": 0.0.81
  "@biomejs/biome": 2.6.5
  "@changesets/cli": ^3.0.3
  "@playwright/test": ^1.65.0
  "@stryker-mutator/core": ^10.1.1
  "@stryker-mutator/vitest-runner": ^10.1.1
  "@tailwindcss/vite": ^4.3.4
  "@tauri-apps/cli": 2.12.4
  "@types/node": ^26.6.6
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@typescript/typescript6": ^6.0.2
  "@vitest/coverage-v8": ^5.1.0
  esbuild: 0.28.2
  fast-check: ^4.10.2
  jsdom: ^30.1.3
  react: ^19.3.1
  react-dom: ^19.3.1
  tailwindcss: ^4.3.4
  turbo: ^2.11.10
  typescript: ^7.0.2
  vite: ^8.3.5
  vitest: ^5.1.0
  yaml: 2.9.1
  zod: 4.6.7

# Our scope always comes from npm, also on a machine with another default
# registry. A backstop only: owning @halonicjs is the real protection (3.2).
registries:
  "@halonicjs": https://registry.npmjs.org/

# Always write the tarball URL, even for the default registry, so the
# lockfile check can prove every package came from registry.npmjs.org. pnpm
# leaves it out when it equals the default, so a mirror would look like npm.
lockfileIncludeTarballUrl: true

# --- Install hardening ---

# Install scripts run only for packages listed here; unlisted ones fail.
allowBuilds:
  "@biomejs/biome": false
  esbuild: false
  turbo: false

# New releases must be 3 days old (minutes). For an urgent security fix, add
# the package to minimumReleaseAgeExclude in its own pull request.
minimumReleaseAge: 4320
minimumReleaseAgeExclude: []

# No git or tarball URLs anywhere in the dependency tree.
blockExoticSubdeps: true

# Fail when a package loses its trusted-publisher status (a hijack sign).
trustPolicy: no-downgrade

# One shared copy of the dependencies for every agent worktree.
enableGlobalVirtualStore: true

# Workspace packages are always linked, never copied, so TypeScript never
# sits inside node_modules (Node refuses to strip types there).
linkWorkspacePackages: true
# Our own packages are always "workspace:*" (pnpm check enforces it). With
# rolling, `pnpm add @halonicjs/<name> --workspace` writes exactly that; a
# plain `pnpm add` writes "workspace:^", and no setting changes that in
# pnpm 12 (savePrefix and saveExact don't apply to rolling).
saveWorkspaceProtocol: rolling

# Security override, allowed only through tooling/check/overrides-allowed.json
# (HAL-1928). Value must equal the catalog version of zod.
overrides:
  "@anthropic-ai/sandbox-runtime>zod": 4.6.7
patchedDependencies:
  "@anthropic-ai/sandbox-runtime@0.0.81": patches/@anthropic-ai__sandbox-runtime@0.0.81.patch
