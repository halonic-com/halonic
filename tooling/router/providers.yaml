# The models the variant router may pick from (HAL-16998, architecture note
# section 9 on HAL-16984). This is a plain `models.yaml`: it is read with the
# workspace format's own schema, so it can move to Halonic Code unchanged.
# What only the router needs (data class, pinned host, status) lives next to
# it in `providers.router.yaml`; every alias here needs an entry there.
#
# Prices are API list prices per million tokens, in US dollars, for every run,
# subscription runs included (Q4). A change here changes the catalog's
# `price_version`, so older cost-per-pass numbers keep the prices they used.
version: 1
aliases:
  opus:
    description: Today's production model and the router's fallback.
    provider: anthropic
    model: claude-opus-5-5
    price: { input: 4, output: 20, cacheRead: 0.2, cacheWrite: 5, cacheWrite1h: 8 }
  sonnet:
    provider: anthropic
    model: claude-sonnet-5-5
    price: { input: 2, output: 10, cacheRead: 0.2, cacheWrite: 2.5, cacheWrite1h: 4 }
  haiku:
    provider: anthropic
    model: claude-haiku-4-5
    price: { input: 1, output: 5, cacheRead: 0.1, cacheWrite: 1.25, cacheWrite1h: 2 }
  deepseek-flash:
    description: DeepSeek V4.1 Flash through OpenRouter, on the host pinned in providers.router.yaml.
    provider: openrouter
    model: deepseek/deepseek-v4.1-flash-1017
    # DeepInfra fp8's price on OpenRouter, 23 Nov 2026.
    price: { input: 0.098, output: 0.294, cacheRead: 0.00294 }
