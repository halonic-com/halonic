# halonic-ci pool policy, read by the image's job-started hook (mounted read-only).
# Phase 1 (Timothy, 21 Nov 2026): never pull requests. merge_group only after Julian's
# real-fork test (T1). SMOKE_* allows one test workflow on one own branch; empty = off.
# Pull requests go only to the fast pool (pool-fast.conf); this pool must never list them.
ALLOWED_EVENTS="push"
SMOKE_BRANCH=""
SMOKE_WORKFLOW=""
