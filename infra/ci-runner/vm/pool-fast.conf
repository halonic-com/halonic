# halonic-ci fast pool policy (HAL-15972), the VM's /etc/halonic-ci/pool-fast/pool.conf, read by
# the image's job-started hook (mounted read-only) in fast-* slots only. Pull requests only, and
# the hook still checks each one with the VM's gate: open, from a halonic-com/halonic branch, still
# at the event's commit, labelled fast-track, opened by a person, not a bot (HAL-17463, HAL-17616).
# PR_SCOPE="all" drops only the label (HAL-17654): every open pull request a person opened from a
# halonic-com/halonic branch is admitted. Set it before the repo variable CI_FAST_SCOPE says "all";
# any other value, or no line, keeps the label required.
# The slot script refuses to start a fast slot without POOL="fast", and any other slot whose
# pool.conf has it or lists pull_request.
POOL="fast"
ALLOWED_EVENTS="pull_request"
SMOKE_BRANCH=""
SMOKE_WORKFLOW=""
PR_SCOPE="fast-track"
