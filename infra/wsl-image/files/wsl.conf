# Halonic's own WSL distro (HAL-3779, section 5.2).
# Windows programs can't be started from inside, and no Windows drive is
# mounted (not even from /etc/fstab): the sandbox and the projects live in
# this distro only.
[interop]
enabled=false
appendWindowsPath=false

[automount]
enabled=false
mountFsTab=false

[user]
default=halonic

[boot]
systemd=false
# Root makes the folder for the Windows-drive projects at every start. A session
# denies it as a whole (security review W1) and refuses to open without it.
command="install -d -m 0755 -o root -g root /mnt/halonic"
