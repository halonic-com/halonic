# Halonic's own WSL distro (HAL-3779, section 5.2).
# Windows programs can't be started from inside, and no Windows drive is
# mounted (not even from /etc/fstab): the sandbox and the projects live in
# this distro only.
[interop]
enabled=false
appendWindowsPath=false

[automount]
enabled=false
mountFsTab=false

[user]
default=halonic

[boot]
systemd=false
