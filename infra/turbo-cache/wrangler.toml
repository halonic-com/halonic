# Deployed through the Cloudflare connection. Secret: TURBO_TOKEN.
name = "halonic-turbo-cache"
main = "worker.mjs"
compatibility_date = "2026-06-15"

[[r2_buckets]]
binding = "R2_STORE"
bucket_name = "halonic-turbo-cache"

# The spend switch (see ../spend-guard/README.md).
[[kv_namespaces]]
binding = "SPEND_KV"
id = "646a6e2ba633475da4ecf9502cd8ce25"
