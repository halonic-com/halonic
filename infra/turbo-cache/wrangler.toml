# Deployed through the Cloudflare connection. The deployed Worker must have all the bindings below.
name = "halonic-turbo-cache"
main = "worker.mjs"
compatibility_date = "2026-06-15"

[[r2_buckets]]
binding = "R2_STORE"
bucket_name = "halonic-turbo-cache"

# Write token (reads and uploads), only for main and the merge queue. Account-level Secrets Store secret, read with `await env.TURBO_TOKEN.get()`.
[[secrets_store_secrets]]
binding = "TURBO_TOKEN"
store_id = "3a2182643c7a4eea82e266e47d982d70"
secret_name = "TURBO_TOKEN"

# Read-only token, for pull requests. It can read and query, never upload.
[[secrets_store_secrets]]
binding = "TURBO_TOKEN_READ"
store_id = "3a2182643c7a4eea82e266e47d982d70"
secret_name = "TURBO_TOKEN_READ"

# The spend switch (see ../spend-guard/README.md). The live Worker had no SPEND_KV before this
# change: deploy the new source and this binding together, or every request gets a 503.
[[kv_namespaces]]
binding = "SPEND_KV"
id = "646a6e2ba633475da4ecf9502cd8ce25"
