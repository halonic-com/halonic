title: "[Question] "
body:
  - type: markdown
    attributes:
      value: |
        Something broken rather than unclear? Use the [bug report form](https://github.com/halonic-com/halonic/issues/new?template=bug-report.yml) instead.
        Security problems never go here: see [SECURITY.md](https://github.com/halonic-com/halonic/blob/main/SECURITY.md).
        Never paste API keys, passwords or personal data, including in logs and screenshots.
  - type: textarea
    id: question
    attributes:
      label: What are you trying to do?
      description: What you did, what you expected, and what happened.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Halonic version and operating system
      placeholder: e.g. 0.1.0 on Windows 11
  - type: textarea
    id: details
    attributes:
      label: Run log, files or error messages
      description: Remove keys, tokens and personal data first.
      render: text
