body:
  - type: textarea
    id: problem
    attributes:
      label: What problem do you have?
      description: What were you trying to do, and what got in the way? Start here, before the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could Halonic help? A rough idea is fine.
  - type: textarea
    id: today
    attributes:
      label: How do you handle it today?
      description: A workaround, another tool, or not at all.
