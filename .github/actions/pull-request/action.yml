name: Current pull request
description: >-
  Reads the pull request's current title, body, branch and labels from the API
  and writes them to a file shaped like the event file. A merge group and a
  re-run then check today's text and labels, not those from when the run
  started. The job needs `pull-requests: read`.
outputs:
  event-path:
    description: The file, or empty for a push to main (no pull request).
    value: ${{ steps.read.outputs.event-path }}
runs:
  using: composite
  steps:
    - id: read
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        NUMBER: ${{ github.event.pull_request.number }}
        REF: ${{ github.ref }}
      run: |
        if [ -z "$NUMBER" ]; then
          # A merge group's branch is gh-readonly-queue/<base>/pr-<number>-<sha>.
          # With group size 1 that is the only pull request in the group.
          NUMBER=$(sed -nE 's#^refs/heads/gh-readonly-queue/.+/pr-([0-9]+)-[0-9a-f]+$#\1#p' <<< "$REF")
        fi
        if [ -z "$NUMBER" ]; then
          echo "event-path=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        file="$RUNNER_TEMP/pull-request-event.json"
        # Many merge groups run at once, each with several jobs that read the
        # pull request, so the token's hourly API limit can run out (HAL-5146).
        # Retry only a rate limit (403/429 with a rate-limit message); any other
        # error fails at once. Never skip the read: the leak guard must see the
        # pull request's current text. The total wait stays within BUDGET (the
        # calling jobs have 15 minutes), so a long limit fails with a clear
        # error instead of a job timeout. When the hourly limit is used up,
        # wait until its reset if that fits; otherwise fail at once. Reading
        # /rate_limit doesn't count against the limit.
        BUDGET=600
        slept=0
        attempt=0
        while true; do
          attempt=$((attempt + 1))
          if gh api "repos/$REPO/pulls/$NUMBER" \
            --jq '{pull_request: {title, body, head: {ref: .head.ref}, labels: [.labels[] | {name}]}}' > "$file" 2> "$RUNNER_TEMP/pull-request-read.err"; then
            break
          fi
          cat "$RUNNER_TEMP/pull-request-read.err" >&2
          if ! grep -qiE 'rate limit|HTTP 429|abuse detection|secondary' "$RUNNER_TEMP/pull-request-read.err"; then
            echo "::error::Couldn't read pull request #$NUMBER (attempt $attempt)."
            exit 1
          fi
          remaining=$(gh api rate_limit --jq '.resources.core.remaining' 2>/dev/null || echo "")
          reset=$(gh api rate_limit --jq '.resources.core.reset' 2>/dev/null || echo "")
          if [ "$remaining" = "0" ] && [ -n "$reset" ]; then
            # Hourly limit used up: wait for the reset, plus a little jitter.
            wait=$((reset - $(date +%s) + 5 + RANDOM % 10))
            [ "$wait" -lt 5 ] && wait=5
          else
            # Secondary limit: 20 s, 40 s, 80 s, then 120 s (at most), plus jitter.
            wait=$((20 * (1 << (attempt - 1))))
            [ "$wait" -gt 120 ] && wait=120
            wait=$((wait + RANDOM % 10))
          fi
          if [ $((slept + wait)) -gt "$BUDGET" ]; then
            echo "::error::Couldn't read pull request #$NUMBER: GitHub's API rate limit won't clear within ${BUDGET}s (waited ${slept}s, next wait ${wait}s). Re-run the job later."
            exit 1
          fi
          echo "::warning::GitHub's API rate limit is reached; retrying in ${wait}s (attempt $attempt)."
          sleep "$wait"
          slept=$((slept + wait))
        done
        echo "event-path=$file" >> "$GITHUB_OUTPUT"
