name: Apt install
description: Installs Ubuntu packages, from cached .deb files when it can and from the runner's mirror, with retries, when it can't.
inputs:
  packages:
    description: The packages to install, separated by spaces.
    required: true
runs:
  using: composite
  steps:
    # The runner's mirror (azure.archive.ubuntu.com) and archive.ubuntu.com
    # couldn't be resolved for hours on 11 Nov, and every job that installs
    # packages failed (HAL-5765). So the .deb files are kept in the cache,
    # keyed on the runner image and the package list: a new image or another
    # list downloads them again. Like the pnpm store, only main writes it.
    - id: key
      name: Name the cache
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        list=$(tr ' ' '\n' <<< "$PACKAGES" | sed '/^$/d' | sort | sha256sum | cut -c1-16)
        echo "key=apt-debs-$ImageOS-$ImageVersion-$RUNNER_ARCH-$list" >> "$GITHUB_OUTPUT"
        echo "dir=$RUNNER_TEMP/apt-debs" >> "$GITHUB_OUTPUT"
    - id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.key.outputs.key }}
    # A cache hit installs without the network. A miss, or a cached set that
    # doesn't install, downloads from the mirror. Each attempt is capped,
    # because a mirror that can't be resolved stalls apt for minutes. After a
    # failed attempt the runner is pointed at the next mirror: archive.ubuntu.com,
    # then kernel.org's copy, which still answered on 11 Nov while every
    # ubuntu.com name failed to resolve.
    - id: install
      name: Install
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        DEBS: ${{ steps.key.outputs.dir }}
        CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
      run: |
        if [ "$CACHE_HIT" = "true" ] && sudo dpkg --install "$DEBS"/*.deb; then
          exit 0
        fi
        rm -rf "$DEBS" && mkdir -p "$DEBS/partial"
        apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o "Dir::Cache::archives=$DEBS")
        fallbacks=("" "http://archive.ubuntu.com/ubuntu/" "https://mirrors.edge.kernel.org/ubuntu/")
        for attempt in 1 2 3; do
          if [ -n "${fallbacks[attempt - 1]}" ] && [ -f /etc/apt/apt-mirrors.txt ]; then
            echo "${fallbacks[attempt - 1]}" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          if sudo timeout 180 apt-get "${apt_opts[@]}" update &&
            sudo timeout 300 apt-get "${apt_opts[@]}" install --yes --no-install-recommends --download-only $PACKAGES &&
            sudo apt-get "${apt_opts[@]}" install --yes --no-install-recommends $PACKAGES; then
            sudo rm -rf "$DEBS/partial" "$DEBS/lock"
            sudo chown -R "$(id -u):$(id -g)" "$DEBS"
            echo "downloaded=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::warning::apt install failed (attempt $attempt of 3)"
          sleep $((attempt * 20))
        done
        exit 1
    - if: github.ref == 'refs/heads/main' && steps.install.outputs.downloaded == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.key.outputs.key }}
