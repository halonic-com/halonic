name: gitleaks
description: Scans the checked-out history with the gitleaks image pinned in the Dockerfile next to this file. Fails on a leak, and also when no commits were scanned although some had text changes.
inputs:
  log-opts:
    description: git log options, for example BASE..HEAD. Empty scans the whole history.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Scan commits
      shell: bash
      env:
        LOG_OPTS: ${{ inputs.log-opts }}
      # The container runs as root but the checkout belongs to the runner user.
      # Without safe.directory git refuses the repo, and gitleaks scans 0 commits
      # and still reports no leaks, so the commit count is checked as well.
      # gitleaks only counts commits that change a text file it can read: a
      # commit that only touches binary or -diff files (such as pnpm-lock.yaml)
      # or only deletes files counts as 0. So the runner's own git counts those
      # commits in the same range, and 0 scanned is an error only if it found any.
      # The log only says how many leaks there are. The report also holds the
      # author, email and commit message, which may be personal, so only the
      # commit, file, line and rule are printed from it. A pull request author
      # picks the file names, so each field is encoded as the workflow-command
      # spec requires. Otherwise a newline in a name could start a new command.
      run: |
        image=$(sed -n 's/^FROM //p' "$GITHUB_ACTION_PATH/Dockerfile")
        args=(git --redact --no-banner --exit-code 1 --report-format json --report-path /out/gitleaks.json)
        if [ -n "$LOG_OPTS" ]; then
          args+=("--log-opts=$LOG_OPTS")
        fi
        log="$RUNNER_TEMP/gitleaks.log"
        set +e
        docker run --rm -v "$GITHUB_WORKSPACE:/repo" -v "$RUNNER_TEMP:/out" -w /repo \
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
          "$image" "${args[@]}" . > "$log" 2>&1
        status=$?
        set -e
        cat "$log"
        if [ -s "$RUNNER_TEMP/gitleaks.json" ]; then
          jq -r 'def escape: tostring | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
            .[] | "::error title=gitleaks::commit \(.Commit[0:7] | escape), \(.File | escape):\(.StartLine) [\(.RuleID | escape)]"' "$RUNNER_TEMP/gitleaks.json"
        fi
        rm -f "$RUNNER_TEMP/gitleaks.json"
        scanned=$(grep -oE '[0-9]+ commits scanned' "$log" | grep -oE '^[0-9]+' || true)
        if ! [[ "$scanned" =~ ^[0-9]+$ ]]; then
          echo "::error title=gitleaks::The log does not say how many commits were scanned, so the scan proves nothing. See the log above."
          exit 1
        fi
        if [ "$scanned" -eq 0 ]; then
          if [ -n "$LOG_OPTS" ]; then
            read -ra range <<< "$LOG_OPTS"
          else
            range=(--all)
          fi
          scannable=$(git log --format=%x01 --numstat --diff-filter=d "${range[@]}" -- |
            awk '/^\x01/ { counted = 0; next } !counted && /^[0-9]+\t/ { counted = 1; n++ } END { print n + 0 }')
          if [ "$scannable" -gt 0 ]; then
            echo "::error title=gitleaks::No commits were scanned, but $scannable commits change text files, so the scan proves nothing. See the log above."
            exit 1
          fi
          echo "::notice title=gitleaks::No commit in the range changes a text file (only binary, -diff or deleted files), so there was nothing to scan."
        fi
        exit "$status"
