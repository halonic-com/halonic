name: gitleaks
description: Scans the checked-out history with the gitleaks image pinned in the Dockerfile next to this file, lockfiles included. Fails on a leak, and also when no commits were scanned.
inputs:
  log-opts:
    description: git log options, for example BASE..HEAD. Empty scans the whole history.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Scan commits
      shell: bash
      env:
        LOG_OPTS: ${{ inputs.log-opts }}
      # The container runs as root but the checkout belongs to the runner user.
      # Without safe.directory git refuses the repo, and gitleaks scans 0 commits
      # and still reports no leaks, so the commit count is checked as well.
      # A -diff or binary line in .gitattributes, which a pull request can add,
      # makes git log show no text for a file, so the file is not scanned and
      # a pull request that only changes it scans 0 commits. info/attributes
      # wins over .gitattributes and makes every file text for the scan.
      # The log only says how many leaks there are. The report also holds the
      # author, email and commit message, which may be personal, so only the
      # commit, file, line and rule are printed from it. A pull request author
      # picks the file names, so each field is encoded as the workflow-command
      # spec requires. Otherwise a newline in a name could start a new command.
      run: |
        image=$(sed -n 's/^FROM //p' "$GITHUB_ACTION_PATH/Dockerfile")
        mkdir -p "$GITHUB_WORKSPACE/.git/info"
        echo '* diff' >> "$GITHUB_WORKSPACE/.git/info/attributes"
        args=(git --redact --no-banner --exit-code 1 --report-format json --report-path /out/gitleaks.json)
        if [ -n "$LOG_OPTS" ]; then
          args+=("--log-opts=$LOG_OPTS")
        fi
        log="$RUNNER_TEMP/gitleaks.log"
        set +e
        docker run --rm -v "$GITHUB_WORKSPACE:/repo" -v "$RUNNER_TEMP:/out" -w /repo \
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
          "$image" "${args[@]}" . > "$log" 2>&1
        status=$?
        set -e
        cat "$log"
        if [ -s "$RUNNER_TEMP/gitleaks.json" ]; then
          jq -r 'def escape: tostring | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
            .[] | "::error title=gitleaks::commit \(.Commit[0:7] | escape), \(.File | escape):\(.StartLine) [\(.RuleID | escape)]"' "$RUNNER_TEMP/gitleaks.json"
        fi
        rm -f "$RUNNER_TEMP/gitleaks.json"
        scanned=$(grep -oE '[0-9]+ commits scanned' "$log" | grep -oE '^[0-9]+' || true)
        if ! [[ "$scanned" =~ ^[1-9][0-9]*$ ]]; then
          echo "::error title=gitleaks::No commits were scanned, so the scan proves nothing. See the log above."
          exit 1
        fi
        exit "$status"

    - name: Scan lockfile changes
      shell: bash
      env:
        LOG_OPTS: ${{ inputs.log-opts }}
      # The default gitleaks config skips lockfiles by path, and a config that
      # extends it cannot take that back. So the lines the commits add to
      # lockfiles go to gitleaks stdin, which has no path to skip. A token in a
      # tarball URL is the leak this catches. where.txt holds the commit, file
      # and line of each scanned line, so a finding still points at its source.
      # A +++ line is a file header only between diff --git and the first hunk.
      # In a hunk it is an added line that starts with ++.
      run: |
        set -o pipefail
        image=$(sed -n 's/^FROM //p' "$GITHUB_ACTION_PATH/Dockerfile")
        read -ra range <<< "${LOG_OPTS:---all}"
        lockfiles=(':(glob)**/pnpm-lock.yaml' ':(glob)**/package-lock.json' ':(glob)**/npm-shrinkwrap.json' ':(glob)**/yarn.lock' ':(glob)**/deno.lock')
        added="$RUNNER_TEMP/lockfiles.txt"
        where="$RUNNER_TEMP/where.txt"
        git log -p --text -U0 --full-history --no-color --format='commit %h' "${range[@]}" -- "${lockfiles[@]}" |
          awk -v where="$where" '
            /^commit [0-9a-f]+$/ { commit = $2; next }
            /^diff --git / { header = 1; next }
            header && /^\+\+\+ / { file = substr($0, 7); next }
            /^@@ / { header = 0; split($3, start, ","); line = substr(start[1], 2) + 0; next }
            /^\+/ { print substr($0, 2); print commit ", " file ":" line > where; line++ }
          ' > "$added"
        if ! [ -s "$added" ]; then
          echo "No lines added to a lockfile, nothing to scan."
          exit 0
        fi
        set +e
        docker run --rm -i -v "$RUNNER_TEMP:/out" "$image" \
          stdin --redact --no-banner --exit-code 1 --report-format json --report-path /out/lockfiles.json < "$added"
        status=$?
        set -e
        if [ -s "$RUNNER_TEMP/lockfiles.json" ]; then
          jq -r --rawfile where "$where" 'def escape: tostring | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
            ($where | split("\n")) as $w
            | .[] | "::error title=gitleaks::commit \($w[.StartLine - 1] | escape) [\(.RuleID | escape)]"' "$RUNNER_TEMP/lockfiles.json"
        fi
        rm -f "$RUNNER_TEMP/lockfiles.json" "$added" "$where"
        exit "$status"
