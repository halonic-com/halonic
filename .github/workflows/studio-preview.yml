# An early, unsigned Windows build of the Studio for the board to try
# (HAL-5379). Not a release of halonic: no tag or GitHub Release here. Run it
# by hand on main:
#
#   gh workflow run studio-preview.yml --ref main
#
# It builds the installer as CI's installer-windows job does (HAL-1202), as
# version <next patch>-preview.<run number> (HAL-18308), installs an
# installer with the release version and then updates it with the preview,
# silently, checks that Halonic starts and keeps running, and keeps the
# setup .exe as a 7-day artifact.
#
# A build of main whose installer builds, updates the release version and
# keeps running is then published as a pre-release of
# halonic-com/halonic-preview, "Preview, not for general use", signed for the
# updater with the Preview key (HAL-18477, board decision on HAL-18474,
# standing yes). A run on any other branch publishes nothing. Stable builds go to this repo's
# releases only through release.yml, after the board's release card.

name: Studio preview (Windows, unsigned)

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: studio-preview
  cancel-in-progress: false

jobs:
  installer:
    name: Build and start the unsigned Windows installer
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: false
      - name: Install the pinned Rust toolchain
        working-directory: apps/studio/src-tauri
        run: rustup toolchain install
      # Each preview gets its own, higher version, so the installer updates
      # the one before it instead of offering to run again (HAL-18308).
      - name: Choose the preview version
        id: version
        working-directory: apps/studio/src-tauri
        run: |
          $version = node windows/preview-version.mjs tauri.conf.json $env:GITHUB_RUN_NUMBER
          if ($LASTEXITCODE -ne 0) { throw 'preview-version.mjs failed' }
          @{ version = $version } | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP/preview.conf.json" -Encoding utf8NoBOM
          "PREVIEW_VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build the installer
        working-directory: apps/studio/src-tauri
        run: pwsh windows/build-installer.ps1 -Config "$env:RUNNER_TEMP/preview.conf.json"
      # An installer with the release version, as every preview before
      # HAL-18308 had, from the same build. The upgrade check installs it first.
      - name: Pack an installer with the release version
        working-directory: apps/studio/src-tauri
        run: |
          pwsh windows/build-installer.ps1 -Step pack
          if ($LASTEXITCODE -ne 0) { throw 'packing the release-version installer failed' }
          $release = (Get-Content tauri.conf.json -Raw | ConvertFrom-Json).version
          Move-Item "../../../dist/Halonic-$release-windows-x64-setup.exe" "$env:RUNNER_TEMP/older-setup.exe"
      - name: Install the older one, update it silently and check that Halonic starts
        run: |
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Halonic'
          $setup = Resolve-Path "dist/Halonic-$env:PREVIEW_VERSION-windows-x64-setup.exe"
          foreach ($installer in "$env:RUNNER_TEMP/older-setup.exe", $setup) {
            $p = Start-Process $installer -ArgumentList '/S' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "$(Split-Path -Leaf $installer) exited with $($p.ExitCode)" }
            "$(Split-Path -Leaf $installer): installed $((Get-ItemProperty $key).DisplayVersion)"
          }
          $installed = (Get-ItemProperty $key).DisplayVersion
          if ($installed -ne $env:PREVIEW_VERSION) { throw "Installed apps shows $installed, not $env:PREVIEW_VERSION" }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Halonic\Halonic.exe'
          if (-not (Test-Path $exe)) { throw "Halonic isn't in the default folder" }
          $app = Start-Process $exe -PassThru
          Start-Sleep -Seconds 20
          if ($app.HasExited) { throw "Halonic closed by itself with exit code $($app.ExitCode)" }
          Stop-Process -Id $app.Id -Force
          $mb = [math]::Round((Get-Item $setup).Length / 1MB)
          "### Studio preview`n`n$(Split-Path -Leaf $setup), $mb MB, unsigned. Updated the release version to $installed, and still running after 20 s." >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: halonic-studio-preview-windows
          path: dist/Halonic-*-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    # Only a build of main whose installer built, installed over the release
    # version and kept running (board, HAL-18477, 25 Nov: until the click
    # test works and is quick, publishing doesn't wait for it). The
    # preview-publish environment (main only) holds the Preview updater key
    # and a token that can write releases to halonic-preview and nothing
    # else; this repo's token stays read-only.
    name: Publish to halonic-preview as a pre-release
    needs: installer
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: preview-publish
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.installer.outputs.version }}
      PREVIEW_REPO: halonic-com/halonic-preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: halonic-studio-preview-windows
          path: dist
      - name: Name the installer
        run: echo "INSTALLER=Halonic-$VERSION-windows-x64-setup.exe" >> "$GITHUB_ENV"
      # Signs the installer with the Preview key, checks the signature
      # against the Preview public key in updater-keys.json, and writes
      # latest.json with the url on halonic-preview.
      - uses: $/.github/actions/updater-manifest
        with:
          tag: v${{ env.VERSION }}
          version: ${{ env.VERSION }}
          installer: ${{ env.INSTALLER }}
          dry-run: "false"
          key: preview
          repo: halonic-com/halonic-preview
          private-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # The updater reads the signature from latest.json; the .sig file is
      # the same text, next to the installer, for anyone checking by hand.
      - name: Put the signature next to the installer
        run: |
          jq -r '.platforms["windows-x86_64"].signature' dist/latest.json > "dist/$INSTALLER.sig"
          (cd dist && sha256sum "$INSTALLER.sig" >> SHA256SUMS)
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ secrets.PREVIEW_PUBLISH_TOKEN }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          notes="Preview, not for general use. Unsigned Windows build of $SOURCE, built, installed and started in $RUN. Halonic installs set to the Preview update track update to it; stable releases are on $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases."
          gh release create "v$VERSION" --repo "$PREVIEW_REPO" --target main --prerelease --latest=false \
            --title "Halonic $VERSION (Preview, not for general use)" --notes "$notes" \
            "dist/$INSTALLER" "dist/$INSTALLER.sig" dist/latest.json dist/SHA256SUMS
          echo "Published [v$VERSION]($GITHUB_SERVER_URL/$PREVIEW_REPO/releases/tag/v$VERSION) to $PREVIEW_REPO as a pre-release." >> "$GITHUB_STEP_SUMMARY"
