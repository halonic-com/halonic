# An early, unsigned Windows build of the Studio for the board to try
# (HAL-5379). Not a release: no tag, no GitHub Release, nothing published.
# Run it by hand on main:
#
#   gh workflow run studio-preview.yml --ref main
#
# It builds the installer as CI's installer-windows job does (HAL-1202), as
# version <next patch>-preview.<run number> (HAL-18308), installs an
# installer with the release version and then updates it with the preview,
# silently, checks that Halonic starts and keeps running, and keeps the
# setup .exe as a 7-day artifact.
#
# The repo is public, so any signed-in GitHub user can download an artifact
# of this run. Sharing that file counts as publishing (HAL-5379 plan, step 2):
# run it only once the board has approved how the file reaches them.

name: Studio preview (Windows, unsigned)

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: studio-preview
  cancel-in-progress: false

jobs:
  installer:
    name: Build and start the unsigned Windows installer
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: false
      - name: Install the pinned Rust toolchain
        working-directory: apps/studio/src-tauri
        run: rustup toolchain install
      # Each preview gets its own, higher version, so the installer updates
      # the one before it instead of offering to run again (HAL-18308).
      - name: Choose the preview version
        working-directory: apps/studio/src-tauri
        run: |
          $version = node windows/preview-version.mjs tauri.conf.json $env:GITHUB_RUN_NUMBER
          if ($LASTEXITCODE -ne 0) { throw 'preview-version.mjs failed' }
          @{ version = $version } | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP/preview.conf.json" -Encoding utf8NoBOM
          "PREVIEW_VERSION=$version" >> $env:GITHUB_ENV
      - name: Build the installer
        working-directory: apps/studio/src-tauri
        run: pwsh windows/build-installer.ps1 -Config "$env:RUNNER_TEMP/preview.conf.json"
      # An installer with the release version, as every preview before
      # HAL-18308 had, from the same build. The upgrade check installs it first.
      - name: Pack an installer with the release version
        working-directory: apps/studio/src-tauri
        run: |
          pwsh windows/build-installer.ps1 -Step pack
          if ($LASTEXITCODE -ne 0) { throw 'packing the release-version installer failed' }
          $release = (Get-Content tauri.conf.json -Raw | ConvertFrom-Json).version
          Move-Item "../../../dist/Halonic-$release-windows-x64-setup.exe" "$env:RUNNER_TEMP/older-setup.exe"
      - name: Install the older one, update it silently and check that Halonic starts
        run: |
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Halonic'
          $setup = Resolve-Path "dist/Halonic-$env:PREVIEW_VERSION-windows-x64-setup.exe"
          foreach ($installer in "$env:RUNNER_TEMP/older-setup.exe", $setup) {
            $p = Start-Process $installer -ArgumentList '/S' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "$(Split-Path -Leaf $installer) exited with $($p.ExitCode)" }
            "$(Split-Path -Leaf $installer): installed $((Get-ItemProperty $key).DisplayVersion)"
          }
          $installed = (Get-ItemProperty $key).DisplayVersion
          if ($installed -ne $env:PREVIEW_VERSION) { throw "Installed apps shows $installed, not $env:PREVIEW_VERSION" }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Halonic\Halonic.exe'
          if (-not (Test-Path $exe)) { throw "Halonic isn't in the default folder" }
          $app = Start-Process $exe -PassThru
          Start-Sleep -Seconds 20
          if ($app.HasExited) { throw "Halonic closed by itself with exit code $($app.ExitCode)" }
          Stop-Process -Id $app.Id -Force
          $mb = [math]::Round((Get-Item $setup).Length / 1MB)
          "### Studio preview`n`n$(Split-Path -Leaf $setup), $mb MB, unsigned. Updated the release version to $installed, and still running after 20 s." >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: halonic-studio-preview-windows
          path: dist/Halonic-*-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 7
