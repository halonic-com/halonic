# Release workflow: builds the release files and creates a DRAFT GitHub
# Release. It never publishes: a person publishes the draft by hand.
#
# Today it is a dry-run skeleton. The CLI is packed from a stub and the
# installer is a placeholder text file, so the whole path (tag, build,
# checksums, draft release) is tested before the real app exists. The
# updater files are added by their own task. The APK comes from the Android
# Play build (android-play.yml), called on real runs only: it is the APK
# Play signed, checked against Play's app signing key. Dry runs ship a
# placeholder so the file name and checksum path are tested. On a real run
# its three `release` jobs (sign, play-upload, play-apk) each wait for an
# approval, one after another, besides the one for sign-windows.
#
# Windows signing has two jobs:
# - sign-test (dry runs): signs a tiny test program with a throwaway
#   self-signed certificate and a real timestamp, then checks the result.
#   It proves the signing and timestamping steps work. It holds no secret.
# - sign-windows (real runs): signs the installer with Azure Artifact
#   Signing (formerly Trusted Signing). It runs only in the `release`
#   environment, whose secrets and variables hold the Azure details. No
#   credential is written in this file.
#
# Both then sign the final installer for the Tauri updater and write
# latest.json (signature inside, no .sig file) and SHA256SUMS, with the
# updater-manifest action (HAL-7222). Dry runs use a throwaway key made in
# the job; real runs use the updater key, a secret of the `release`
# environment. It is the same job as the Authenticode signing, so a release
# needs one approval, not two.
#
# Run it without a tag from the Actions tab (dry_run on), or push a tag
# that starts with `v`. A tag that contains `-test` is always a dry run.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name for the draft release, for example v0.0.0-test.1"
        required: true
        type: string
      dry_run:
        description: "Dry run: placeholder files, draft marked as a test"
        required: true
        default: true
        type: boolean

permissions: {}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release files
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
      version: ${{ steps.plan.outputs.version }}
      installer: ${{ steps.plan.outputs.installer }}
      apk: ${{ steps.plan.outputs.apk }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false
      - id: plan
        name: Decide tag, version and dry run
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
            dry_run="$INPUT_DRY_RUN"
          else
            tag="$REF_NAME"
            dry_run=false
          fi
          case "$tag" in
            v[0-9]*) ;;
            *) echo "::error::Tag '$tag' must look like v0.1.0"; exit 1 ;;
          esac
          case "$tag" in *-test*) dry_run=true ;; esac
          version="${tag#v}"
          # The release file names live here and nowhere else. They are the
          # names agreed in HAL-1119.
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "dry_run=$dry_run"
            echo "installer=Halonic-$version-windows-x64-setup.exe"
            echo "apk=Halonic-$version-android.apk"
            echo "cli_tarball=halonic-cli-$version.tgz"
          } >> "$GITHUB_OUTPUT"
      - name: Refuse a real release until the real build exists
        if: steps.plan.outputs.dry_run != 'true'
        run: |
          echo "::error::Only dry runs are supported. The real Studio build is not wired in yet."
          exit 1
      - name: Build the CLI package (stub)
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          CLI_TARBALL: ${{ steps.plan.outputs.cli_tarball }}
        run: |
          mkdir -p cli-package cli-stub
          cat > cli-stub/package.json <<JSON
          {"name": "halonic-cli-stub", "version": "$VERSION", "private": true,
           "description": "Placeholder for the CLI package in release dry runs."}
          JSON
          echo "console.log('placeholder')" > cli-stub/index.js
          (cd cli-stub && npm pack --pack-destination ../cli-package --silent)
          mv cli-package/halonic-cli-stub-*.tgz "cli-package/$CLI_TARBALL"
      - name: Make the placeholder installer
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          INSTALLER: ${{ steps.plan.outputs.installer }}
        run: |
          mkdir -p dist
          printf 'Placeholder installer for release dry run %s. Not an installer.\n' "$VERSION" \
            > "dist/$INSTALLER"
      - uses: $/.github/actions/setup
      # The Rust crates' licences are read with `cargo metadata`, on the
      # toolchain pinned in rust-toolchain.toml.
      - name: Install the pinned Rust toolchain
        working-directory: apps/studio/src-tauri
        run: rustup toolchain install
      # The SBOM tool is `pnpm sbom` (pinned by packageManager), so no new
      # tool is added. Until the CLI package exists, both SBOMs cover every
      # production dependency of the workspace, as the installer's notices
      # do (build-installer.ps1). The check fails the run when a library is
      # not on tooling/check/dependencies.json or a ref in the dependency
      # graph names no component. THIRD-PARTY-NOTICES.txt is written once,
      # with the app: it also lists the Rust crates the app links, so it
      # covers the CLI too.
      - name: Write the CLI SBOM
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: pnpm check:sbom --name halonic-cli --version "$VERSION" --out dist
      - name: Write the app SBOM and the third-party notices
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: >-
          pnpm check:sbom --name halonic-studio --version "$VERSION" --out dist --notices
          --cargo apps/studio/src-tauri --cargo-target x86_64-pc-windows-msvc
      - name: Write the checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      # The CLI ships on npm, not on the release. Keep the exact bytes as
      # their own artifact so the later npm publish step uses them.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-package
          path: cli-package/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 7

  sign-test:
    name: Sign test files (dry run)
    needs: build
    if: needs.build.outputs.dry_run == 'true'
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Make a test program
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force sign-test | Out-Null
          Set-Content -Path sign-test/test.cs -Value 'class T { static void Main() { System.Console.WriteLine("test"); } }'
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /out:sign-test\halonic-sign-test.exe sign-test\test.cs
          if ($LASTEXITCODE -ne 0) { throw "csc failed" }
      - name: Sign it with a throwaway certificate and a timestamp
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert `
            -Subject "CN=Halonic release dry run (not trusted)" `
            -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(1)
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /sha1 $cert.Thumbprint /fd SHA256 `
            /tr http://timestamp.acs.microsoft.com /td SHA256 sign-test/halonic-sign-test.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool sign failed" }
          Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)"
      - name: Check the signature and the timestamp
        shell: pwsh
        run: |
          # The throwaway certificate is not trusted, so the status is
          # UnknownError or NotTrusted. What matters is that a signature is
          # present and that a timestamp countersignature is attached.
          $sig = Get-AuthenticodeSignature sign-test/halonic-sign-test.exe
          if (-not $sig.SignerCertificate) { throw "No signature on the test file" }
          if (-not $sig.TimeStamperCertificate) { throw "No timestamp on the test file" }
          "Signed by: $($sig.SignerCertificate.Subject)"
          "Timestamped by: $($sig.TimeStamperCertificate.Subject)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - uses: $/.github/actions/updater-manifest
        with:
          tag: ${{ needs.build.outputs.tag }}
          version: ${{ needs.build.outputs.version }}
          installer: ${{ needs.build.outputs.installer }}
          dry-run: "true"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files-signed
          path: dist/
          if-no-files-found: error
          retention-days: 7

  sign-windows:
    name: Sign the Windows installer
    needs: build
    if: needs.build.outputs.dry_run != 'true'
    runs-on: windows-2025
    timeout-minutes: 15
    # The only job that can reach the signing identity. Required reviewers
    # and the branch and tag rule are set on this environment, not here.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # For the Tauri CLI. No dependency runs an install script
      # (allowBuilds in pnpm-workspace.yaml).
      - uses: $/.github/actions/setup
        with:
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      # Signs in with the app registration's federated identity (OIDC), so
      # there is no client secret. The three ids are secrets of the
      # `release` environment.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.SIGNING_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Check the signature
        shell: pwsh
        env:
          INSTALLER: ${{ needs.build.outputs.installer }}
        run: |
          $sig = Get-AuthenticodeSignature "dist/$env:INSTALLER"
          if ($sig.Status -ne "Valid") { throw "Installer signature is $($sig.Status)" }
          if (-not $sig.TimeStamperCertificate) { throw "Installer has no timestamp" }
      # Signing changed the installer's bytes, so the updater signature is
      # made here, over the signed file, and the checksums are written again.
      - uses: $/.github/actions/updater-manifest
        with:
          tag: ${{ needs.build.outputs.tag }}
          version: ${{ needs.build.outputs.version }}
          installer: ${{ needs.build.outputs.installer }}
          dry-run: "false"
          private-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files-signed
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Real runs only. The called workflow uploads to Play, waits for the APK
  # Play signed and checks it (HAL-1203). It shares its artifacts with this
  # run, so draft-release can pick the APK up.
  android:
    name: Android APK signed by Play
    needs: build
    if: needs.build.outputs.dry_run != 'true'
    permissions:
      contents: read
      id-token: write
    # The called workflow runs at the release's own commit.
    uses: ./.github/workflows/android-play.yml # zizmor: ignore[self-repository]
    with:
      dry_run: false
      version: ${{ needs.build.outputs.version }}

  draft-release:
    name: Create draft release
    needs: [build, sign-test, sign-windows, android]
    # Exactly one of the two signing jobs runs. Skipped is fine, failed or cancelled (e.g. timed out) is not.
    if: ${{ !cancelled() && needs.build.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # Both signing jobs upload this. Dry runs ship the placeholders.
          name: release-files-signed
          path: dist
      # Real runs: the APK exactly as Play signed it, under its release
      # name. Dry runs: a placeholder. Either way it gets its line in
      # SHA256SUMS, after the Windows signing has rewritten the file.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.build.outputs.dry_run != 'true'
        with:
          name: android-apk-play-signed
          path: android
      - name: Add the APK and its checksum
        env:
          APK: ${{ needs.build.outputs.apk }}
          VERSION: ${{ needs.build.outputs.version }}
          DRY_RUN: ${{ needs.build.outputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            printf 'Placeholder APK for release dry run %s. Not an APK.\n' "$VERSION" > "dist/$APK"
          else
            test "$(ls android | wc -l)" = 1 || { echo "::error::Expected exactly one APK"; exit 1; }
            mv android/* "dist/$APK"
          fi
          (cd dist && sha256sum -- "$APK" >> SHA256SUMS)
      - name: Check the files
        env:
          INSTALLER: ${{ needs.build.outputs.installer }}
        run: |
          cd dist
          test -f latest.json || { echo "::error::No latest.json"; exit 1; }
          if ls -- *.sig >/dev/null 2>&1; then echo "::error::A .sig file would be published (HAL-1119)"; exit 1; fi
          jq -e --arg f "$INSTALLER" '.platforms["windows-x86_64"].url | endswith("/" + $f)' latest.json
          sha256sum -c SHA256SUMS
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          INSTALLER: ${{ needs.build.outputs.installer }}
          APK: ${{ needs.build.outputs.apk }}
          DRY_RUN: ${{ needs.build.outputs.dry_run }}
          TARGET: ${{ github.sha }}
        run: |
          title="Halonic $VERSION"
          base="https://github.com/$GH_REPO/releases/download/$TAG"
          link="[Download for Windows]($base/$INSTALLER) · [Download for Android]($base/$APK)"
          notes="$link"
          flags=()
          if [ "$DRY_RUN" = "true" ]; then
            title="DRY RUN Halonic $VERSION"
            notes="**Dry run with placeholder files. Do not publish. Delete this draft.**"$'\n\n'"$link"
            flags+=(--prerelease)
          fi
          gh release create "$TAG" dist/* --draft \
            --target "$TARGET" --title "$title" --notes "$notes" "${flags[@]}"
