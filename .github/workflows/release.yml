# Release workflow: builds the release files and creates a DRAFT GitHub
# Release. It never publishes: a person publishes the draft by hand.
#
# The CLI is the real package, built by `stage-cli` in tooling/publish and
# checked in a clean folder (HAL-9558). The installer is the real Studio build
# (HAL-7491). The updater files are added by their
# own task. The APK comes from the Android Play build (android-play.yml),
# called on real runs only: it is the APK Play signed, checked against Play's
# app signing key. Dry runs ship a placeholder so the file name and checksum
# path are tested. On a real run its three `release` jobs (sign, play-upload,
# play-apk) each wait for an approval, one after another, besides the one for
# sign-windows.
#
# The installer is built in two steps (build-installer.ps1 -Step build, then
# -Step pack), because the sandbox helper inside it must be signed before
# Tauri packs it: its UAC prompt shows its publisher, and its check of the
# copy it leaves for Installed apps relies on it (HAL-7491). The `studio` job
# compiles everything without any secret and builds the publisher into the
# helper. One of two jobs then signs the helper, packs and signs the installer:
# - sign-test (dry runs): with a throwaway self-signed certificate, trusted
#   on that runner only, and a real timestamp. It then installs the result
#   and checks that the helper inside is signed by the expected publisher and
#   accepts its own copy. It holds no secret.
# - sign-windows (real runs): with Azure Artifact Signing (formerly Trusted
#   Signing). It runs only in the `release` environment, whose secrets and
#   variables hold the Azure details. No credential is written in this file.
#   The helper's publisher is the repository variable SIGNING_PUBLISHER, not
#   an environment one, because the `studio` job builds it in.
#
# Unsigned (board, HAL-9045: 0.1.0 ships unsigned, signing follows in 0.1.1).
# While SIGNING_PUBLISHER is not set, a real run builds the helper with no
# publisher in it, so it skips its own-copy check as dev builds do, and
# sign-windows packs the installer without any signature: no Azure, no test
# certificate. sign-windows fails when that and the `release` environment's
# Azure secrets disagree, so setting both (HAL-58) turns signing back on and
# a half-done setup never ships unsigned by mistake. A dry run with
# `unsigned` on tests this path in sign-test.
#
# Both then sign the final installer for the Tauri updater and write
# latest.json (signature inside, no .sig file) and SHA256SUMS, with the
# updater-manifest action (HAL-7222). Dry runs use a throwaway key made in
# the job; real runs use the updater key, a secret of the `release`
# environment. It is the same job as the Authenticode signing, so a release
# needs one approval, not two.
#
# Run it without a tag from the Actions tab (dry_run on), or push a tag
# that starts with `v`. A tag that contains `-test` is always a dry run.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name for the draft release, for example v0.0.0-test.1"
        required: true
        type: string
      dry_run:
        description: "Dry run: placeholder files, draft marked as a test"
        required: true
        default: true
        type: boolean
      unsigned:
        description: "Dry runs: no certificate at all, as a real run without signing set up"
        required: false
        default: false
        type: boolean

permissions: {}

env:
  # The throwaway certificate's name in dry runs, and so the publisher built
  # into a dry run's sandbox helper.
  DRY_RUN_PUBLISHER: Halonic release dry run (not trusted)

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release files
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
      version: ${{ steps.plan.outputs.version }}
      installer: ${{ steps.plan.outputs.installer }}
      apk: ${{ steps.plan.outputs.apk }}
      publisher: ${{ steps.plan.outputs.publisher }}
      signed: ${{ steps.plan.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false
      - id: plan
        name: Decide tag, version and dry run
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_UNSIGNED: ${{ github.event.inputs.unsigned }}
          REF_NAME: ${{ github.ref_name }}
          SIGNING_PUBLISHER: ${{ vars.SIGNING_PUBLISHER }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
            dry_run="$INPUT_DRY_RUN"
          else
            tag="$REF_NAME"
            dry_run=false
          fi
          case "$tag" in
            v[0-9]*) ;;
            *) echo "::error::Tag '$tag' must look like v0.1.0"; exit 1 ;;
          esac
          case "$tag" in *-test*) dry_run=true ;; esac
          version="${tag#v}"
          # The publisher built into the sandbox helper. None means the
          # Windows files ship unsigned (HAL-9045).
          if [ "$dry_run" = "true" ]; then
            publisher="$DRY_RUN_PUBLISHER"
            [ "$INPUT_UNSIGNED" = "true" ] && publisher=""
          else
            publisher="$SIGNING_PUBLISHER"
          fi
          signed=false
          [ -n "$publisher" ] && signed=true
          # So any dry run shows what a real run would do today.
          if [ -n "$SIGNING_PUBLISHER" ]; then
            echo "::notice::SIGNING_PUBLISHER is set: a real run signs the Windows files"
          else
            echo "::notice::SIGNING_PUBLISHER is not set: a real run ships the Windows files unsigned"
          fi
          # The release file names live here and nowhere else. They are the
          # names agreed in HAL-1119.
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "dry_run=$dry_run"
            echo "installer=Halonic-$version-windows-x64-setup.exe"
            echo "apk=Halonic-$version-android.apk"
            echo "cli_tarball=halonic-cli-$version.tgz"
            echo "publisher=$publisher"
            echo "signed=$signed"
          } >> "$GITHUB_OUTPUT"
      - uses: $/.github/actions/setup
      # The CLI package, built the way users install it: bundled to plain
      # JavaScript (Node won't run TypeScript inside node_modules), packed with
      # npm, then installed into an empty folder and run. A tarball that
      # doesn't install or start fails the run before anything is uploaded.
      - name: Build the CLI package
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          CLI_TARBALL: ${{ steps.plan.outputs.cli_tarball }}
        run: |
          pnpm --filter @halonicjs/adapter-integration-runner build
          pnpm --filter @halonicjs/tooling-publish run stage-cli "$VERSION"
          mkdir -p cli-package
          (cd tooling/publish/dist/cli && npm pack --pack-destination ../../../../cli-package --silent)
          mv "cli-package/halonic-$VERSION.tgz" "cli-package/$CLI_TARBALL"
      - name: Check the CLI package in a clean folder
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          CLI_TARBALL: ${{ steps.plan.outputs.cli_tarball }}
        run: |
          tarball="$PWD/cli-package/$CLI_TARBALL"
          clean=$(mktemp -d)
          cd "$clean"
          npm init -y > /dev/null
          npm install "$tarball" --no-audit --no-fund
          [ "$(./node_modules/.bin/halonic --version)" = "Halonic $VERSION" ]
          # `doctor` exits 1 when it finds a problem, such as a sandbox that
          # can't start on this runner. The check is that it runs to the end.
          code=0
          ./node_modules/.bin/halonic doctor | tee doctor.txt || code=$?
          [ "$code" -le 1 ]
          grep -q "^Halonic $VERSION" doctor.txt
          grep -q "Disk" doctor.txt
          # The files the package must carry beside the bundle.
          test -f node_modules/halonic/dist/runner.mjs
          test -d node_modules/halonic/examples/acme
          test -f node_modules/halonic/node_modules/@anthropic-ai/sandbox-runtime/dist/cli.js
      # The Rust crates' licences are read with `cargo metadata`, on the
      # toolchain pinned in rust-toolchain.toml.
      - name: Install the pinned Rust toolchain
        working-directory: apps/studio/src-tauri
        run: rustup toolchain install
      # The SBOM tool is `pnpm sbom` (pinned by packageManager), so no new
      # tool is added. Both SBOMs cover every
      # production dependency of the workspace, as the installer's notices
      # do (build-installer.ps1). The check fails the run when a library is
      # not on tooling/check/dependencies.json or a ref in the dependency
      # graph names no component. THIRD-PARTY-NOTICES.txt is written once,
      # with the app: it also lists the Rust crates the app links, so it
      # covers the CLI too.
      - name: Write the CLI SBOM
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: pnpm check:sbom --name halonic-cli --version "$VERSION" --out dist
      - name: Write the app SBOM and the third-party notices
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: >-
          pnpm check:sbom --name halonic-studio --version "$VERSION" --out dist --notices
          --cargo apps/studio/src-tauri --cargo-target x86_64-pc-windows-msvc
      - name: Write the checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      # The CLI ships on npm, not on the release. Keep the exact bytes as
      # their own artifact so the later npm publish step uses them.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-package
          path: cli-package/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 7

  studio:
    name: Build Studio (not yet packed)
    needs: build
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: false
      - name: Install the pinned Rust toolchain
        working-directory: apps/studio/src-tauri
        run: rustup toolchain install
      - name: Check the app's version is the tag's
        if: needs.build.outputs.dry_run != 'true'
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          $app = (Get-Content apps/studio/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($app -ne $env:VERSION) { throw "tauri.conf.json says $app, the tag says $env:VERSION" }
      - name: Build the app and the programs it ships
        working-directory: apps/studio/src-tauri
        # Empty when the run is unsigned: the helper then has no publisher.
        env:
          HALONIC_SANDBOX_SIGNER: ${{ needs.build.outputs.publisher }}
        run: pwsh windows/build-installer.ps1 -Step build
      # What `-Step pack` needs that the checkout doesn't have. The paths are
      # kept relative to src-tauri.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: studio-build
          path: |
            apps/studio/src-tauri/binaries/
            apps/studio/src-tauri/legal/
            apps/studio/src-tauri/target/x86_64-pc-windows-msvc/release/Halonic.exe
          if-no-files-found: error
          retention-days: 7

  sign-test:
    name: Sign and pack with a test certificate, or unsigned (dry run)
    needs: [build, studio]
    if: needs.build.outputs.dry_run == 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: false
      - name: Install the pinned Rust toolchain
        working-directory: apps/studio/src-tauri
        run: rustup toolchain install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: studio-build
          path: apps/studio/src-tauri
      # Trusted on this runner only, so Windows calls the signatures Valid,
      # as it will the real publisher's for users, and the helper's check of
      # its own copy runs as it will for them. The runner is thrown away.
      - name: Make a throwaway certificate and trust it on this runner
        if: needs.build.outputs.signed == 'true'
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=$env:DRY_RUN_PUBLISHER" `
            -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(1)
          $public = Join-Path $env:RUNNER_TEMP 'dry-run.cer'
          Export-Certificate -Cert $cert -FilePath $public | Out-Null
          Import-Certificate -FilePath $public -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          Import-Certificate -FilePath $public -CertStoreLocation Cert:\LocalMachine\TrustedPublisher | Out-Null
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName | Select-Object -Last 1
          "THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
      - name: Sign the sandbox helper
        if: needs.build.outputs.signed == 'true'
        run: |
          & $env:SIGNTOOL sign /sha1 $env:THUMBPRINT /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 `
            apps\studio\src-tauri\binaries\halonic-sandbox-elevate-x86_64-pc-windows-msvc.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool sign failed" }
      - name: Pack the installer
        working-directory: apps/studio/src-tauri
        env:
          HALONIC_SANDBOX_SIGNER: ${{ needs.build.outputs.publisher }}
          INSTALLER: ${{ needs.build.outputs.installer }}
        run: |
          pwsh windows/build-installer.ps1 -Step pack
          # A dry run's tag isn't the app's version, so the installer gets
          # the name the tag gives it.
          $version = (Get-Content tauri.conf.json -Raw | ConvertFrom-Json).version
          $built = "Halonic-$version-windows-x64-setup.exe"
          if ($built -ne $env:INSTALLER) { Move-Item -Force "../../../dist/$built" "../../../dist/$env:INSTALLER" }
      - name: Sign the installer
        if: needs.build.outputs.signed == 'true'
        env:
          INSTALLER: ${{ needs.build.outputs.installer }}
        run: |
          & $env:SIGNTOOL sign /sha1 $env:THUMBPRINT /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 "dist\$env:INSTALLER"
          if ($LASTEXITCODE -ne 0) { throw "signtool sign failed" }
      # Unsigned, every file must have no signature at all, and the helper,
      # with no publisher built in, must still set up the sandbox.
      - name: Install it, then check the helper inside
        env:
          INSTALLER: ${{ needs.build.outputs.installer }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          function Assert-Signed([string]$file) {
            $sig = Get-AuthenticodeSignature $file
            if ($env:SIGNED -ne 'true') {
              if ($sig.Status -ne 'NotSigned') { throw "$file : expected no signature, found $($sig.Status)" }
              return "$(Split-Path -Leaf $file): not signed, as expected"
            }
            if ($sig.Status -ne 'Valid') { throw "$file : signature is $($sig.Status)" }
            $name = $sig.SignerCertificate.GetNameInfo('SimpleName', $false)
            if ($name -ne $env:DRY_RUN_PUBLISHER) { throw "$file is signed by '$name'" }
            if (-not $sig.TimeStamperCertificate) { throw "$file has no timestamp" }
            "$(Split-Path -Leaf $file): signed by $name, timestamped by $($sig.TimeStamperCertificate.Subject)"
          }
          function Invoke-Helper([string]$exe, [string]$verb) {
            $process = Start-Process $exe -ArgumentList $verb -PassThru
            $null = $process.Handle
            if (-not $process.WaitForExit(180000)) {
              $process.Kill()
              throw "$verb did not finish in 3 minutes"
            }
            $process.ExitCode
          }
          Assert-Signed "dist/$env:INSTALLER"
          $dir = Join-Path $env:RUNNER_TEMP 'Halonic'
          $p = Start-Process "dist/$env:INSTALLER" -ArgumentList '/S', "/D=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "The installer exited with $($p.ExitCode)" }
          $helper = Join-Path $dir 'halonic-sandbox-elevate.exe'
          Assert-Signed $helper
          # The helper's own check (S-4): the copy it leaves for Installed
          # apps must be signed by the publisher built into it. CI's builds
          # are unsigned and only test the refusal; this tests the pass.
          $code = Invoke-Helper $helper 'setup'
          if ($code -ne 0) { throw "setup from the install exited $code" }
          $copy = Join-Path $env:ProgramFiles 'Halonic Sandbox\halonic-sandbox-elevate.exe'
          Assert-Signed $copy
          $code = Invoke-Helper $copy 'remove'
          if ($code -ne 0) { throw "remove exited $code" }
          'The helper accepted its own copy, set up the sandbox and removed it.'
      - uses: $/.github/actions/updater-manifest
        with:
          tag: ${{ needs.build.outputs.tag }}
          version: ${{ needs.build.outputs.version }}
          installer: ${{ needs.build.outputs.installer }}
          dry-run: "true"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files-signed
          path: dist/
          if-no-files-found: error
          retention-days: 7

  sign-windows:
    name: Sign (when set up) and pack the Windows installer
    needs: [build, studio]
    if: needs.build.outputs.dry_run != 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    # The only job that can reach the signing identity. Required reviewers
    # and the branch and tag rule are set on this environment, not here.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # For the Tauri CLI. No dependency runs an install script
      # (allowBuilds in pnpm-workspace.yaml).
      - uses: $/.github/actions/setup
        with:
          cache: false
      - name: Install the pinned Rust toolchain
        working-directory: apps/studio/src-tauri
        run: rustup toolchain install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: studio-build
          path: apps/studio/src-tauri
      # Signing needs both halves: the publisher built into the helper
      # (SIGNING_PUBLISHER) and the Azure secrets here. Neither means an
      # unsigned release (HAL-9045); only one is a mistake in the setup.
      - name: Check the signing setup
        shell: pwsh
        env:
          SIGNED: ${{ needs.build.outputs.signed }}
          AZURE_SET: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' }}
          AZURE_ANY: ${{ secrets.AZURE_CLIENT_ID != '' || secrets.AZURE_TENANT_ID != '' || secrets.AZURE_SUBSCRIPTION_ID != '' }}
        run: |
          if ($env:SIGNED -eq 'true') {
            if ($env:AZURE_SET -ne 'true') { throw 'SIGNING_PUBLISHER is set, but the release environment lacks an Azure secret. Set all three (HAL-58), or unset SIGNING_PUBLISHER to ship unsigned.' }
            'Signing with Azure Artifact Signing.'
          } else {
            if ($env:AZURE_ANY -eq 'true') { throw 'The release environment has Azure secrets, but SIGNING_PUBLISHER is not set, so the helper was built unsigned. Set it and run again.' }
            '::warning::Azure signing is not set up: the installer and the sandbox helper ship unsigned (HAL-9045).'
          }
      # Signs in with the app registration's federated identity (OIDC), so
      # there is no client secret. The three ids are secrets of the
      # `release` environment.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: needs.build.outputs.signed == 'true'
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # Only the helper: srt-win.exe next to it is checked against the hash
      # built into the helper, and signing would change its bytes.
      - name: Sign the sandbox helper
        if: needs.build.outputs.signed == 'true'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.SIGNING_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\apps\studio\src-tauri\binaries\halonic-sandbox-elevate-x86_64-pc-windows-msvc.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      # Refuses to pack a helper that isn't validly signed by this publisher.
      # Unsigned, there is no publisher and nothing to check.
      - name: Pack the installer
        working-directory: apps/studio/src-tauri
        shell: pwsh
        env:
          HALONIC_SANDBOX_SIGNER: ${{ needs.build.outputs.publisher }}
        run: pwsh windows/build-installer.ps1 -Step pack
      - name: Sign the installer
        if: needs.build.outputs.signed == 'true'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.SIGNING_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Check the signature
        shell: pwsh
        env:
          INSTALLER: ${{ needs.build.outputs.installer }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          $sig = Get-AuthenticodeSignature "dist/$env:INSTALLER"
          if ($env:SIGNED -ne 'true') {
            if ($sig.Status -ne "NotSigned") { throw "Expected an unsigned installer, found $($sig.Status)" }
            return
          }
          if ($sig.Status -ne "Valid") { throw "Installer signature is $($sig.Status)" }
          if (-not $sig.TimeStamperCertificate) { throw "Installer has no timestamp" }
      # Signing changed the installer's bytes, so the updater signature is
      # made here, over the signed file, and the checksums are written again.
      - uses: $/.github/actions/updater-manifest
        with:
          tag: ${{ needs.build.outputs.tag }}
          version: ${{ needs.build.outputs.version }}
          installer: ${{ needs.build.outputs.installer }}
          dry-run: "false"
          private-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files-signed
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Real runs only. The called workflow uploads to Play, waits for the APK
  # Play signed and checks it (HAL-1203). It shares its artifacts with this
  # run, so draft-release can pick the APK up.
  android:
    name: Android APK signed by Play
    needs: build
    if: needs.build.outputs.dry_run != 'true'
    permissions:
      contents: read
      id-token: write
    # The called workflow runs at the release's own commit.
    uses: ./.github/workflows/android-play.yml # zizmor: ignore[self-repository]
    with:
      dry_run: false
      version: ${{ needs.build.outputs.version }}

  draft-release:
    name: Create draft release
    needs: [build, studio, sign-test, sign-windows, android]
    # Exactly one of the two signing jobs runs. Skipped is fine, failed or cancelled (e.g. timed out) is not.
    if: ${{ !cancelled() && needs.build.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # Both signing jobs upload this.
          name: release-files-signed
          path: dist
      # Real runs: the APK exactly as Play signed it, under its release
      # name. Dry runs: a placeholder. Either way it gets its line in
      # SHA256SUMS, after the Windows signing has rewritten the file.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.build.outputs.dry_run != 'true'
        with:
          name: android-apk-play-signed
          path: android
      - name: Add the APK and its checksum
        env:
          APK: ${{ needs.build.outputs.apk }}
          VERSION: ${{ needs.build.outputs.version }}
          DRY_RUN: ${{ needs.build.outputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            printf 'Placeholder APK for release dry run %s. Not an APK.\n' "$VERSION" > "dist/$APK"
          else
            test "$(ls android | wc -l)" = 1 || { echo "::error::Expected exactly one APK"; exit 1; }
            mv android/* "dist/$APK"
          fi
          (cd dist && sha256sum -- "$APK" >> SHA256SUMS)
      - name: Check the files
        env:
          INSTALLER: ${{ needs.build.outputs.installer }}
        run: |
          cd dist
          test -f latest.json || { echo "::error::No latest.json"; exit 1; }
          if ls -- *.sig >/dev/null 2>&1; then echo "::error::A .sig file would be published (HAL-1119)"; exit 1; fi
          jq -e --arg f "$INSTALLER" '.platforms["windows-x86_64"].url | endswith("/" + $f)' latest.json
          sha256sum -c SHA256SUMS
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          INSTALLER: ${{ needs.build.outputs.installer }}
          APK: ${{ needs.build.outputs.apk }}
          DRY_RUN: ${{ needs.build.outputs.dry_run }}
          SIGNED: ${{ needs.build.outputs.signed }}
          TARGET: ${{ github.sha }}
        run: |
          title="Halonic $VERSION"
          base="https://github.com/$GH_REPO/releases/download/$TAG"
          link="[Download for Windows]($base/$INSTALLER) · [Download for Android]($base/$APK)"
          notes="$link"
          flags=()
          if [ "$SIGNED" != "true" ]; then
            notes="**The Windows installer is not signed yet, so Windows SmartScreen shows \"Windows protected your PC\". Choose More info, then Run anyway. Check the download against SHA256SUMS first.**"$'\n\n'"$link"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            title="DRY RUN Halonic $VERSION"
            how="signed with a test certificate"
            [ "$SIGNED" = "true" ] || how="unsigned"
            notes="**Dry run, $how, with placeholder files for the APK. Do not publish. Delete this draft.**"$'\n\n'"$link"
            flags+=(--prerelease)
          fi
          gh release create "$TAG" dist/* --draft \
            --target "$TARGET" --title "$title" --notes "$notes" "${flags[@]}"
