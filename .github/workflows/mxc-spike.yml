# THROWAWAY (HAL-2396): MXC process-container spike on a Windows runner.
# Draft pull request only; deleted once the result is written up.
name: MXC spike

on:
  pull_request:
    paths:
      - spikes/mxc/**
      - .github/workflows/mxc-spike.yml

permissions:
  contents: read

jobs:
  mxc:
    name: MXC on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-2025 is Windows Server; windows-11-arm is the only hosted Windows 11 image.
        os: [windows-2025, windows-11-arm]
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - name: Host facts
        run: |
          [System.Environment]::OSVersion.VersionString
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber, OperatingSystemSKU | Format-List | Out-String
          Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion' | Select-Object EditionID, ProductName, UBR | Format-List | Out-String
          whoami /groups | Select-String "Mandatory Label"
          node --version
      # No pnpm: the spike is a standalone folder, so no lockfile change.
      - name: Install the MXC SDK
        working-directory: spikes/mxc
        run: npm install --no-audit --no-fund
      - name: MXC executables and probe
        working-directory: spikes/mxc
        run: |
          Get-ChildItem node_modules\@microsoft -Recurse -Include wxc-*.exe, *.dll | Select-Object FullName | Format-Table -AutoSize | Out-String -Width 200
          $exe = Get-ChildItem node_modules\@microsoft -Recurse -Filter wxc-exec.exe | Select-Object -First 1
          if ($exe) { & $exe.FullName --probe }
        continue-on-error: true
      - name: Elevated, fence probes
        working-directory: spikes/mxc
        run: node probe.mjs fence
        continue-on-error: true
        id: fence
      - name: Elevated, warm starts (20)
        working-directory: spikes/mxc
        run: node probe.mjs warm
        continue-on-error: true
      - name: Elevated, cold starts (20, each in a new node process)
        working-directory: spikes/mxc
        run: |
          1..20 | ForEach-Object { node probe.mjs cold }
        continue-on-error: true
      - name: Elevated, tools
        working-directory: spikes/mxc
        run: node probe.mjs tools
        continue-on-error: true
      # A plain local user, no admin group. Everything lives under $env:SystemDrive\mxc-spike
      # so that user can read the node binary and the SDK. The password is
      # random, kept in memory, never printed.
      - name: Normal user, create account and copy the spike
        run: |
          Add-Type -AssemblyName System.Web
          $pw = [System.Web.Security.Membership]::GeneratePassword(24, 4) + "aA1!"
          Write-Host "::add-mask::$pw"
          $sec = ConvertTo-SecureString $pw -AsPlainText -Force
          New-LocalUser -Name mxcuser -Password $sec -PasswordNeverExpires | Out-Null
          Add-LocalGroupMember -Group "Users" -Member mxcuser -ErrorAction SilentlyContinue
          "MXC_PW=$pw" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory $env:SystemDrive\mxc-spike | Out-Null
          Copy-Item -Recurse spikes\mxc\* $env:SystemDrive\mxc-spike\
          icacls $env:SystemDrive\mxc-spike /grant "Users:(OI)(CI)M" /T | Out-Null
          icacls (Split-Path (Get-Command node).Source) /grant "Users:(OI)(CI)RX" | Out-Null
          Get-LocalGroupMember -Group Administrators | Select-Object Name
      - name: Normal user, fence probes, warm starts, tools
        continue-on-error: true
        run: |
          $sec = ConvertTo-SecureString $env:MXC_PW -AsPlainText -Force
          $cred = New-Object System.Management.Automation.PSCredential("$env:COMPUTERNAME\mxcuser", $sec)
          $node = (Get-Command node).Source
          foreach ($m in "fence", "warm", "tools") {
            $out = "$env:SystemDrive\mxc-spike\out-$m.txt"; $err = "$env:SystemDrive\mxc-spike\err-$m.txt"
            $p = Start-Process -FilePath $node -ArgumentList "probe.mjs", $m -WorkingDirectory $env:SystemDrive\mxc-spike `
              -Credential $cred -LoadUserProfile -Wait -PassThru -RedirectStandardOutput $out -RedirectStandardError $err `
              -Environment @{ SPIKE_ROOT = "$env:SystemDrive\mxc-spike\data" } 2>&1
            Write-Host "=== normal user, $m, exit $($p.ExitCode)"
            Get-Content $out -ErrorAction SilentlyContinue
            Get-Content $err -ErrorAction SilentlyContinue
          }
