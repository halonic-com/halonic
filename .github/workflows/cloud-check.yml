# One-off deployed check of the run container (HAL-18578, board approval on HAL-18117). Never
# merged: this file lives only on the draft branch owen/HAL-18578-cloud-check, and the branch is
# deleted after the run. It builds #5907's image, deploys the throwaway `halonic-cloud-check`
# Worker (one standard-1 instance at most), runs the checks, prints pass/fail lines, then deletes
# the Worker, the container application and the image whatever happened, and lists them again.
#
# The job runs in the `cloud-check` environment: the board is its required reviewer, it accepts
# only this branch, and it holds a scoped token that expires in 48 h. A push alone deploys nothing.

name: Cloud container check (one-off)

on:
  push:
    branches: [owen/HAL-18578-cloud-check]

permissions: {}

concurrency:
  group: cloud-check
  cancel-in-progress: false

env:
  # Exact version, fetched only by this throwaway job (no dependencies.json entry).
  WRANGLER: npx --yes wrangler@4.168.0
  WORKER_NAME: halonic-cloud-check

jobs:
  check:
    if: github.ref == 'refs/heads/owen/HAL-18578-cloud-check'
    runs-on: ubuntu-24.04
    # Step budgets add up to 19 minutes, so cleanup keeps its 5 inside the 20-minute cap.
    timeout-minutes: 20
    environment: cloud-check
    permissions:
      contents: read
    # The Cloudflare secrets are only in the env of the steps that call Cloudflare, never the
    # install's, so no package's install script can read them.
    env:
      WRANGLER_SEND_METRICS: "false"
    defaults:
      run:
        shell: bash
        working-directory: packages/targets/cloudflare/runtime/cloud-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        timeout-minutes: 4

      # Deploy output names the account's workers.dev subdomain: it goes to a file, never the log.
      - name: Build the image and deploy
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::The cloud-check environment has no CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          token=$(openssl rand -hex 32)
          echo "::add-mask::$token"
          echo "CHECK_TOKEN=$token" >> "$GITHUB_ENV"
          if ! $WRANGLER deploy --var "CHECK_TOKEN:$token" > "$RUNNER_TEMP/deploy.log" 2>&1; then
            echo "::error::wrangler deploy failed; its output is withheld because it names the account."
            grep -iE 'error|failed' "$RUNNER_TEMP/deploy.log" | sed -E 's/[a-z0-9-]+\.workers\.dev/<subdomain>.workers.dev/g' | head -20 || true
            exit 1
          fi
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1 || true)
          if [ -z "$url" ]; then
            echo "::error::wrangler deploy succeeded but printed no workers.dev URL."
            exit 1
          fi
          echo "::add-mask::$url"
          echo "CHECK_URL=$url" >> "$GITHUB_ENV"
          echo "Deployed $WORKER_NAME."

      # Two tries at most: each starts new containers, and max_instances = 1 makes extra tries queue.
      - name: Run the checks
        timeout-minutes: 6
        run: |
          # A fresh application has no instance to place for a while after deploy (run 45798785736).
          sleep 90
          # A 404 means the new Worker isn't live everywhere yet: retried, as it starts nothing.
          # Anything else is the one real attempt; the Worker may wait 150 s for the container.
          got_results=false
          for attempt in 1 2 3 4; do
            code=$(curl --silent --show-error --max-time 210 --output "$RUNNER_TEMP/results.txt" \
              --write-out '%{http_code}' -H "x-check-token: $CHECK_TOKEN" "$CHECK_URL/check" || true)
            if [ "$code" = 200 ]; then
              got_results=true
              break
            fi
            echo "Attempt $attempt: HTTP $code."
            [ "$code" = 404 ] || break
            sleep 10
          done
          if [ "$got_results" != true ]; then
            echo "::error::The check Worker gave no results."
            exit 1
          fi
          echo "--- results ---"
          cat "$RUNNER_TEMP/results.txt"
          passes=$(grep -c '^PASS ' "$RUNNER_TEMP/results.txt" || true)
          if [ "$passes" != 8 ]; then
            echo "::error::$passes of 8 checks passed."
            exit 1
          fi

      # Every listing must succeed: a list that fails counts as a failure, never as "0 left".
      - name: Clean up and list what is left
        if: always()
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          status=0
          list_or_fail() {
            # $1: what is listed; the rest: the wrangler command. Prints only lines naming the Worker.
            local what=$1; shift
            local output
            if ! output=$($WRANGLER "$@" 2>&1); then
              echo "::error::Could not list $what." >&2
              status=1
              return 1
            fi
            printf '%s\n' "$output" | grep "$WORKER_NAME"
            return 0
          }

          $WRANGLER delete --name "$WORKER_NAME" --force > /dev/null 2>&1 \
            || echo "Worker delete: nothing deleted (it may not exist)."
          for id in $(list_or_fail "container applications" containers list | grep -oE '[0-9a-f]{8}-[0-9a-f-]{27}'); do
            $WRANGLER containers delete "$id" > /dev/null 2>&1 \
              || { echo "::error::Could not delete a container application."; status=1; }
          done
          for image in $(list_or_fail images containers images list | awk '{print $1 ":" $2}'); do
            $WRANGLER containers images delete "$image" > /dev/null 2>&1 \
              || { echo "::error::Could not delete image $image."; status=1; }
          done

          echo "--- left after cleanup ---"
          scripts=$(curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")
          if [ $? -ne 0 ] || ! printf '%s' "$scripts" | grep -q '"success": *true'; then
            echo "::error::Could not list Workers."
            workers=unknown
            status=1
          else
            workers=$(printf '%s' "$scripts" | grep -o "\"id\": *\"$WORKER_NAME\"" | wc -l)
          fi
          if applications=$(list_or_fail "container applications" containers list); then
            applications=$(printf '%s' "$applications" | grep -c . )
          else
            applications=unknown
          fi
          if images=$(list_or_fail images containers images list); then
            images=$(printf '%s' "$images" | grep -c . )
          else
            images=unknown
          fi
          echo "$WORKER_NAME Workers: $workers"
          echo "$WORKER_NAME container applications: $applications"
          echo "$WORKER_NAME images: $images"
          if [ "$workers" != 0 ] || [ "$applications" != 0 ] || [ "$images" != 0 ]; then
            echo "::error::Something is left or could not be listed; check by hand and say so on HAL-18578."
            status=1
          fi
          exit $status
