# Checks on every pull request (plan 10.2). The only required check is
# `ci-ok`: it always runs, waits for every other job and fails if any of
# them failed. Jobs that only run for some changes can then be skipped
# without blocking the merge.

name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  changes:
    name: Changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tooling: ${{ steps.diff.outputs.tooling }}
      tauri: ${{ steps.diff.outputs.tauri }}
      studio: ${{ steps.diff.outputs.studio }}
      docs: ${{ steps.diff.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - id: diff
        name: Find changed areas
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          areas=(
            "tooling=^(tooling/|package\.json$|pnpm-workspace\.yaml$|pnpm-lock\.yaml$|turbo\.json$|biome\.json$)"
            "tauri=^apps/studio/src-tauri/"
            "studio=^(apps/studio/|packages/studio/)"
            "docs=^(apps/docs/|docs/)"
          )
          if [ "$EVENT" != "pull_request" ]; then
            changed=""
          else
            changed=$(git diff --name-only "$BASE...HEAD")
          fi
          for area in "${areas[@]}"; do
            name="${area%%=*}"
            if [ "$EVENT" != "pull_request" ] || grep -qE "${area#*=}" <<< "$changed"; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            else
              echo "$name=false" >> "$GITHUB_OUTPUT"
            fi
          done

  fast:
    name: Fast gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - name: Pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: pnpm check:pr-title
      # Plain check leaves out trace; the build job runs it after the tests.
      - name: Repo checks (layers, dependencies, names, feature list, file size, lockfile, paths)
        run: pnpm check
      - name: Licences
        run: pnpm check:licences
      - name: Formatting
        run: pnpm exec biome ci --linter-enabled=false .
      - name: Feature list and generated files
        run: pnpm discover --check
      # High and critical advisories in shipped dependencies fail; dev
      # tooling findings are reported by the daily scheduled run (plan 10.2).
      - name: Dependency audit (shipped code)
        run: pnpm audit --prod --audit-level high

  terms:
    # Runs no third-party code: only the repo's own script on Node, so the
    # secret is never near a dependency. Prints locations, never a term.
    # Until the HALONIC_DENY_TERMS secret exists it passes with a warning.
    name: Personal-terms guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false
      - name: Scan the change
        env:
          HALONIC_DENY_TERMS: ${{ secrets.HALONIC_DENY_TERMS }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          BRANCH_NAME: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "$EVENT" = "push" ]; then
            node tooling/check/src/cli/terms.ts
          else
            node tooling/check/src/cli/terms.ts --range "$BASE..$HEAD"
          fi

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan commits
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          if [ "$EVENT" = "push" ]; then
            "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .
          else
            "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 --log-opts="$BASE..$HEAD" .
          fi

  zizmor:
    name: Workflow lint (zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      ZIZMOR_VERSION: 1.32.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run "zizmor==${ZIZMOR_VERSION}" --format=github --min-severity=low .github/

  build:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TURBO_CACHE_DIR: ${{ github.workspace }}/../turbo-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      # Every task runs; unchanged packages are cache hits (plan 6.4). The
      # cache is GitHub's own, scoped per branch, so a pull request can read
      # main's cache but never write to it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - name: Run every task through the cache
        run: pnpm exec turbo run typecheck lint test build --continue --output-logs=new-only --summarize
      # On main, main checks itself. On a pull request, the guard job runs
      # trace from the merge base's copy instead (plan 9.3).
      - name: Requirements and their tests (trace)
        if: always() && github.event_name == 'push'
        run: pnpm check trace --report
      # The guard job reads these. They come from the pull request's own
      # code, so they are only ever compared, never trusted to judge.
      - name: Pack the test results for the guard job
        if: always() && github.event_name != 'push'
        run: |
          find . -name node_modules -prune -o -path '*/test-results/vitest.json' -type f -print \
            | sed 's|^\./||' | sort | tar -cf "$RUNNER_TEMP/test-results.tar" -T -
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && github.event_name != 'push'
        with:
          name: pull-request-test-results
          path: ${{ runner.temp }}/test-results.tar
          if-no-files-found: error
          retention-days: 1
          overwrite: true
      - name: Task timings
        if: always()
        run: |
          summary=$(ls -t .turbo/runs/*.json 2>/dev/null | head -1)
          [ -n "$summary" ] || exit 0
          jq -r '"Tasks: \(.execution.attempted), cached: \(.execution.cached), failed: \(.execution.failed), \((.execution.endTime - .execution.startTime) / 1000)s"' "$summary" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  # Plan 9.3: a pull request can't weaken the checks that judge it. The
  # merge base's test results are the guard's baseline, so they come from a
  # job where no pull-request code runs and no cache is read: the checkout
  # switches to the merge base before anything runs, and neither the pnpm
  # store nor Turbo's cache is restored (a pull request's runs can write both).
  base-tests:
    name: Merge base's tests (no cache)
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.merge-base.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: merge-base
        name: Switch to the merge base before anything runs
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          sha=$(git merge-base "$BASE" HEAD)
          git checkout --quiet --detach "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: false
      - name: Install the merge base's dependencies
        run: pnpm install --frozen-lockfile
      - name: Run the merge base's tests without reading any cache
        run: pnpm exec turbo run test --force --continue --output-logs=errors-only
      # Runs even when a test failed: the guard reports a missing result file.
      - name: Pack the test results
        if: always()
        run: |
          find . -name node_modules -prune -o -path '*/test-results/vitest.json' -type f -print \
            | sed 's|^\./||' | sort | tar -cf "$RUNNER_TEMP/test-results.tar" -T -
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: merge-base-test-results
          path: ${{ runner.temp }}/test-results.tar
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # Trace and the requirement guard, run from the merge base's copy of
  # tooling/check (plan 9.3). No pull-request code runs here: the pull
  # request's checkout is only read, only the merge base's dependencies are
  # installed, and Node comes from the merge base.
  guard:
    name: Requirements and the requirement guard (merge base's copy)
    needs: [build, base-tests]
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # The requirement guard looks up the branch of a merge-queue entry.
      pull-requests: read
    env:
      HEAD_DIR: ${{ github.workspace }}/head
      BASE_DIR: ${{ github.workspace }}/base
    steps:
      # Without it the base checkout below would fall back to the pull
      # request's own commit, and the guard would compare it with itself.
      - name: Stop if the merge base is unknown
        env:
          BASE_SHA: ${{ needs.base-tests.outputs.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "::error::The merge base's tests job didn't report which commit it tested."
            exit 1
          fi
      # The same commit the build job tested.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: head
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: base
          ref: ${{ needs.base-tests.outputs.sha }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: false
          package_json_file: base/package.json
      - name: Install the merge base's dependencies
        working-directory: base
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pull-request-test-results
          path: ${{ runner.temp }}/head-results
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: merge-base-test-results
          path: ${{ runner.temp }}/base-results
      # The pull request's archive is its own code's output, so each entry
      # must be a plain result file that lands where its name says: no
      # links, no "..", and no folder in the checkout that links elsewhere.
      - name: Unpack both sides' test results
        run: |
          unpack() {
            local archive="$1" into
            into=$(realpath "$2")
            if tar -tvf "$archive" | grep -qv '^-'; then
              echo "::error::$archive holds something other than plain files."
              return 1
            fi
            while IFS= read -r entry; do
              if ! grep -qE '^([A-Za-z0-9_@-][A-Za-z0-9._@-]*/)*test-results/vitest\.json$' <<< "$entry" \
                || grep -qE '(^|/)\.\.?(/|$)' <<< "$entry" \
                || [ "$(realpath -m "$into/$entry")" != "$into/$entry" ]; then
                echo "::error::$archive holds an unexpected entry: $entry"
                return 1
              fi
            done < <(tar -tf "$archive")
            tar -xf "$archive" -C "$into" --no-same-owner --no-same-permissions
          }
          unpack "$RUNNER_TEMP/head-results/test-results.tar" "$HEAD_DIR"
          unpack "$RUNNER_TEMP/base-results/test-results.tar" "$BASE_DIR"
      # Runs the merge base's files with the merge base's Node (devEngines
      # gives a Node that runs TypeScript). Calling pnpm in the pull
      # request's checkout would read its config, so only node runs there.
      - name: Find the merge base's Node
        working-directory: base
        run: echo "BASE_NODE=$(pnpm exec node -p process.execPath)" >> "$GITHUB_ENV"
      # Reads the result files the tests wrote (plan 9.2). A missing result
      # file fails the check.
      - name: Requirements and their tests (trace, merge base's copy)
        working-directory: head
        run: '"$BASE_NODE" "$BASE_DIR/tooling/check/src/cli/check.ts" trace --report'
      - name: Requirement guard (merge base's copy)
        if: always()
        working-directory: head
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ needs.base-tests.outputs.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          guard="tooling/check/src/cli/requirement-guard.ts"
          [ -n "$BASE_SHA" ] || exit 1
          # Asks the merge base commit itself, not a folder on disk.
          if ! git -C "$BASE_DIR" cat-file -e "$BASE_SHA:$guard" 2>/dev/null; then
            echo "::notice title=requirement-guard::The merge base has no requirement guard yet; it runs from the next pull request on."
            exit 0
          fi
          branch="$HEAD_BRANCH"
          if [ "$EVENT" = "merge_group" ]; then
            # gh-readonly-queue/<base>/pr-<number>-<sha>: the note is named after the pull request's branch.
            number=$(sed -E 's|.*/pr-([0-9]+)-[0-9a-f]+$|\1|' <<< "$QUEUE_REF")
            branch=$(gh api "repos/$REPO/pulls/$number" --jq .head.ref)
          fi
          "$BASE_NODE" "$BASE_DIR/$guard" --base "$BASE_DIR" --branch "$branch"

  scaffold:
    # Proves the templates still pass every check, so `pnpm new` never
    # hands an agent a package that fails (phase 0 "done when").
    name: Empty package and feature pass every check
    needs: changes
    if: needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - name: Create an empty package and an empty feature
        run: |
          git config user.name "CI"
          git config user.email "ci@users.noreply.github.com"
          pnpm new package core/ci-example --owner ci
          pnpm new feature ci-example --owner ci
          pnpm install --no-frozen-lockfile
      - name: pnpm verify --full
        run: pnpm verify --full

  # Conditional jobs (plan 10.2). Stubs until the code they check exists;
  # each runs only when its area changes, and ci-ok accepts "skipped".
  tauri:
    name: Tauri shell (Rust checks, Windows smoke build)
    needs: changes
    if: needs.changes.outputs.tauri == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - run: echo "::notice title=tauri::Not set up yet; arrives with the desktop shell in phase 3."

  e2e:
    name: Studio end-to-end (Playwright)
    needs: changes
    if: needs.changes.outputs.studio == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - run: echo "::notice title=e2e::Not set up yet; arrives with the Studio shell."

  docs:
    name: Docs build and link check
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - run: echo "::notice title=docs::Not set up yet; arrives with apps/docs."

  ci-ok:
    name: ci-ok
    if: always()
    needs:
      [changes, fast, terms, gitleaks, zizmor, build, base-tests, guard, scaffold, tauri, e2e, docs]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Every job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped")] | length')
          if [ "$failed" != "0" ]; then
            echo "::error::$failed required job(s) failed or were cancelled."
            exit 1
          fi
