name: CI
on: [pull_request, merge_group, push]
permissions: {}
env:
  GITHUB_EVENT_NAME: merge_group
  GITHUB_WORKFLOW_REF: halonic-com/halonic/.github/workflows/ci.yml@refs/heads/gh-readonly-queue/main/t1
jobs:
  large:
    runs-on: halonic-ci-large
    steps:
      - run: echo "runner=$RUNNER_NAME"
  small:
    runs-on: halonic-ci-small
    steps:
      - run: echo "runner=$RUNNER_NAME"
