# Checks on every pull request. The only required check is
# `ci-ok`: it runs unless the run was cancelled, waits for every other job and fails if any of
# them failed. Jobs that only run for some changes can then be skipped
# without blocking the merge.

name: CI

on:
  # Not "edited", "labeled" or "unlabeled": each would cancel the run in
  # progress and start every job again. pr-details.yml handles those: it
  # re-runs the title, leak and coverage-floor jobs here when they failed.
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"
  # turbo.json caps Turbo at 2 tasks at once for agent workspaces; CI keeps
  # Turbo's own default of 10.
  TURBO_CONCURRENCY: "10"

jobs:
  changes:
    name: Changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      scaffold: ${{ steps.diff.outputs.scaffold }}
      tauri: ${{ steps.diff.outputs.tauri }}
      sandbox-fence: ${{ steps.diff.outputs.sandbox-fence }}
      sandbox: ${{ steps.diff.outputs.sandbox }}
      windows: ${{ steps.diff.outputs.windows }}
      android: ${{ steps.diff.outputs.android }}
      agent_host: ${{ steps.diff.outputs.agent_host }}
      studio: ${{ steps.diff.outputs.studio }}
      docs: ${{ steps.diff.outputs.docs }}
      workflows: ${{ steps.diff.outputs.workflows }}
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - id: diff
        name: Find changed areas
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          areas=(
            "tauri=^(\.github/workflows/ci\.yml$|\.github/actions/|apps/studio/src-tauri/)"
            "sandbox-fence=^(\.github/workflows/ci\.yml$|\.github/actions/|packages/adapters/(sandbox-srt|integration-runner)/|pnpm-lock\.yaml$)"
            "sandbox=^(\.github/workflows/ci\.yml$|\.github/actions/|packages/adapters/(sandbox-[^/]+|system-node|git)/|packages/core/ports/)"
            "windows=^(\.github/workflows/ci\.yml$|\.github/actions/|pnpm-lock\.yaml$|apps/(cli|agent-host)/|packages/adapters/(fs-node|harness-kit|harness-claude-code|harness-codex|mcp|memory|system-node|http-kit|integration-kit)/|packages/core/(workspace|app|events|format|ports|profile|routines|schema-kit|std|workflow|yaml)/|packages/testing/(contracts|spec|parity|integration)/|tooling/(config|publish)/)"
            "android=^(\.github/workflows/ci\.yml$|\.github/actions/|apps/studio/src-tauri/|apps/studio/src/connect/|apps/studio/connect\.html$|apps/studio/vite\.config\.ts$|apps/studio/package\.json$|pnpm-lock\.yaml$)"
            "agent_host=^(\.github/workflows/ci\.yml$|\.github/actions/|apps/agent-host/|package\.json$)"
            "studio=^(\.github/workflows/ci\.yml$|\.github/actions/|apps/studio/|packages/studio/)"
            "docs=^(\.github/workflows/ci\.yml$|\.github/actions/|apps/docs/|docs/)"
            "workflows=^\.github/"
          )
          # The scaffold job runs a full `pnpm verify --full`. A pull request
          # needs it only when the templates or the tooling itself change;
          # dependency and config bumps (package.json, the lockfile, turbo.json,
          # biome.json) are checked by it in the merge queue and on main.
          if [ "$EVENT" = "pull_request" ]; then
            areas+=("scaffold=^(\.github/workflows/ci\.yml$|\.github/actions/|tooling/)")
          else
            areas+=("scaffold=^(\.github/workflows/ci\.yml$|\.github/actions/|tooling/|package\.json$|pnpm-workspace\.yaml$|pnpm-lock\.yaml$|turbo\.json$|biome\.json$)")
          fi
          changed=""
          by_area=false
          if [ "$EVENT" = "pull_request" ]; then
            changed=$(git diff --name-only "$BASE...HEAD")
            by_area=true
          elif [ "$EVENT" = "merge_group" ]; then
            # The group against the commit it is built on: main, or the head
            # of the entry ahead of it in the queue. That diff is exactly
            # what this group adds, so it is filtered by area the same way
            # as a pull request. Each entry ahead checks its own areas before
            # it can merge, and every push to main runs every job, so a gap
            # in the area rules still shows on main. An empty diff or a diff
            # that can't be read runs every job.
            if changed=$(git diff --name-only "$BASE...HEAD") && [ -n "$changed" ]; then
              by_area=true
            fi
            echo "::notice title=Changed areas::Filtered by area: $by_area ($(grep -c . <<< "$changed") files)"
          fi
          # Pull requests that change only docs, decisions, READMEs and
          # repo metadata have no code to test, so the merge base's tests
          # and the requirement guard skip them. The merge queue and main
          # still run everything. Requirement files stay "code": the guard
          # reads them. An empty or unreadable diff counts as code.
          docs_only='^(docs/|decisions/|\.changeset/.*\.md$|\.github/(ISSUE_TEMPLATE/|CODEOWNERS$|pull_request_template\.md$))|(^|/)(README|AGENTS|CHANGELOG)\.md$'
          if [ "$EVENT" = "pull_request" ] && [ -n "$changed" ] && [ -z "$(grep -vE "$docs_only" <<< "$changed")" ]; then
            echo "code=false" | tee -a "$GITHUB_OUTPUT"
          else
            echo "code=true" | tee -a "$GITHUB_OUTPUT"
          fi
          for area in "${areas[@]}"; do
            name="${area%%=*}"
            if [ "$by_area" != true ] || grep -qE "${area#*=}" <<< "$changed"; then
              echo "$name=true" | tee -a "$GITHUB_OUTPUT"
            else
              echo "$name=false" | tee -a "$GITHUB_OUTPUT"
            fi
          done

  fast:
    name: Fast gates
    runs-on: ubuntu-24.04
    # pr.read can wait about 10 min in total under a GitHub rate limit.
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The whole history (without file contents), so the DCO rule can
      # read every commit of the pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: $/.github/actions/setup
      # Right after install, before any turbo task or `pnpm discover`: a fresh
      # clone must run the CLI as `pnpm install` left it (HAL-5009). The
      # gitignored src/generated/ files come from the root `prepare` script.
      # Runs the `bin` launcher users get, not src/main.ts (HAL-6414).
      # Through `pnpm exec`: a bare `node` is the runner's Node 22, which
      # the launcher refuses; pnpm runs the devEngines Node 26.
      - name: CLI runs on a fresh install
        run: pnpm exec node apps/cli/bin/halonic.js --help
      - id: pr
        uses: $/.github/actions/pull-request
      # Reads the title from a file: an `env:` block is printed in the log.
      - name: Pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_EVENT: ${{ steps.pr.outputs.event-path }}
          PR_RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: GITHUB_EVENT_PATH="$PR_EVENT" PR_RANGE="$PR_RANGE" pnpm check:pr-title
      # In the queue, the subject of the squash commit: what lands on main.
      # It is the title as it was when queued, or a single commit's own
      # subject. GitHub adds " (#<number>)", which the length limit leaves out.
      - name: Squash commit subject
        if: github.event_name == 'merge_group'
        env:
          HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          PR_TITLE=$(git log -1 --format=%s "$HEAD" | sed -E 's/ \(#[0-9]+\)$//')
          GITHUB_EVENT_PATH="" PR_TITLE="$PR_TITLE" pnpm check:pr-title
      # Plain check leaves out trace; the build job runs it after the tests.
      # The DCO rule checks the pull request's own commits. A merge queue
      # or a push to main only holds commits that passed it here.
      - name: Repo checks (layers, dependencies, names, feature list, file size, lockfile, paths, DCO)
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            export DCO_RANGE="$BASE..$HEAD"
            export DCO_PR_AUTHOR="$PR_AUTHOR"
          fi
          pnpm check
      - name: Licences
        run: pnpm check:licences
      - name: Infra tests (spend guard, turbo-cache)
        run: node --test infra/spend-guard/test/guard.test.mjs infra/turbo-cache/test.mjs
      - name: Formatting
        run: pnpm exec biome ci --linter-enabled=false .
      - name: Feature list and generated files
        run: pnpm discover --check
      # High and critical advisories in shipped dependencies fail; dev
      # tooling findings are reported by the daily scheduled run.
      - name: Dependency audit (shipped code)
        run: pnpm check:audit --prod --audit-level high

  leaks:
    # The leak guard: the same rules as the local git hooks (secrets, keys,
    # .env and key files, absolute local paths, personal terms). Runs no
    # third-party code: only the repo's own script on Node, so the secret is
    # never near a dependency. Prints locations, never a term or a secret.
    name: Leak guard
    runs-on: ubuntu-24.04
    # pr.read can wait about 10 min in total under a GitHub rate limit.
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false
      # The title, body and branch as they are now, also in the merge queue.
      - id: pr
        uses: $/.github/actions/pull-request
      - name: Scan the change
        env:
          PR_EVENT: ${{ steps.pr.outputs.event-path }}
          HALONIC_DENY_TERMS: ${{ secrets.HALONIC_DENY_TERMS }}
          HALONIC_TERMS_REQUIRED: ${{ vars.HALONIC_TERMS_ENFORCED == 'true' && github.event.pull_request.head.repo.fork != true && github.event.pull_request.user.login != 'dependabot[bot]' && 'true' || 'false' }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.event.after }}
        run: |
          if [ "$EVENT" = "push" ]; then
            # A push to main scans the pushed commits too, not only the tree it
            # ends at. The first push to a new repo has no "before" commit.
            node tooling/check/src/cli/leaks.ts
            case "$BASE" in
              *[!0]*) ;;
              *) exit 0 ;;
            esac
            node tooling/check/src/cli/leaks.ts --range "$BASE..$HEAD"
          else
            git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
            BASE_DIR="$RUNNER_TEMP/base"
            # The script and its list of allowed phrases come from the base
            # commit, so the change under test can't weaken its own check. The
            # one pull request that adds the script has no base copy, so it
            # uses its own; CODEOWNERS makes a person approve that.
            if [ -f "$BASE_DIR/tooling/check/src/cli/leaks.ts" ]; then
              guard="$BASE_DIR"
            else
              guard="$PWD"
            fi
            GITHUB_EVENT_PATH="$PR_EVENT" node "$guard/tooling/check/src/cli/leaks.ts" \
              --allowed-phrases "$guard/tooling/check/terms-allowed-phrases.txt" \
              --allow-file "$guard/tooling/check/leak-allow.txt" \
              --range "$BASE..$HEAD"
          fi

  coverage-floors:
    # Fails when a pull request lowers a package's coverage floor. Runs the
    # base commit's copy of the script on Node alone: no dependency is
    # installed, and the change under test can't weaken its own check (the one
    # pull request that adds the script runs its own copy). The
    # `coverage-floor-lowered` label (read from the event file) allows it.
    name: Coverage floors don't go down
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    # pr.read can wait about 10 min in total under a GitHub rate limit.
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false
      # The labels as they are now, so a re-run sees a label added since.
      - id: pr
        uses: $/.github/actions/pull-request
      - name: Compare floors with the base
        env:
          PR_EVENT: ${{ steps.pr.outputs.event-path }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
          script=tooling/check/src/cli/coverage-floors.ts
          # The pull request that adds this script has no base copy to run.
          if [ -f "$RUNNER_TEMP/base/$script" ]; then
            GITHUB_EVENT_PATH="$PR_EVENT" node "$RUNNER_TEMP/base/$script" "$BASE" "$HEAD"
          else
            GITHUB_EVENT_PATH="$PR_EVENT" node "$script" "$BASE" "$HEAD"
          fi

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Pull requests and merge queue scan their own commits. Pushes to main
      # scan main's whole history from the pushed commit. An empty log-opts
      # would scan every fetched branch (git log --all), so an open pull
      # request's branch could turn main red. The weekly full scan covers
      # those branches.
      - name: Scan commits
        uses: $/.github/actions/gitleaks
        with:
          log-opts: ${{ github.event_name == 'push' && github.sha || format('{0}..{1}', github.event.pull_request.base.sha || github.event.merge_group.base_sha, github.event.pull_request.head.sha || github.event.merge_group.head_sha) }}

  zizmor:
    # Every pull request: its online audits (pinned actions, advisories) can
    # change without a file changing. The merge queue reruns it only when
    # the group changes `.github/`.
    name: Workflow lint (zizmor)
    needs: changes
    if: github.event_name != 'merge_group' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --require-hashes --only-binary :all: -r .github/zizmor-requirements.txt
          "$RUNNER_TEMP/zizmor/bin/zizmor" --format=github --min-severity=low .github/

  build:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The write token for the remote cache and the key that signs its entries
    # live in the environment `turbo-cache-write`, which only `main` and the
    # merge queue may use (deployment branch rule). A pull request gets the
    # empty `turbo-cache-read`, whatever its ci.yml says, so it holds neither
    # secret and uses the local cache only (HAL-5220: the signing key was a
    # repository secret, readable by any pull request's own workflow).
    environment: ${{ github.event_name == 'pull_request' && 'turbo-cache-read' || 'turbo-cache-write' }}
    permissions:
      contents: read
      id-token: write # to ask the cache for a write token (below)
    env:
      # Turbo's own default folder (gitignored). actions/cache refuses a path
      # with "..", so the earlier ../turbo-cache was never saved.
      TURBO_CACHE_DIR: ${{ github.workspace }}/.turbo/cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      # Every task runs; unchanged packages are cache hits. The
      # cache is GitHub's own, scoped per branch, so a pull request can read
      # main's cache but never write to it. The save is the job's last step.
      - id: turbo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      # Remote cache (Cloudflare, infra/turbo-cache). Only main and the merge
      # queue hold the write token and the signing key; a pull request gets
      # neither and uses the local cache, so the cache can't be read as
      # trusted or written from an unreviewed branch. Without the
      # secrets (a fork), the step falls back to the local cache.
      # The cache hands out a 30-minute write token only against this run's
      # GitHub OIDC token, and only when GitHub says the event is the merge
      # queue or a push to main. A branch that merely looks like a queue
      # branch can't fake that, whatever its workflow file says. On failure
      # the token stays empty and the run uses the local cache.
      - name: Get a write token for the remote cache
        id: cache-token
        if: github.event_name != 'pull_request' && vars.TURBO_API != ''
        env:
          TURBO_API: ${{ vars.TURBO_API }}
        shell: bash # with pipefail, so `|| exit 0` also catches a failed curl
        run: |
          oidc=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=halonic-turbo-cache" | jq -r .value) || exit 0
          echo "::add-mask::$oidc"
          token=$(curl -fsS -X POST -H "Authorization: Bearer $oidc" "${TURBO_API%/}/auth/github" | jq -r '.token // empty') || exit 0
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Run every task through the cache
        env:
          TURBO_API: ${{ vars.TURBO_API }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          TURBO_TOKEN: ${{ steps.cache-token.outputs.token }}
          TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ github.event_name != 'pull_request' && secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY || '' }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$TURBO_TOKEN" ] || [ -z "$TURBO_REMOTE_CACHE_SIGNATURE_KEY" ]; then
            cache=local:rw
          else
            cache=local:rw,remote:rw
          fi
          pnpm exec turbo run typecheck lint test build --continue --output-logs=new-only --summarize --cache="$cache"
      # On main and in the merge queue, the change checks itself: it reads
      # the result files the tests just wrote, even when a task failed (a
      # missing result file fails the check anyway). A queued change already
      # passed the merge base's copy on its pull request, and was reviewed. On
      # a pull request, the guard job runs trace from the merge base's copy.
      - name: Requirements and their tests (trace)
        if: always() && github.event_name != 'pull_request'
        run: pnpm check trace --report
      # The guard job reads these. They come from the pull request's own
      # code, so they are only ever compared, never trusted to judge.
      - name: Pack the test results for the guard job
        if: always() && github.event_name == 'pull_request'
        run: |
          find . -name node_modules -prune -o -path '*/test-results/vitest.json' -type f -print \
            | sed 's|^\./||' | sort | tar -cf "$RUNNER_TEMP/test-results.tar" -T -
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && github.event_name == 'pull_request'
        with:
          name: pull-request-test-results
          path: ${{ runner.temp }}/test-results.tar
          if-no-files-found: error
          retention-days: 1
          overwrite: true
      # What keepOnFailure kept, so a failed run shows the state without a
      # local rerun. Invented test data only, but kept for a week at most.
      # A failure that isn't a scenario test leaves nothing to upload. Skip
      # node_modules: workspace links would upload a package's files twice.
      # The folders are listed one level at a time on purpose: with
      # `packages/**` the action walks every node_modules folder before it
      # applies the exclusion, which took about 10 minutes and ran into the
      # job's timeout (HAL-4253). The depths match pnpm-workspace.yaml.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        timeout-minutes: 3
        continue-on-error: true
        with:
          name: scenario-test-state
          path: |
            packages/*/*/test-results/scenarios/**
            packages/*/*/*/test-results/scenarios/**
            packages/*/*/*/*/test-results/scenarios/**
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
      - name: Task timings
        if: always()
        run: |
          summary=$(ls -t .turbo/runs/*.json 2>/dev/null | head -1)
          [ -n "$summary" ] || exit 0
          jq -r '"Tasks: \(.execution.attempted), cached: \(.execution.cached), failed: \(.execution.failed), \((.execution.endTime - .execution.startTime) / 1000)s"' "$summary" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      # Only main saves, like the pnpm, Gradle and Rust caches. A pull
      # request's or queue entry's copy is scoped to its own ref, so only a
      # re-run of the same pull request could read it, and the 155 copies
      # (2.5 GB) pushed main's Rust caches towards eviction. The remote cache
      # above still serves pull requests main's task results.
      - name: Save the Turbo cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ steps.turbo-cache.outputs.cache-primary-key }}

  # A pull request can't weaken the checks that judge it. The
  # merge base's test results are the guard's baseline, so they come from a
  # job where no pull-request code runs and no cache is read: the checkout
  # switches to the merge base before anything runs, and neither the pnpm
  # store nor Turbo's cache is restored (a pull request's runs can write both).
  # Pull requests only, like the guard job it feeds: the queue holds the
  # same change, and its base is main or the entry ahead, whose own run
  # tests it. Skipped for docs-only pull requests (the changes job's code output).
  base-tests:
    name: Merge base's tests (no cache)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The walk-back runs older commits whose tests were not written for a
    # loaded runner, and a git-heavy contract test passed the default 5 s
    # limit once (HAL-3869, HAL-3852). Give each test and hook 30 s. Commits
    # before the preset reads this variable ignore it.
    env:
      HALONIC_TEST_TIMEOUT: "30000"
    permissions:
      contents: read
      # The walk-back below looks up main's push CI runs.
      actions: read
    # The guard downloads the archive by these, not by name: the build job
    # runs pull-request code that could upload an artifact with the same
    # name, but no other job can set this job's outputs.
    outputs:
      sha: ${{ steps.walk-back.outputs.sha || steps.install.outputs.sha }}
      results-id: ${{ steps.upload.outputs.artifact-id }}
      results-sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: merge-base
        name: Switch to the merge base before anything runs
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          # The checkout is the merge ref: the pull request merged into the
          # newest main, so its first parent is the main commit the guard's
          # head side was built on. Comparing with that commit shows only
          # the pull request's own changes. pull_request.base.sha is older
          # when main moved on, and would list every requirement main
          # changed since (HAL-5568). Without a merge commit, fall back to
          # the merge base.
          if [ "$(git rev-list --parents -n 1 HEAD | wc -w)" = 3 ]; then
            sha=$(git rev-parse HEAD^1)
          else
            sha=$(git merge-base "$BASE" HEAD)
          fi
          git checkout --quiet --detach "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: false
      # If the merge base's own lockfile is broken, every pull request would
      # fail here, the one that repairs it included. Only on pnpm's lockfile
      # errors, walk back along main's first-parent history to the newest
      # commit that installs and use it as the baseline (at most 20 commits
      # back, then fail). The baseline is always a commit on main, so no
      # pull-request code or lockfile runs here, and the guard installs and
      # compares against exactly this commit. Network and registry errors
      # still fail the job.
      - id: install
        name: Install the merge base's dependencies
        run: |
          set +e
          tried=0
          for candidate in $(git rev-list --first-parent -n 21 HEAD); do
            git checkout --quiet --force --detach "$candidate"
            pnpm install --frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/install.log"
            status=${PIPESTATUS[0]}
            if [ "$status" -eq 0 ]; then
              if [ "$tried" -gt 0 ]; then
                echo "::warning title=baseline-walked-back::The merge base's lockfile doesn't install. Using ${candidate}, $tried commit(s) back on main, as the baseline."
              fi
              echo "sha=$candidate" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if ! grep -qE 'ERR_PNPM_[A-Z_]*LOCKFILE|OUTDATED_LOCKFILE' "$RUNNER_TEMP/install.log"; then
              exit "$status"
            fi
            tried=$((tried + 1))
          done
          echo "::error::No commit within 20 of the merge base on main installs. Fix main first (docs/guides/broken-main.md)."
          exit 1
      # A failing test here means main itself is red, and that would fail
      # every pull request, the one that repairs main included.
      - id: base-test-run
        name: Run the merge base's tests without reading any cache
        continue-on-error: true
        run: pnpm exec turbo run test --force --continue --output-logs=errors-only
      # Then walk back along main's first-parent history to the newest commit
      # whose push CI run passed (at most 20 commits back from the merge base,
      # then fail) and use its tests as the baseline. As with the lockfile, the
      # baseline is always a commit on main, and the guard installs and
      # compares against exactly this commit. API and network errors fail.
      - id: walk-back
        name: Walk back to main's newest green commit
        if: steps.base-test-run.outcome == 'failure'
        env:
          MERGE_BASE: ${{ steps.merge-base.outputs.sha }}
          TESTED: ${{ steps.install.outputs.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          back=-1
          past=""
          green=""
          for candidate in $(git rev-list --first-parent -n 21 "$MERGE_BASE"); do
            back=$((back + 1))
            if [ -z "$past" ]; then
              [ "$candidate" = "$TESTED" ] && past=1
              continue
            fi
            runs=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$candidate&event=push&branch=main&status=success&per_page=1" --jq .total_count)
            if ! grep -qE '^[0-9]+$' <<< "$runs"; then
              echo "::error::Couldn't read the push CI runs of $candidate."
              exit 1
            fi
            if [ "$runs" -gt 0 ]; then
              green="$candidate"
              break
            fi
          done
          if [ -z "$green" ]; then
            echo "::error::The merge base's tests fail and no commit within 20 of it on main has a green push CI run. Fix main first (docs/guides/broken-main.md)."
            exit 1
          fi
          echo "::warning title=baseline-walked-back::The merge base's tests fail, so main is red. Using ${green}, $back commit(s) back on main and the newest with a green push CI run, as the baseline. Fix main (docs/guides/broken-main.md)."
          git checkout --quiet --force --detach "$green"
          git clean -fdxq
          pnpm install --frozen-lockfile
          echo "sha=$green" >> "$GITHUB_OUTPUT"
          pnpm exec turbo run test --force --continue --output-logs=errors-only
      # Runs even when a test failed: the guard reports a missing result file.
      - id: pack
        name: Pack the test results
        if: always()
        run: |
          find . -name node_modules -prune -o -path '*/test-results/vitest.json' -type f -print \
            | sed 's|^\./||' | sort | tar -cf "$RUNNER_TEMP/test-results.tar" -T -
          sha256=$(sha256sum "$RUNNER_TEMP/test-results.tar" | cut -d' ' -f1)
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: merge-base-test-results
          path: ${{ runner.temp }}/test-results.tar
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # Trace and the requirement guard, run from the merge base's copy of
  # tooling/check. No pull-request code runs here: the pull
  # request's checkout is only read, only the merge base's dependencies are
  # installed, and Node comes from the merge base. Pull requests only: in
  # the merge queue the build job runs trace itself, as on main.
  guard:
    name: Requirements and the requirement guard (merge base's copy)
    needs: [changes, build, base-tests]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      HEAD_DIR: ${{ github.workspace }}/head
      BASE_DIR: ${{ github.workspace }}/base
    steps:
      # Without it the base checkout below would fall back to the pull
      # request's own commit, and the guard would compare it with itself.
      - name: Stop if the merge base or its results are unknown
        env:
          BASE_SHA: ${{ needs.base-tests.outputs.sha }}
          RESULTS_ID: ${{ needs.base-tests.outputs.results-id }}
          RESULTS_SHA256: ${{ needs.base-tests.outputs.results-sha256 }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "::error::The merge base's tests job didn't report which commit it tested."
            exit 1
          fi
          if ! grep -qE '^[0-9]+$' <<< "$RESULTS_ID" || ! grep -qE '^[0-9a-f]{64}$' <<< "$RESULTS_SHA256"; then
            echo "::error::The merge base's tests job didn't report its result archive's ID and sha256."
            exit 1
          fi
      # The same commit the build job tested.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: head
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: base
          ref: ${{ needs.base-tests.outputs.sha }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: false
          package_json_file: base/package.json
      - name: Install the merge base's dependencies
        working-directory: base
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pull-request-test-results
          path: ${{ runner.temp }}/head-results
      # By the ID its own job reported, then checked against its sha256: an
      # artifact a pull request uploads under the same name is never read.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.base-tests.outputs.results-id }}
          path: ${{ runner.temp }}/base-results
      - name: Check the merge base's archive is the one its job packed
        env:
          RESULTS_SHA256: ${{ needs.base-tests.outputs.results-sha256 }}
        run: |
          echo "$RESULTS_SHA256  $RUNNER_TEMP/base-results/test-results.tar" | sha256sum --check --strict
      # The pull request's archive is its own code's output, so each entry
      # must be a plain result file that lands where its name says: no
      # links, no "..", and no folder in the checkout that links elsewhere.
      - name: Unpack both sides' test results
        run: |
          unpack() {
            local archive="$1" into
            into=$(realpath "$2")
            if tar -tvf "$archive" | grep -qv '^-'; then
              echo "::error::$archive holds something other than plain files."
              return 1
            fi
            while IFS= read -r entry; do
              if ! grep -qE '^([A-Za-z0-9_@-][A-Za-z0-9._@-]*/)*test-results/vitest\.json$' <<< "$entry" \
                || grep -qE '(^|/)\.\.?(/|$)' <<< "$entry" \
                || [ "$(realpath -m "$into/$entry")" != "$into/$entry" ]; then
                echo "::error::$archive holds an unexpected entry: $entry"
                return 1
              fi
            done < <(tar -tf "$archive")
            tar -xf "$archive" -C "$into" --no-same-owner --no-same-permissions
          }
          unpack "$RUNNER_TEMP/head-results/test-results.tar" "$HEAD_DIR"
          unpack "$RUNNER_TEMP/base-results/test-results.tar" "$BASE_DIR"
      # Runs the merge base's files with the merge base's Node (devEngines
      # gives a Node that runs TypeScript). Calling pnpm in the pull
      # request's checkout would read its config, so only node runs there.
      - name: Find the merge base's Node
        working-directory: base
        run: echo "BASE_NODE=$(pnpm exec node -p process.execPath)" >> "$GITHUB_ENV"
      # Reads the result files the tests wrote. A missing result
      # file fails the check.
      - name: Requirements and their tests (trace, merge base's copy)
        working-directory: head
        run: '"$BASE_NODE" "$BASE_DIR/tooling/check/src/cli/check.ts" trace --report'
      # Blocking through ci-ok. The base side is the main commit the merge
      # ref was built on (base-tests), so the guard sees only the pull
      # request's own changes. A note's signature is
      # checked offline against the keys in
      # the base branch's tooling/check/approvers.json (pull_request.base.sha,
      # not the commit base-tests may have stepped back to). Both commits
      # are fetched as objects only: nothing of the pull request runs.
      - name: Requirement guard (merge base's copy)
        if: ${{ !cancelled() }}
        working-directory: head
        env:
          BASE_SHA: ${{ needs.base-tests.outputs.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          guard="tooling/check/src/cli/requirement-guard.ts"
          [ -n "$BASE_SHA" ] || exit 1
          git fetch --quiet --no-tags --depth=1 origin "$PR_HEAD_SHA" "$PR_BASE_SHA"
          # Asks the merge base commit itself, not a folder on disk.
          if ! git -C "$BASE_DIR" cat-file -e "$BASE_SHA:$guard" 2>/dev/null; then
            echo "::notice title=requirement-guard::The merge base has no requirement guard yet; it runs from the next pull request on."
            exit 0
          fi
          "$BASE_NODE" "$BASE_DIR/$guard" --base "$BASE_DIR" --branch "$HEAD_BRANCH" \
            --repo "$REPO" --pr "$PR_NUMBER" --head-sha "$PR_HEAD_SHA" --base-sha "$PR_BASE_SHA"

  scaffold:
    # Proves the templates still pass every check, so `pnpm new` never
    # hands an agent a package that fails.
    name: Empty package and feature pass every check
    needs: changes
    if: needs.changes.outputs.scaffold == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - name: Create an empty package and an empty feature
        run: |
          git config user.name "CI"
          git config user.email "ci@users.noreply.github.com"
          pnpm new package core/ci-example --owner ci --purpose "Empty example package that CI generates to prove the scaffold passes every check."
          pnpm new package adapters/ci-example --runtime node --owner ci --purpose "Empty example adapter that CI generates to prove the scaffold passes every check."
          pnpm new package host/ci-example --owner ci --purpose "Empty example host package that CI generates to prove the scaffold passes every check."
          pnpm new package targets/ci-example/runtime --owner ci --purpose "Empty example target that CI generates to prove the scaffold passes every check."
          pnpm new feature ci-example --owner ci --purpose "Empty example feature that CI generates to prove the scaffold passes every check."
          pnpm install --no-frozen-lockfile
      - name: pnpm verify --full
        # This job runs every package's tests on one shared runner, so a test
        # that passes in its own job can pass the default 5 s limit only
        # barely (HAL-3852). Give each test and hook 30 s and use fewer workers.
        env:
          HALONIC_TEST_TIMEOUT: "30000"
          HALONIC_TEST_WORKERS: "2"
        run: pnpm verify --full

  # Conditional jobs. Each runs only when its area changes, and ci-ok
  # accepts "skipped". docs is a stub until the code it checks exists.
  tauri:
    # The shell and the crates under apps/studio/src-tauri, with the
    # dependency audit (cargo-deny). The same code builds on Windows in
    # tauri-windows.
    name: Tauri shell (Rust checks)
    needs: changes
    if: needs.changes.outputs.tauri == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/studio/src-tauri
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      # Line tables only: backtraces keep file and line, and the cached build
      # folder is a fraction of the size with full debug info.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup is part of the runner image. With no arguments it installs the
      # version and components named in rust-toolchain.toml.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      # The crate registry and the build folder, so only our own crates
      # compile again. Keyed on the lockfile and the toolchain. Only main
      # saves; every branch and queue entry reads main's copy.
      - name: Restore the Rust cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/studio/src-tauri/target
          key: rust-tauri-${{ runner.os }}-${{ hashFiles('apps/studio/src-tauri/Cargo.lock', 'apps/studio/src-tauri/rust-toolchain.toml') }}
          restore-keys: rust-tauri-${{ runner.os }}-
      # Tauri reads the desktop window's page (dist/studio, tauri.conf.json)
      # when the shell compiles, so it is built first. Only the Studio page:
      # the Android job builds its own.
      - uses: $/.github/actions/setup
      - name: Build the Studio page
        working-directory: apps/studio
        run: pnpm exec vite build --mode studio
      # Tauri builds against the system web view: WebKitGTK on Linux. The
      # keychain crate links libdbus for the Secret Service.
      # Every install step has its own time limit, so a hung mirror fails the
      # step in minutes instead of holding the job, and the merge queue, until
      # the job's limit (HAL-5958). 8 minutes covers one full apt attempt (3 +
      # 5 minutes) and leaves room for a fallback mirror; it usually takes 30 s.
      - name: Install the Linux libraries Tauri needs
        timeout-minutes: 8
        uses: $/.github/actions/apt-install
        with:
          packages: libwebkit2gtk-4.1-dev libxdo-dev libdbus-1-dev gnome-keyring dbus-daemon
      - name: Formatting (rustfmt)
        run: cargo fmt --all --check
      # --workspace: the shell is the root package, so without it Cargo
      # would check only the shell and skip the crates.
      - name: Lints (clippy)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --workspace
      # The keychain's contract test is ignored in plain `cargo test`: it
      # needs an unlocked keychain (HAL-4499). Here a GNOME Keyring on a
      # private D-Bus, unlocked with a password made for this run, is the
      # Secret Service it talks to.
      - name: Keychain contract (GNOME Keyring)
        run: |
          dbus-run-session -- sh -c '
            od -An -N16 -tx1 /dev/urandom | tr -d " \n" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            cargo test --locked -p halonic-keychain -- --ignored
          '
      # Licences, security advisories, banned wildcards and unknown sources,
      # read from deny.toml. The binary is pinned and its checksum checked.
      # It runs on the toolchain installed above.
      - name: Dependency audit (cargo-deny)
        env:
          CARGO_DENY_VERSION: "0.20.2"
          CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 10 \
            --output "$RUNNER_TEMP/cargo-deny.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${name}.tar.gz"
          echo "${CARGO_DENY_SHA256}  $RUNNER_TEMP/cargo-deny.tar.gz" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/cargo-deny.tar.gz" --directory "$RUNNER_TEMP"
          "$RUNNER_TEMP/${name}/cargo-deny" --locked --log-level warn check
      - name: Save the Rust cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/studio/src-tauri/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

  tauri-windows:
    # The Windows smoke build (HAL-192): the shell and the crates pass
    # clippy and their tests on Windows too, so a Windows-only path (the
    # Credential Manager, git found by absolute path, \\?\ paths) can't
    # break unseen. Formatting and cargo-deny don't depend on the platform,
    # so they run only in the Linux job.
    name: Tauri shell on Windows (build and tests)
    needs: changes
    if: needs.changes.outputs.tauri == 'true'
    runs-on: windows-2025
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
        working-directory: apps/studio/src-tauri
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      # Line tables only: backtraces keep file and line, and the cached build
      # folder is a fraction of the size with full debug info.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the version named in rust-toolchain.toml for the runner's
      # own target, x86_64-pc-windows-msvc. WebView2 is part of the image.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Restore the Rust cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/studio/src-tauri/target
          key: rust-tauri-${{ runner.os }}-${{ hashFiles('apps/studio/src-tauri/Cargo.lock', 'apps/studio/src-tauri/rust-toolchain.toml') }}
          restore-keys: rust-tauri-${{ runner.os }}-
      # The desktop window's page, as in the Linux job. No pnpm store cache
      # on Windows (see the setup action).
      - uses: $/.github/actions/setup
        with:
          cache: false
      - name: Build the Studio page
        working-directory: apps/studio
        run: pnpm exec vite build --mode studio
      - name: Lints (clippy)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # B6 (HAL-3747): the Windows folder key cases need 8.3 short names,
      # which runner volumes often have off. Use the temporary folder's
      # volume if it makes them; otherwise a small VHD formatted here with
      # them on. HALONIC_FOLDER_KEYS_ROOT makes the 8.3 cases required, so
      # they can't pass by being left out.
      - name: A folder with 8.3 short names for the folder keys
        run: |
          fsutil 8dot3name query
          $probe = Join-Path $env:RUNNER_TEMP 'Short Name Probe'
          New-Item -ItemType Directory -Force $probe | Out-Null
          $short = (New-Object -ComObject Scripting.FileSystemObject).GetFolder($probe).ShortPath
          Remove-Item $probe
          if ($short -match '~') {
            Write-Output "8.3 short names are on for $env:RUNNER_TEMP"
            $root = Join-Path $env:RUNNER_TEMP 'folder-keys'
          } else {
            Write-Output "8.3 short names are off for $env:RUNNER_TEMP ($short), so a VHD with them on"
            fsutil 8dot3name set 2
            $vhd = Join-Path $env:RUNNER_TEMP 'folder-keys.vhdx'
            $commands = Join-Path $env:RUNNER_TEMP 'folder-keys.diskpart'
            Set-Content $commands @(
              "create vdisk file=`"$vhd`" maximum=64 type=expandable",
              "select vdisk file=`"$vhd`"",
              'attach vdisk',
              'create partition primary',
              'format fs=ntfs quick label=FolderKeys',
              'assign letter=K'
            )
            diskpart /s $commands
            if ($LASTEXITCODE -ne 0) { throw 'diskpart could not make the volume' }
            $drive = 'K:'
            fsutil 8dot3name set $drive 0
            fsutil 8dot3name query $drive
            $root = Join-Path $drive 'folder-keys'
          }
          New-Item -ItemType Directory -Force $root | Out-Null
          Add-Content $env:GITHUB_ENV "HALONIC_FOLDER_KEYS_ROOT=$root"
      - name: Tests
        run: cargo test --locked --workspace
      # The runner's user has a logon session, so its Credential Manager
      # works without unlocking (HAL-4499).
      - name: Keychain contract (Credential Manager)
        run: cargo test --locked -p halonic-keychain -- --ignored
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      # The CLI's side of the folder keys: Node's realpath on the same golden
      # cases the shell's test checked above.
      - name: Folder keys, the CLI's side
        run: node crates/trust-grant/tests/windows-folder-keys.mjs
      - name: Save the Rust cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/studio/src-tauri/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

  tauri-keychain-macos:
    # The keychain crate's contract test against the real macOS Keychain
    # (HAL-4499). Plain `cargo test` ignores it, because it needs an
    # unlocked keychain. The job makes one for this run, with a random
    # password, and makes it the default. It builds only the keychain crate
    # and its dependencies, so no cache is restored.
    name: Keychain contract on macOS
    needs: changes
    if: needs.changes.outputs.tauri == 'true'
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/studio/src-tauri
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: A temporary keychain, unlocked
        run: |
          keychain="$RUNNER_TEMP/halonic-ci.keychain-db"
          password=$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')
          security create-keychain -p "$password" "$keychain"
          # No auto-lock timeout, so it stays unlocked for the whole test.
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
      - name: Keychain contract (Keychain)
        run: cargo test --locked -p halonic-keychain -- --ignored
      - name: Remove the temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/halonic-ci.keychain-db" || true

  sandbox-fence:
    # The real fence: the tests under packages/adapters/sandbox-srt/fence run
    # the actual sandbox-runtime (bubblewrap) and try to get out. Ubuntu 24.04
    # refuses unprivileged user namespaces through AppArmor by default, so the
    # job adds the AppArmor profile for bwrap from the sandbox guide first, the
    # same fix we give users (HAL-6030), and leaves the restriction on for
    # every other program. Without user namespaces the fence can't start and
    # these tests fail on purpose (never skip). No cache is restored.
    name: Sandbox fence (bubblewrap)
    needs: changes
    if: needs.changes.outputs.sandbox-fence == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - name: Install bubblewrap and socat
        timeout-minutes: 8
        uses: $/.github/actions/apt-install
        with:
          packages: bubblewrap socat ripgrep
      - name: Allow user namespaces for bubblewrap (AppArmor profile)
        # The AppArmor profile for bwrap that docs/security/sandbox.md points
        # users to; the guide gets this exact text in HAL-6007. The restriction
        # itself stays on, so the fence tests prove the profile.
        run: |
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          sudo tee /etc/apparmor.d/bwrap > /dev/null << 'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,

            include if exists <local/bwrap>
          }
          EOF
          sudo apparmor_parser --replace /etc/apparmor.d/bwrap
          bwrap --ro-bind / / --unshare-user -- true
      - name: Fence tests
        working-directory: packages/adapters/sandbox-srt
        run: pnpm test:fence
      - name: Integration runner fence tests
        # The built runner in a real session, and the escapes only the fence
        # stops (I5 attack cases), with Node's layer on and off.
        working-directory: packages/adapters/integration-runner
        run: pnpm test:fence

  sandbox-fence-macos:
    # The same fence tests on macOS, where sandbox-runtime uses Seatbelt
    # (sandbox-exec, built into the system) instead of bubblewrap, and there
    # is no process namespace (HAL-3513). Runs on the same changes as the
    # Linux job. A test that fails here and passes on Linux is a macOS gap
    # in the fence, not a flaky test. No cache is restored.
    name: Sandbox fence (Seatbelt)
    needs: changes
    if: needs.changes.outputs.sandbox-fence == 'true'
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - name: Fence tests
        working-directory: packages/adapters/sandbox-srt
        run: pnpm test:fence
      - name: Integration runner fence tests
        # The built runner in a real session, and the escapes only the fence
        # stops (I5 attack cases), with Node's layer on and off.
        working-directory: packages/adapters/integration-runner
        run: pnpm test:fence

  sandbox-os:
    # The sandbox and launcher packages, and the git adapter, on the other
    # two systems (plan phase 3): they start processes, build paths and read
    # the system, so what holds on Linux can still break on macOS or Windows.
    # Typecheck and tests only; lint and build don't depend on the platform. The
    # filters are globs so a package that doesn't exist yet (sandbox-host)
    # is no error. A test that can't run on a system skips itself with a
    # reason (`it.skipIf(...)`, for example bwrap on macOS): never a
    # failure, never a silent pass. Turbo runs with its loose environment
    # here: with the strict one, Windows PowerShell (which the process-table
    # tests start) gets too few variables and hangs until it is stopped.
    #
    # The Windows leg also runs the tests of the other packages that touch
    # paths, files and processes (HAL-4348, step 1 of HAL-4343; agent-host added in HAL-4672). Pull requests
    # and merge groups run the listed packages that changed or depend on a
    # changed one; a push to main runs the whole list plus the parity and
    # integration kits. A test that fails there today skips itself with
    # `it.skipIf(process.platform === 'win32')` and a reason naming its task.
    # The job name is a required check (#1352): don't rename it without a
    # ruleset change.
    name: Sandbox packages on ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.sandbox == 'true' || needs.changes.outputs.windows == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-15 }
          - { name: Windows, os: windows-2025 }
    env:
      # The macOS leg has work only when the sandbox area changed; the
      # Windows leg runs for either area.
      RUN_SANDBOX: ${{ needs.changes.outputs.sandbox == 'true' }}
      RUN_LIST: ${{ matrix.name == 'Windows' || needs.changes.outputs.sandbox == 'true' }}
    steps:
      # The whole history: Windows needs it for Turbo's `[base]` filter.
      - if: env.RUN_LIST == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - if: env.RUN_LIST == 'true'
        uses: $/.github/actions/setup
        with:
          cache: ${{ runner.os != 'Windows' }}
      - name: Typecheck and test
        if: env.RUN_SANDBOX == 'true'
        shell: bash
        run: >
          pnpm exec turbo run typecheck test --continue --env-mode=loose --output-logs=new-only
          --filter='@halonicjs/adapter-sandbox-*'
          --filter=@halonicjs/adapter-system-node
      # A step of its own, not in the run above: in one turbo run the git
      # adapter's tests load the machine at the same time as the sandbox
      # probes, and the probe that times a SIGINT then fails on macOS.
      - name: Git adapter, typecheck and test
        if: env.RUN_SANDBOX == 'true'
        shell: bash
        run: >
          pnpm exec turbo run typecheck test --env-mode=loose --output-logs=new-only
          --filter=@halonicjs/adapter-git
      # Which of the listed packages to test. On a push to main, all of them
      # and the integration and parity test kits. On a pull request or in a merge group, the
      # listed packages among those Turbo says changed or depend on a changed
      # package since the base commit. A change to the workflow or the setup
      # action runs the whole list (no package changed, the job itself did),
      # and so does anything that goes wrong in the selection.
      - id: select
        if: runner.os == 'Windows'
        name: Select the packages
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          list="@halonicjs/adapter-fs-node @halonicjs/adapter-harness-kit @halonicjs/adapter-harness-claude-code @halonicjs/adapter-harness-codex @halonicjs/adapter-mcp @halonicjs/workspace @halonicjs/app @halonicjs/app-agent-host halonic"
          if [ "$EVENT" = "push" ]; then
            list="$list @halonicjs/testing-integration @halonicjs/testing-parity"
            picked="$list"
            echo "Push to main: the whole list and the integration and parity test kits."
          else
            picked="$list"
            if [ -n "$BASE" ] && ! git diff --name-only "$BASE...HEAD" | grep -qE '^(\.github/workflows/ci\.yml$|\.github/actions/)'; then
              if changed=$(pnpm exec turbo ls --filter="...[$BASE]" --output=json | node -e '
                const out = JSON.parse(require("fs").readFileSync(0, "utf8"));
                console.log(out.packages.items.map((p) => p.name).join(" "));
              '); then
                picked=""
                for name in $list; do
                  case " $changed " in *" $name "*) picked="$picked $name" ;; esac
                done
                echo "Changed packages and their dependents, among the list: ${picked:-none}"
              else
                echo "::warning title=Windows packages::Turbo could not list the changed packages; running the whole list."
              fi
            fi
          fi
          filters=""
          for name in $picked; do filters="$filters --filter=$name"; done
          echo "filters=$filters" >> "$GITHUB_OUTPUT"
      - name: Test the Windows packages
        if: runner.os == 'Windows' && steps.select.outputs.filters != ''
        shell: bash
        env:
          FILTERS: ${{ steps.select.outputs.filters }}
          HALONIC_TEST_TIMEOUT: "30000"
        # No coverage here: the floors are checked on Linux, and the tests
        # skipped on Windows would only lower the numbers.
        run: pnpm exec turbo run test --continue --env-mode=loose --output-logs=new-only --summarize $FILTERS -- --coverage.enabled=false
      # Per package test time, from the Turbo run summary, so the numbers in
      # the windows-coverage document come from real runs.
      - name: Test time per package
        if: always() && runner.os == 'Windows' && steps.select.outputs.filters != ''
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const dir = ".turbo/runs";
            const files = fs.existsSync(dir) ? fs.readdirSync(dir).filter((f) => f.endsWith(".json")) : [];
            if (files.length === 0) process.exit(0);
            const latest = files.map((f) => dir + "/" + f).sort((a, b) => fs.statSync(b).mtimeMs - fs.statSync(a).mtimeMs)[0];
            const run = JSON.parse(fs.readFileSync(latest, "utf8"));
            const rows = run.tasks
              .filter((t) => t.task === "test" && t.execution && t.execution.endTime)
              .map((t) => ({
                name: t.package,
                seconds: (t.execution.endTime - t.execution.startTime) / 1000,
                result: t.execution.exitCode === 0 ? "passed" : "failed",
                cache: t.cache && t.cache.status,
              }))
              .sort((a, b) => b.seconds - a.seconds);
            const total = rows.reduce((sum, r) => sum + r.seconds, 0);
            const lines = ["### Windows test time per package", "", "| Package | Seconds | Result | Cache |", "|---|---:|---|---|"];
            for (const r of rows) lines.push(`| ${r.name} | ${r.seconds.toFixed(1)} | ${r.result} | ${r.cache} |`);
            lines.push("", `Sum of the packages: ${total.toFixed(1)} s. Whole Turbo run: ${((run.execution.endTime - run.execution.startTime) / 1000).toFixed(1)} s.`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '

  sandbox-windows:
    # The sandbox fence probes on a real Windows machine (HAL-1919): a hidden
    # file and a blocked loopback port, run through srt after its one-time
    # admin install. The runner's account is an administrator, so the install
    # needs no prompt. --skip-profile-grant keeps the install to the account
    # and the network filters; the probes use their own temp folder.
    #
    # Required (in ci-ok's needs). `srt-win wfp verify` timed out once after
    # 30 s on a runner with no leak (the probes never ran), so the probe step
    # tries again, but only when the probes did not run (exit code 2 or 3).
    # An observed leak (exit code 1) fails at once, so a leak that shows only
    # sometimes cannot pass on a second try. Each case's pass/fail line is in
    # the job summary.
    name: Sandbox fence on Windows (canary probes)
    needs: changes
    if: needs.changes.outputs.sandbox-fence == 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Not the shared setup action: its restored pnpm store fails on Windows
      # ("Access is denied" on a linked package), so this job installs
      # without the cache, and only what the sandbox package needs.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Install the dependencies
        run: pnpm install --frozen-lockfile --filter "@halonicjs/adapter-sandbox-srt..."
        shell: bash
      - name: Install the sandbox (srt windows-install)
        working-directory: packages/adapters/sandbox-srt
        shell: bash
        run: node node_modules/@anthropic-ai/sandbox-runtime/dist/cli.js windows-install --skip-profile-grant
      - name: Canary probes
        working-directory: packages/adapters/sandbox-srt
        shell: bash
        run: |
          rc=0
          node scripts/windows-fence-probe.mjs || rc=$?
          if [ "$rc" -eq 2 ] || [ "$rc" -eq 3 ]; then
            echo "The probes did not run (exit code $rc), trying once more."
            rc=0
            node scripts/windows-fence-probe.mjs || rc=$?
          fi
          exit "$rc"
      # The same fence through SandboxSession (HAL-4347): the session must say
      # `fenced`, and a program it starts must see the hidden file, the blocked
      # port and its own variables as the profile says, and kill must end its
      # process tree. Runs after the canary probes, which stay the plain proof.
      - name: Fence test through SandboxSession
        working-directory: packages/adapters/sandbox-srt
        shell: bash
        run: pnpm test:fence:windows
      # Removing the sandbox, as the uninstaller's `--sandbox-remove` does
      # (HAL-6180): the account, its group, the network filters, srt's machine
      # key and the grants a session left must all be gone, and a second
      # removal must be done too. Last, because it takes the install away.
      - name: Remove the sandbox
        working-directory: packages/adapters/sandbox-srt
        shell: bash
        run: pnpm test:remove:windows

  agent-host:
    # The agent host as one executable, built with Node's single-executable
    # support (HAL-2865). Proves on all three systems that the build works
    # and the executable runs, before the real host exists. Reports the size
    # and the build time in the job summary.
    name: Agent host executable (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.agent_host == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-24.04 }
          - { name: macOS, os: macos-15 }
          - { name: Windows, os: windows-2025 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: ${{ runner.os != 'Windows' }}
      - name: Build the executable
        run: |
          start=$SECONDS
          pnpm --filter @halonicjs/app-agent-host build:sea
          echo "BUILD_SECONDS=$((SECONDS - start))" >> "$GITHUB_ENV"
      - name: Run it, check the output and report the size
        env:
          SYSTEM: ${{ matrix.name }}
        run: |
          out=$(pnpm --filter @halonicjs/app-agent-host smoke:sea | tail -n 1)
          echo "$out"
          echo "### Agent host on ${SYSTEM}" >> "$GITHUB_STEP_SUMMARY"
          echo "$out" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Build time: ${BUILD_SECONDS} s" >> "$GITHUB_STEP_SUMMARY"

  installer-windows:
    # The Windows installer (HAL-1202): built with the custom NSIS template,
    # named as HAL-1119 settled, installed silently into a temporary folder
    # and uninstalled again. Checks the files, the per-user install (no
    # admin), and that Halonic reopens only on /RELAUNCH (HAL-1139). The
    # screens, the sandbox step and the signing are later parts of the stack.
    name: Windows installer (build, install, uninstall)
    needs: changes
    if: needs.changes.outputs.tauri == 'true' || needs.changes.outputs.agent_host == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: false
      - name: Install the pinned Rust toolchain
        working-directory: apps/studio/src-tauri
        run: rustup toolchain install
      - name: Build the installer
        working-directory: apps/studio/src-tauri
        run: pwsh windows/build-installer.ps1
      - name: Walk the installer's pages and take a picture of each
        run: pwsh apps/studio/src-tauri/windows/screenshot-installer.ps1 -Setup (Resolve-Path "dist/Halonic-*-windows-x64-setup.exe") -InstallFolder (Join-Path $env:RUNNER_TEMP 'Halonic-pages') -OutFolder installer-pages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: halonic-installer-pages
          path: installer-pages/*.png
          retention-days: 7
          if-no-files-found: ignore
      - name: Install it silently, then check what it left
        run: |
          $version = (Get-Content apps/studio/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $setup = Resolve-Path "dist/Halonic-$version-windows-x64-setup.exe"
          $dir = Join-Path $env:RUNNER_TEMP 'Halonic'
          $p = Start-Process $setup -ArgumentList '/S', "/D=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "The installer exited with $($p.ExitCode)" }
          Get-ChildItem $dir -Recurse -ErrorAction SilentlyContinue | Select-Object -First 40 -ExpandProperty FullName | Out-Host
          foreach ($f in 'Halonic.exe', 'halonic-agent-host.exe', 'uninstall.exe', 'sandbox-step.ps1') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "$f is missing from the install folder" }
          }
          # Per user: the uninstall entry is in HKCU, none in HKLM.
          if (-not (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Halonic')) { throw 'No uninstall entry for the current user' }
          if (Test-Path 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Halonic') { throw 'The install wrote a machine-wide uninstall entry' }
          # The size line on page 1 says about SIZE_MB MB: it must be within a quarter.
          $said = [int]((Select-String -Path apps/studio/src-tauri/windows/installer.nsi -Pattern '^!define SIZE_MB (\d+)').Matches[0].Groups[1].Value)
          $real = [math]::Round(((Get-ChildItem $dir -Recurse -File | Measure-Object Length -Sum).Sum) / 1MB)
          Write-Output "installed size: $real MB (page 1 says $said MB)"
          if ([math]::Abs($real - $said) -gt $said / 4) { throw "Page 1 says $said MB, the install is $real MB. Change SIZE_MB in installer.nsi." }
          # `/S` leaves Halonic closed.
          Start-Sleep -Seconds 5
          if (Get-Process Halonic -ErrorAction SilentlyContinue) { throw 'Halonic was opened by a silent install without /RELAUNCH' }
          # The agent host runs from the installed folder.
          $profile = Join-Path $env:RUNNER_TEMP 'host-profile'
          $v = & (Join-Path $dir 'halonic-agent-host.exe') --profile-folder $profile --version
          if ($LASTEXITCODE -ne 0) { throw 'The installed agent host did not start' }
          Write-Output "agent host: $v"
          Add-Content $env:GITHUB_ENV "HALONIC_TEST_DIR=$dir"
      - name: The sandbox step maps each outcome to its exit code and its reason
        run: |
          $step = Join-Path $env:HALONIC_TEST_DIR 'sandbox-step.ps1'
          # A stand-in for the agent host: its answers come from environment variables.
          $fake = Join-Path $env:RUNNER_TEMP 'fake-host.cmd'
          @'
          @echo off
          echo %* | findstr /C:"--sandbox-setup" >nul && goto setup
          echo %* | findstr /C:"--sandbox-check" >nul && goto check
          exit /b 2
          :setup
          if "%FAKE_SETUP%"=="ok" goto setupok
          echo {"ok":false,"reason":"the firewall filter isn't active"}
          exit /b 1
          :setupok
          echo {"ok":true}
          exit /b 0
          :check
          if "%FAKE_CHECK%"=="ok" goto checkok
          if "%FAKE_CHECK%"=="hang" ping -n 30 127.0.0.1 >nul
          echo {"ok":false,"reason":"windows","missing":["srt's Windows install is missing"]}
          exit /b 0
          :checkok
          echo {"ok":true,"reason":null,"missing":[]}
          exit /b 0
          '@ | Set-Content $fake -Encoding ASCII
          $cases = @(
            @{ setup = 'ok'; check = 'ok'; code = 0; reason = '' },
            @{ setup = 'fail'; check = 'ok'; code = 11; reason = "the firewall filter isn't active" },
            @{ setup = 'ok'; check = 'fail'; code = 12; reason = "srt's Windows install is missing" },
            @{ setup = 'ok'; check = 'hang'; code = 12; reason = "it didn't answer within 3 seconds" }
          )
          foreach ($c in $cases) {
            $env:FAKE_SETUP = $c.setup; $env:FAKE_CHECK = $c.check
            $out = (& powershell.exe -NoProfile -ExecutionPolicy Bypass -File $step -HostExe $fake -ProfileFolder (Join-Path $env:RUNNER_TEMP 'p') -NoElevate -CheckSeconds 3 | Out-String).Trim()
            Write-Output "setup=$($c.setup) check=$($c.check): exit $LASTEXITCODE, '$out'"
            if ($LASTEXITCODE -ne $c.code) { throw "Expected exit $($c.code)" }
            if ($out -ne $c.reason) { throw "Expected the reason '$($c.reason)'" }
          }
          $global:LASTEXITCODE = 0
      - name: The "Halonic is open" and "newer Halonic installed" messages
        run: |
          $version = (Get-Content apps/studio/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          pwsh apps/studio/src-tauri/windows/test-messages.ps1 -Setup (Resolve-Path "dist/Halonic-$version-windows-x64-setup.exe") -InstallFolder $env:HALONIC_TEST_DIR -Version $version -OutFolder installer-messages
      - name: The run-again page, with and without Repair
        run: |
          $version = (Get-Content apps/studio/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          pwsh apps/studio/src-tauri/windows/test-run-again.ps1 -Setup (Resolve-Path "dist/Halonic-$version-windows-x64-setup.exe") -InstallFolder $env:HALONIC_TEST_DIR -OutFolder installer-messages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: halonic-installer-messages
          path: installer-messages/*.png
          retention-days: 7
          if-no-files-found: ignore
      - name: Install again with /RELAUNCH, Halonic reopens
        run: |
          $version = (Get-Content apps/studio/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $setup = Resolve-Path "dist/Halonic-$version-windows-x64-setup.exe"
          # No -Wait: it would also wait for the Halonic the installer opens.
          Start-Process $setup -ArgumentList '/S', '/RELAUNCH', "/D=$env:HALONIC_TEST_DIR"
          $running = $null
          foreach ($i in 1..60) {
            Start-Sleep -Seconds 2
            $running = Get-Process Halonic -ErrorAction SilentlyContinue
            if ($running) { break }
          }
          if (-not $running) { throw 'Halonic was not reopened after /RELAUNCH' }
          $running | Stop-Process -Force
      - name: Uninstall
        run: |
          $u = Join-Path $env:HALONIC_TEST_DIR 'uninstall.exe'
          Start-Process $u -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 5
          if (Test-Path (Join-Path $env:HALONIC_TEST_DIR 'Halonic.exe')) { throw 'Halonic.exe is still there after uninstall' }
          if (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Halonic') { throw 'The uninstall entry is still there' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: halonic-windows-installer-test
          path: dist/*.exe
          retention-days: 3
          if-no-files-found: ignore

  android:
    # The Android connect shell's debug APK, for arm64 phones and x86_64
    # emulators. Its own job, so the slow Android build never holds up the
    # Rust checks. The runner image brings the Android SDK, the NDK and
    # Java 17. The signed release build is HAL-1203.
    name: Android shell (debug APK)
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      # Line tables only: backtraces keep file and line, and the cached build
      # folder is a fraction of the size with full debug info.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs @tauri-apps/cli with the rest of the workspace.
      - uses: $/.github/actions/setup
      # The Gradle download and its dependencies, so a network blip on
      # services.gradle.org does not turn main red. Keyed on the files that
      # pin them; scoped per branch like the Turbo cache above.
      # Restore and save are separate so the save can run after a failed
      # build: what was downloaded before the failure is kept.
      - name: Restore the Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/studio/src-tauri/gen/android/**/*.gradle*', 'apps/studio/src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      # Fetches the Gradle distribution with retries, so a 5xx from
      # services.gradle.org on a cold cache does not fail the build.
      - name: Download the Gradle distribution (with retries)
        working-directory: apps/studio/src-tauri/gen/android
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          for attempt in 1 2 3 4; do
            ./gradlew --version && exit 0
            echo "Gradle download failed (attempt $attempt), retrying"
            sleep $((attempt * 20))
          done
          exit 1
      - name: Install the pinned Rust toolchain and the Android targets
        working-directory: apps/studio/src-tauri
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android x86_64-linux-android
      - name: Restore the Rust cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/studio/src-tauri/target
          key: rust-android-${{ runner.os }}-${{ hashFiles('apps/studio/src-tauri/Cargo.lock', 'apps/studio/src-tauri/rust-toolchain.toml') }}
          restore-keys: rust-android-${{ runner.os }}-
      # One retry for a download that still fails after Gradle's own retries.
      # It also reruns a real compile error, so it stays at 2 attempts to keep
      # a broken build well inside the job timeout.
      - name: Build the debug APK
        working-directory: apps/studio
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          for attempt in 1 2; do
            pnpm exec tauri android build --debug --apk --target aarch64 --target x86_64 && exit 0
            echo "::warning title=android::Build attempt $attempt failed."
            [ "$attempt" -lt 2 ] && sleep 20
          done
          exit 1
      # For trying a pull request's build on a phone or an emulator.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-debug-apk
          path: apps/studio/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          if-no-files-found: error
          retention-days: 7
      # Even when the build failed, but not on an exact key hit (nothing new).
      # Reuses the restore step's key: the build generates more *.gradle* files,
      # so hashing again here would give a different key. Only main saves:
      # every branch and queue entry reads main's copy.
      - name: Save the Gradle cache
        if: ${{ always() && github.ref == 'refs/heads/main' && steps.gradle-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
      - name: Save the Rust cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/studio/src-tauri/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

  e2e:
    # What jsdom can't show, in real Chromium and WebKit (Tauri's engine on
    # macOS and Linux): the shell's pages in
    # packages/studio/shell/e2e (HAL-3996). The browsers are installed here
    # only, never in the agents' runner container. Playwright's web server
    # builds the pages and serves them, and stops with the tests.
    name: Studio end-to-end (Playwright)
    needs: changes
    if: needs.changes.outputs.studio == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      # Not `install --with-deps`: that runs apt-get itself, and stalled until
      # the job timed out when the Ubuntu mirrors were down (HAL-5765). The
      # dry run asks `apt-get install -s` which of Playwright's packages are
      # missing; a stand-in apt-get that reports every one turns that into
      # Playwright's own list, without the network.
      - id: playwright-deps
        name: List the Linux packages Playwright needs
        working-directory: packages/studio/shell
        run: |
          shim="$RUNNER_TEMP/apt-get-list"
          mkdir -p "$shim"
          printf '#!/bin/sh\nfor p; do case "$p" in -*|install) ;; *) echo "Inst $p ";; esac; done\n' > "$shim/apt-get"
          chmod +x "$shim/apt-get"
          out=$(PATH="$shim:$PATH" pnpm exec playwright install-deps --dry-run chromium webkit) || true
          packages=$(sed -n 's/^  //p' <<< "$out" | tr '\n' ' ')
          if [ -z "${packages// }" ]; then
            echo "::error::Couldn't list Playwright's Linux packages:"$'\n'"$out"
            exit 1
          fi
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
      - name: Install the Linux libraries Playwright needs
        timeout-minutes: 8
        uses: $/.github/actions/apt-install
        with:
          packages: ${{ steps.playwright-deps.outputs.packages }}
      # Downloaded from Playwright's CDN, usually in 10 s (HAL-5958).
      - name: Install Chromium and WebKit for Playwright
        timeout-minutes: 5
        working-directory: packages/studio/shell
        run: pnpm exec playwright install chromium webkit
      - name: Shell end-to-end tests
        working-directory: packages/studio/shell
        run: pnpm e2e
      # The report and traces of a failed run, to step through the failure.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-report
          path: packages/studio/shell/test-results
          if-no-files-found: ignore
          retention-days: 7

  docs:
    name: Docs build and link check
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - run: echo "::notice title=docs::Not set up yet; arrives with apps/docs."

  # Merge queue only: a queue entry that has already failed keeps its place,
  # and everything behind it waits, until the slowest job ends (HAL-4253). This
  # job watches the run's other jobs and cancels the run as soon as one fails,
  # so ci-ok fails within a minute. Pull requests don't use it: the author
  # should see every failure at once. It runs no repository code (no
  # checkout), so the write permission below is only used by the `gh` calls here.
  fail-fast:
    name: Cancel the run on the first failure
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # costs nothing when the run ends early; ci-ok doesn't wait for it
    permissions:
      actions: write # to list the run's jobs and cancel the run
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Watch the other jobs
        shell: bash
        run: |
          # Every merge group polls the API for its whole run, so the interval
          # counts against the token's hourly limit: 30 s, and a growing wait
          # (up to 5 min) after an error such as a rate limit (HAL-5146).
          pause=30
          while true; do
            jobs=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" --jq '.jobs[]' | jq -s .) || { sleep "$pause"; pause=$((pause * 2 > 300 ? 300 : pause * 2)); continue; }
            pause=30
            # Our own job and ci-ok don't count; a job that hasn't finished yet has no conclusion.
            failed=$(echo "$jobs" | jq -r '[.[] | select(.name != "ci-ok" and (.name | startswith("Cancel the run") | not)) | select(.conclusion == "failure" or .conclusion == "timed_out") | .name] | join(", ")')
            if [ -n "$failed" ]; then
              echo "::error::Failed: $failed. Cancelling the run so the queue moves on."
              gh run cancel "$RUN_ID" --repo "$REPO"
              exit 0
            fi
            open=$(echo "$jobs" | jq '[.[] | select(.name != "ci-ok" and (.name | startswith("Cancel the run") | not)) | select(.status != "completed")] | length')
            [ "$open" = "0" ] && exit 0
            sleep 30
          done

  policy-base:
    # The policy rules, run from the base commit's copy: the rules and the
    # allow-lists they trust (dependencies.json, process-starters.json,
    # policy.json, advisories-ignored.json, overrides-allowed.json,
    # licences.json) come from the base, and only the files under test come
    # from the pull request. deny.toml is one of those files: it is what the
    # deny-toml rule checks, not a list. A change to a rule or a list is
    # checked against the old one and takes effect after it merges. `fast`
    # still runs the pull request's own copy for early feedback. The one
    # pull request that adds `--lists-from` runs the old script, which reads
    # the pull request's lists.
    name: Policy rules (base commit's copy)
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      HEAD_DIR: ${{ github.workspace }}/head
      BASE_DIR: ${{ github.workspace }}/base
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: head
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: base
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: false
          package_json_file: base/package.json
      - name: Install the base commit's dependencies
        working-directory: base
        run: pnpm install --frozen-lockfile
      # Runs the base's files with the base's Node. Calling pnpm in the pull
      # request's checkout would read its config, so only node runs there.
      - name: Policy rules (layers, dependencies, process-starts, lockfile, advisories, deny-toml)
        working-directory: head
        run: |
          base_node=$(cd "$BASE_DIR" && pnpm exec node -p process.execPath)
          script="$BASE_DIR/tooling/check/src/cli/check.ts"
          rules="layers dependencies process-starts lockfile advisories deny-toml"
          if grep -q -e '--lists-from' "$script"; then
            # shellcheck disable=SC2086
            "$base_node" "$script" $rules --lists-from "$BASE_DIR"
          else
            echo "::notice::The base commit's check script has no --lists-from yet; running it without the flag (only until the pull request that adds it merges)."
            # shellcheck disable=SC2086
            "$base_node" "$script" $rules
          fi

  ci-ok:
    name: ci-ok
    # Not always(): in a pull request run that was itself cancelled (a newer
    # push replaced it) ci-ok ends as cancelled, not failed, so the newer
    # run's result is the one that shows. Cancelled never satisfies the
    # required check, unlike skipped. In any other run a cancelled or failed
    # job still fails it. In a merge-queue run nothing replaces the run, but
    # fail-fast (above) cancels it when a job fails. There ci-ok runs
    # anyway and reports that failure at once. ci-ok doesn't need fail-fast:
    # a watcher that timed out or errored must not fail a green run.
    if: ${{ github.event_name == 'merge_group' || !cancelled() }}
    needs:
      [
        changes,
        fast,
        leaks,
        policy-base,
        coverage-floors,
        gitleaks,
        zizmor,
        build,
        base-tests,
        guard,
        scaffold,
        tauri,
        tauri-windows,
        tauri-keychain-macos,
        sandbox-fence,
        sandbox-fence-macos,
        sandbox-os,
        sandbox-windows,
        agent-host,
        installer-windows,
        android,
        e2e,
        docs,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Every job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped")] | length')
          if [ "$failed" != "0" ]; then
            echo "::error::$failed required job(s) failed or were cancelled."
            exit 1
          fi
