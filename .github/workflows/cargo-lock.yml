# Regenerates the Tauri shell's Cargo.lock for a branch, for anyone without
# a Rust toolchain (HAL-2665). Run it by hand on the branch that changes
# apps/studio/src-tauri/Cargo.toml:
#
#   gh workflow run cargo-lock.yml --ref <branch>
#   rm apps/studio/src-tauri/Cargo.lock
#   gh run download <run-id> --name cargo-lock --dir apps/studio/src-tauri
#
# (gh run download refuses to overwrite an existing file, hence the rm),
# then commit the downloaded Cargo.lock. `cargo update --workspace` resolves
# what the manifests added or changed and keeps every other locked version,
# so the diff stays small. It never pushes: the lockfile only comes back as
# an artifact, and the pull request's own CI checks it with --locked.

name: Cargo lockfile

on:
  workflow_dispatch:

permissions: {}

jobs:
  cargo-lock:
    name: Regenerate Cargo.lock
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/studio/src-tauri
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup is part of the runner image. With no arguments it installs the
      # version named in rust-toolchain.toml.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Update the workspace's lock entries
        run: cargo update --workspace
      - name: Show what changed
        run: git diff --stat -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-lock
          path: apps/studio/src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 7
