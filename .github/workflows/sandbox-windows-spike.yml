# Phase 5 spike (HAL-3775, board decision on HAL-3288): native srt on a free
# GitHub-hosted Windows runner. Installs the srt version the lockfile pins
# (one-time windows-install), then runs the canary probes and the Windows
# attack, bypass and tool probes, and the verdict probes of HAL-3776.
# Report-only: the pass/fail per probe is in the job summary and in the
# uploaded windows-*-results.json files. It runs by hand
# and on a change to the spike's own files, never on every pull request.
name: Sandbox Windows spike

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/sandbox-windows-spike.yml
      - packages/adapters/sandbox-srt/scripts/windows-spike-probe.mjs
      - packages/adapters/sandbox-srt/scripts/windows-probe-kit.mjs
      - packages/adapters/sandbox-srt/scripts/windows-verdict-probe.mjs
      - packages/adapters/sandbox-srt/scripts/windows-isolation-probe.mjs
      - packages/adapters/sandbox-srt/scripts/windows-wsl-probe.mjs
      - packages/adapters/sandbox-srt/scripts/windows-token-probe.ps1

permissions:
  contents: read

jobs:
  spike:
    name: Native srt on Windows (spike)
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Not the shared setup action: its restored pnpm store fails on Windows.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Install the dependencies
        run: pnpm install --frozen-lockfile --filter "@halonicjs/adapter-sandbox-srt..."
        shell: bash
      - name: Install the sandbox (srt windows-install)
        working-directory: packages/adapters/sandbox-srt
        shell: bash
        run: |
          node node_modules/@anthropic-ai/sandbox-runtime/dist/cli.js --version || true
          node node_modules/@anthropic-ai/sandbox-runtime/dist/cli.js windows-install --skip-profile-grant
      - name: Canary probes
        working-directory: packages/adapters/sandbox-srt
        shell: bash
        run: node scripts/windows-fence-probe.mjs
      - name: Spike probes (attacks, bypasses, tools)
        if: always()
        working-directory: packages/adapters/sandbox-srt
        shell: bash
        run: node scripts/windows-spike-probe.mjs
      - name: Verdict probes (DNS, WebDAV, token switches, more tools)
        if: always()
        working-directory: packages/adapters/sandbox-srt
        shell: bash
        run: node scripts/windows-verdict-probe.mjs
      # Best effort: a WSL1 distro for the WSL probe (HAL-3776). Free runners
      # have no nested virtualisation, so WSL2 cannot run; a failure here only
      # makes the distro probe NOT-TESTABLE.
      - name: Install a WSL1 Ubuntu distro (best effort)
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        shell: pwsh
        run: |
          wsl.exe --set-default-version 1
          wsl.exe --install -d Ubuntu --web-download --no-launch
          wsl.exe -d Ubuntu -u root -e true
          wsl.exe -l -v
      - name: Verdict probes (WSL, SMB loopback, kept grants)
        if: always()
        working-directory: packages/adapters/sandbox-srt
        shell: bash
        run: node scripts/windows-isolation-probe.mjs
      # A pinned Alpine root file system (3.6 MB) for the WSL probes (HAL-5407).
      # A failed download or hash check removes the file, so the WSL probe
      # reports NOT-TESTABLE instead of importing an unverified file.
      - name: Download a small Linux root file system
        if: always()
        continue-on-error: true
        shell: bash
        env:
          SHA256: 412454ed98025ad9cd910d13f3d448b184e81502baa83180e89f98d0f13674be
        run: |
          rootfs="$RUNNER_TEMP/rootfs.tar.gz"
          url="https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/x86_64/alpine-minirootfs-3.22.2-x86_64.tar.gz"
          curl -sSfL -o "$rootfs" "$url" || { rm -f "$rootfs"; exit 1; }
          echo "$SHA256  $rootfs" | sha256sum -c - || { rm -f "$rootfs"; exit 1; }
      - name: WSL probes (sandbox-account distro, WSL 2)
        if: always()
        working-directory: packages/adapters/sandbox-srt
        shell: bash
        run: HALONIC_PROBE_ROOTFS="$RUNNER_TEMP/rootfs.tar.gz" node scripts/windows-wsl-probe.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-spike-results
          path: |
            packages/adapters/sandbox-srt/windows-spike-results.json
            packages/adapters/sandbox-srt/windows-verdict-results.json
            packages/adapters/sandbox-srt/windows-isolation-results.json
            packages/adapters/sandbox-srt/windows-wsl-results.json
          if-no-files-found: warn
