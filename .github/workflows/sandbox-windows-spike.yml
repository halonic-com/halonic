# HAL-7431 experiment branch only, never merged: times icacls on AppData.
name: Sandbox Windows spike

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    name: icacls on AppData (HAL-7431 experiment)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Install the dependencies
        run: pnpm install --frozen-lockfile --filter "@halonicjs/adapter-sandbox-srt..."
        shell: bash
      - name: Time icacls on AppData
        shell: pwsh
        run: ./icacls-experiment.ps1
