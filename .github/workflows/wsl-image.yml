# Builds Halonic's WSL image (HAL-5390): Debian minbase from a pinned snapshot.
# Build only: nothing is published. The image is kept as a build artifact for
# 7 days, and the download and on-disk sizes go into the job summary.
name: WSL image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/wsl-image.yml
      - infra/wsl-image/**

permissions:
  contents: read

jobs:
  build:
    name: Build the WSL image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # What only a new image brings needs a new image version (HAL-15161), and
      # the version never goes down (HAL-15778). The Dockerfile is in the list:
      # its mmdebstrap and archive keyring build the image. The updater isn't:
      # it travels with the runtime.
      - name: The image version goes up with the image
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          image_files=(infra/wsl-image/Dockerfile infra/wsl-image/build.sh
                       infra/wsl-image/customize.sh infra/wsl-image/snapshot.conf
                       infra/wsl-image/files/wsl.conf infra/wsl-image/files/opt-halonic-README
                       infra/wsl-image/files/NOTICE infra/wsl-image/files/dpkg-nodoc)
          before="$(git show "$BASE:infra/wsl-image/image-version" 2>/dev/null || echo 0)"
          after="$(cat infra/wsl-image/image-version)"
          for v in "$before" "$after"; do
            case "$v" in ''|*[!0-9]*)
              echo "::error::infra/wsl-image/image-version must hold one whole number (was '$before', now '$after')"
              exit 1 ;;
            esac
          done
          if [ "$((10#$after))" -lt "$((10#$before))" ]; then
            echo "::error::infra/wsl-image/image-version went down from $before to $after: an image version is never reused"
            exit 1
          fi
          changed="$(git diff --name-only "$BASE" HEAD -- "${image_files[@]}")"
          if [ -n "$changed" ] && [ "$((10#$after))" -eq "$((10#$before))" ]; then
            echo "::error::These change what the image holds, so raise infra/wsl-image/image-version: $changed"
            exit 1
          fi
      - name: Shellcheck
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck infra/wsl-image/build.sh infra/wsl-image/customize.sh infra/wsl-image/check.sh infra/wsl-image/runtime-archive.sh infra/wsl-image/build-in-docker.sh
      # The build container is infra/wsl-image/Dockerfile: Debian pinned by
      # digest, which Dependabot keeps fresh (HAL-6181).
      - name: Build and check
        run: infra/wsl-image/build-in-docker.sh "$RUNNER_TEMP/wsl-image"
      - name: Sizes
        run: |
          {
            echo "### WSL image size"
            echo
            echo '```json'
            cat "$RUNNER_TEMP/wsl-image/sizes.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: halonic-wsl-image
          path: ${{ runner.temp }}/wsl-image/*
          retention-days: 7
