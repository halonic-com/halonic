name: Guard notes

# The decision-note check, in a workflow a pull request can't change or
# switch off (HAL-1337). On pull_request_target, GitHub runs this file from
# the base branch, and the job runs only the base's code: the pull request's
# head is fetched as git objects and only read. No install, no cache, no
# secret, a read-only token. It checks that a change to the guard's own
# paths has a signed note, and that any note's signature
# verifies against the base's approvers.json. The test-result comparison
# stays in ci.yml's guard job.
#
# The run that blocks a merge is the organisation's required copy of this
# file, pinned by the ruleset to refs/heads/main, so a pull request can't
# change it. GitHub runs that copy on its own event types (opened,
# synchronize, reopened) and in the merge queue, where it compares the
# queued head with main (mergeBaseOf). This repository's own file also runs
# on merge_group from the merge group's commit, but that run is not the
# required one.
#
# The check compares the head with the base, so this file also runs on
# `edited`: after a base change it gives an early red on the pull request.
# The gate stays the required run against main in the queue. It runs only for
# pull requests into main or a release branch; the first step fails on any
# other base. It runs in full on every `edited`, which is one short job.
on:
  # zizmor: ignore[dangerous-triggers] runs only the base branch's code; the pull request is read as data
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
    branches: [main, "release/**"]
  merge_group:

permissions: {}

concurrency:
  # A merge group by its commit, as in ci.yml: a rebuilt group reuses its branch name.
  group: guard-notes-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
  cancel-in-progress: true

jobs:
  guard-notes:
    name: Decision note and the guard's own paths
    # MERGE_QUEUE_RUNNER: see the top of ci.yml (HAL-14115).
    runs-on: ${{ github.event_name == 'merge_group' && vars.MERGE_QUEUE_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
      # The merge queue looks up the queued pull request's head.
      pull-requests: read
    steps:
      - name: Base is main or a release branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref }}
        run: |
          base="${BASE_REF#refs/heads/}"
          case "$base" in
            main | release/*) echo "Base: $base" ;;
            *)
              echo "::error::The note check runs only against main or a release branch, not '$base'. Change the pull request's base."
              exit 1
              ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      # Blocking. An `internal` note signed by the CTO key covers routine
      # changes to .github/ and tooling/check/; a change to a trust root
      # needs two guardians' signatures (check.guard-two-guardians). This
      # job fails the pull request, and that blocks the merge today. ci-ok
      # can't wait for it, because it runs in another workflow.
      - name: Check the decision note (base branch's code)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          if [ -n "$QUEUE_REF" ]; then
            PR_NUMBER=$(sed -nE 's|^refs/heads/gh-readonly-queue/[^/]+/pr-([0-9]+)-[0-9a-f]+$|\1|p' <<< "$QUEUE_REF")
            if [ -z "$PR_NUMBER" ]; then
              echo "::error::Can't read the pull request number from $QUEUE_REF."
              exit 1
            fi
            PR_HEAD_SHA=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)
            PR_BRANCH=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.ref)
          fi
          git fetch --quiet --no-tags origin "$PR_HEAD_SHA"
          node tooling/check/src/cli/guard-notes.ts --repo "$REPO" --pr "$PR_NUMBER" \
            --branch "$PR_BRANCH" --head-sha "$PR_HEAD_SHA" --base-sha "$BASE_SHA"
