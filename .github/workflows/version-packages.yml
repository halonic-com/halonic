# Version packages: the release bot. On every push to main it does up to
# two things.
#
# - The pushed commit is a merged release pull request: one titled
#   "chore(release): Halonic <version>" where <version> is the app version
#   in apps/studio/package.json at that commit. It tags the commit
#   v<version>, unless that tag exists already. This is the pull request
#   this workflow opens, or a hand-made one such as the first release,
#   0.1.0, where the version is already set and no changeset is waiting.
#   Changing the version in another pull request never makes a tag. A
#   manual run never tags; re-run the failed push run instead. If the
#   pull request lookup fails, the run warns and tags nothing; re-run it.
# - Changesets are waiting, or pre mode was exited (pre.json says "exit"):
#   it runs `pnpm version-packages` (changeset version, then version:sync)
#   on the branch changeset-release/main and opens or updates the "Version
#   packages" pull request. That pull request sets the app version in
#   package.json, tauri.conf.json and Cargo.toml. It pushes the branch only
#   when the release change differs from the one already there, so CI on
#   the pull request is not restarted for nothing.
# - Nothing is waiting: it closes an open Version packages pull request,
#   which has nothing left to release.
#
# Token: the RELEASE_BOT_TOKEN secret (the halonic-dev account, with
# contents and pull requests write) when it exists. Without it the default
# token is used, and GitHub starts no workflow for what that token makes:
# CI does not run on the pull request until a person closes and reopens
# it, and the tag does not start the release workflow. Only the steps that
# push or call gh get a token.

name: Version packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: version-packages
  cancel-in-progress: false

jobs:
  version:
    name: Version pull request or release tag
    if: github.repository == 'halonic-com/halonic'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: $/.github/actions/setup
      - id: plan
        name: Count waiting changesets and find a merged release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md | wc -l)
          # After `changeset pre exit` the consumed changesets wait in
          # .changeset/pre/ and pre.json says "exit": that is waiting too.
          mode=""
          if [ -f .changeset/pre.json ]; then
            mode=$(node -p 'require("./.changeset/pre.json").mode')
          fi
          waiting=false
          if [ "$pending" != 0 ] || [ "$mode" = exit ]; then
            waiting=true
          fi
          version=$(node -p 'require("./apps/studio/package.json").version')
          # Is the pushed commit the merge of a release pull request? Ask
          # GitHub which pull request it came from and compare its title.
          release=false
          if [ "$EVENT" = push ]; then
            if titles=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[].title' 2> /dev/null); then
              if printf '%s\n' "$titles" | grep -Fxq "chore(release): Halonic $version"; then
                release=true
              fi
            else
              echo "::warning::The release check could not run: GitHub did not answer the pull request lookup for $SHA. Nothing was tagged. If this push merged a release pull request, re-run this failed push run to tag it."
            fi
          fi
          echo "waiting=$waiting" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Waiting changesets: $pending. Pre mode: ${mode:-off}. App version: $version. Release pull request merged: $release."
      - name: Check that the app versions agree
        if: steps.plan.outputs.release == 'true'
        run: pnpm check versions
      - name: Tag the release
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.plan.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          tag="v$VERSION"
          if gh api "repos/$REPO/git/ref/tags/$tag" > /dev/null 2>&1; then
            echo "$tag exists already; nothing to tag."
            exit 0
          fi
          gh api "repos/$REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$SHA" > /dev/null
          echo "Tagged $SHA as $tag."
      - id: bump
        name: Version the packages
        if: steps.plan.outputs.waiting == 'true'
        env:
          BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN != '' }}
        run: |
          if [ "$BOT_TOKEN" = "true" ]; then
            git config user.name "halonic-dev"
            git config user.email "353861737+halonic-dev@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi
          git switch -C changeset-release/main
          pnpm version-packages
          pnpm check versions
          version=$(node -p 'require("./apps/studio/package.json").version')
          git add -A
          git commit -s -q -m "chore(release): version packages for $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "## What and why"
            echo
            echo "Merging this pull request releases Halonic $version. It sets the app version in"
            echo "\`apps/studio/package.json\`, \`tauri.conf.json\` and \`Cargo.toml\` and turns the waiting"
            echo "changesets into the changelog. After the merge the release bot tags the commit \`v$version\`."
            echo
            echo "Made by the Version packages workflow. Don't edit this branch: it is rewritten on every push to main."
            echo
            echo "## Requirements"
            echo
            echo "No behaviour change: version and changelog only."
            echo
            echo "## Changelog"
            echo
            sed -n '/^## /,$p' apps/studio/CHANGELOG.md | awk 'NR > 1 && /^## /{exit} {print}'
          } > "$RUNNER_TEMP/body.md"
      - name: Push and open or update the Version packages pull request
        if: steps.plan.outputs.waiting == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          branch=changeset-release/main
          gh auth setup-git
          # Push only when the release change itself differs from the one on
          # the branch. A push restarts CI on the pull request and cancels
          # the run in progress, and most pushes to main leave the version
          # bump and changelog as they were. The merge queue tests the pull
          # request on top of the latest main anyway.
          new=$(git show HEAD | git patch-id --stable | cut -d' ' -f1)
          old=""
          if git fetch -q origin "refs/heads/$branch" 2> /dev/null; then
            old=$(git show FETCH_HEAD | git patch-id --stable | cut -d' ' -f1)
          fi
          if [ -n "$old" ] && [ "$new" = "$old" ]; then
            echo "The release change on $branch is unchanged; not pushing."
          else
            git push --force -q origin "HEAD:refs/heads/$branch"
          fi
          title="chore(release): Halonic $VERSION"
          number=$(gh pr list --repo "$REPO" --head "$branch" --base main --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh api -X PATCH "repos/$REPO/pulls/$number" -f title="$title" -F body=@"$RUNNER_TEMP/body.md" > /dev/null
          else
            gh pr create --repo "$REPO" --base main --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
      - name: Close a Version packages pull request with nothing to release
        if: steps.plan.outputs.waiting == 'false'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
          REPO: ${{ github.repository }}
        run: |
          branch=changeset-release/main
          numbers=$(gh pr list --repo "$REPO" --head "$branch" --base main --state open --json number --jq '.[].number')
          for number in $numbers; do
            gh pr close "$number" --repo "$REPO" --delete-branch \
              --comment "No changesets are waiting on main, so there is nothing to release. Closed by the Version packages workflow; it opens a new pull request when a changeset lands."
            echo "Closed #$number: nothing to release."
          done
