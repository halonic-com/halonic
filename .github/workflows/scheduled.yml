# New advisories appear without any code change, so main is checked on a
# schedule too. Mutation testing runs here too, nightly rather than on
# every pull request. A failure opens an issue.

name: Scheduled checks

on:
  schedule:
    - cron: "17 4 * * *" # daily: advisories, the lockfile and mutation testing
    - cron: "47 4 * * 1" # weekly: full terms and secret scan, Rust advisories
  workflow_dispatch:

permissions: {}

concurrency:
  group: scheduled
  cancel-in-progress: false

jobs:
  advisories:
    name: Advisories and lockfile
    if: github.event.schedule != '47 4 * * 1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - name: Lockfile check
        run: pnpm check lockfile
      - name: Licences
        run: pnpm check:licences
      - name: Audit shipped dependencies (high and critical fail)
        run: pnpm check:audit --prod --audit-level high
      - name: Audit dev tooling (report only)
        run: pnpm check:audit || echo "::warning::Advisories in dev tooling; see the log above."

  cargo-deny:
    # The Tauri shell's advisories run on pull requests only when its folder
    # changes, so a new RUSTSEC against an untouched lockfile is found here.
    # Same pinned binary and checksum as in ci.yml; keep them in step.
    name: Rust advisories (cargo-deny)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '47 4 * * 1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/studio/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # With no arguments rustup installs what rust-toolchain.toml names.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Advisories (cargo-deny)
        env:
          CARGO_DENY_VERSION: "0.20.2"
          CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl --fail --silent --show-error --location --retry 8 --retry-delay 15 --retry-all-errors \
            --output "$RUNNER_TEMP/cargo-deny.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${name}.tar.gz"
          echo "${CARGO_DENY_SHA256}  $RUNNER_TEMP/cargo-deny.tar.gz" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/cargo-deny.tar.gz" --directory "$RUNNER_TEMP"
          "$RUNNER_TEMP/${name}/cargo-deny" --locked --log-level warn check advisories

  mutation:
    # Report only for now: the score per package goes into the job summary
    # and a low score never fails. A floor that can only go up comes once
    # the scores are stable. Only a broken Stryker run fails.
    name: Mutation testing (report only)
    if: github.event.schedule != '47 4 * * 1'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - name: Stryker on workflow, routines, schema-kit and yaml (packages with code only)
        run: pnpm exec node tooling/mutation/src/cli/mutation.ts

  full-scan:
    # Weekly, and on demand: the whole tree and the whole history.
    name: Full terms and secret scan
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '47 4 * * 1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Every pull request's head stays public on GitHub even after its branch
      # is deleted, so those commits are scanned too.
      - name: Fetch pull request heads
        run: git fetch --no-tags origin '+refs/pull/*/head:refs/remotes/pull/*/head'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false
      - name: Leak guard over every file and commit
        env:
          HALONIC_DENY_TERMS: ${{ secrets.HALONIC_DENY_TERMS }}
          # Never runs from a fork, so the secret is always passed and a missing
          # list fails here and opens an issue instead of passing with a warning.
          HALONIC_TERMS_REQUIRED: "true"
        run: node tooling/check/src/cli/leaks.ts --all
      - name: gitleaks over the whole history
        uses: $/.github/actions/gitleaks

  report:
    name: Open an issue on failure
    needs: [advisories, cargo-deny, mutation, full-scan]
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Scheduled checks failed"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          body="The scheduled checks failed on main: $RUN_URL"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
