# Publishes the layer packages @halonicjs/adapters and @halonicjs/testing to
# npm (one package per layer, HAL-5149), so the integrations repo can import
# @halonicjs/adapters/integration-kit and run the conformance suite
# @halonicjs/testing/integration in its own CI.
#
# KEEP THIS FILE NAME. It is entered in the npm trusted-publisher settings of
# the packages (repository halonic-com/halonic, workflow publish-kit.yml,
# no environment). Renaming it stops every publish.
#
# No npm token exists anywhere. npm trusts this workflow's identity (OIDC) and
# records the provenance. Only the `publish` job has `id-token: write`; it
# checks out nothing and runs no repo code, only the tarballs the `pack` job
# made, so a dependency in the build can never reach the identity.
#
# It runs on every push to `main` that changes a layer package's
# `tooling/publish/layers/<layer>/layer.json`, but it only publishes when a
# `version` field differs from the one before the push. A push that changes
# dependencies or the description stops in the `pack` job, before any build,
# and stages nothing. So does a push that adds a new layer package: its first
# version is staged by a run by hand, once its trusted publisher is set up on
# npm. A run by hand works on `main` only, where `dry_run` is on by default:
# it builds and checks the tarballs and stops short of `npm publish`. A run by
# hand always builds every layer package. It never runs on pull requests. A
# version already on npm is skipped, so a run can be repeated after a partial
# failure.
#
# The trusted publisher on npm allows `npm stage publish` only, so a run puts
# the version in npm's staging area. It is not public until a person approves
# it on npmjs.com (2FA). A staged version does not show in `npm view`, so npm
# answers 409 "Cannot stage previously published version" when a version is
# staged again. The run treats that as a skip, not a failure.
#
# So merging a pull request that changes a layer package's `version` is
# a release, and so is a run by hand with `dry_run` off. Releases need the
# board's yes: ask through a task for Chief, and merge or run only once the
# user has approved.

name: Publish kit

on:
  push:
    branches: [main]
    paths:
      - tooling/publish/layers/*/layer.json
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build and check the tarballs, publish nothing"
        required: true
        default: true
        type: boolean

permissions: {}

concurrency:
  group: publish-kit
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"
  # turbo.json caps Turbo at 2 tasks at once for agent workspaces; CI keeps
  # Turbo's own default of 10.
  TURBO_CONCURRENCY: "10"

jobs:
  pack:
    name: Build and check the tarballs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # A push changes a version only if `version` differs from where `main`
      # was before the push. The merge queue can land several commits in one
      # push, so this compares with the push's `before`, not the parent commit.
      # A run by hand has no such comparison and always continues.
      - name: Did a version change?
        id: version
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" != "push" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BEFORE" || true
          changed=false
          for file in tooling/publish/layers/*/layer.json; do
            now=$(node -p 'require("./" + process.argv[1]).version' "$file")
            before=$(git show "$BEFORE:$file" 2>/dev/null | node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).version' 2>/dev/null || echo none)
            echo "$file: $before -> $now"
            # A layer package new on `main` is first staged by a run by hand,
            # once its trusted publisher is set up on npm.
            if [ "$before" != none ] && [ "$before" != "$now" ]; then
              changed=true
            fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [ "$changed" = false ]; then
            echo "No version changed, nothing to publish."
          fi
      # No dependency cache: a cache a pull request could have written must
      # not feed a release build.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.version.outputs.changed == 'true'
        with:
          cache: false
      - run: pnpm install --frozen-lockfile
        if: steps.version.outputs.changed == 'true'
      - name: Stage the layer packages
        if: steps.version.outputs.changed == 'true'
        # No layer given: `stage` builds every layer package.
        run: pnpm --filter @halonicjs/tooling-publish run stage
      - name: Pack the layer packages
        if: steps.version.outputs.changed == 'true'
        run: |
          mkdir -p tarballs
          # The publish job sets the order, not this loop.
          for directory in tooling/publish/dist/*/; do
            (cd "$directory" && npm pack --pack-destination ../../../../tarballs)
          done
          ls -l tarballs
      - name: Check what is in the tarballs
        if: steps.version.outputs.changed == 'true'
        run: |
          for tarball in tarballs/*.tgz; do
            echo "== $tarball"
            tar -tzf "$tarball" | sed 's/^package\///' | sort > files.txt
            wc -l < files.txt
            # Only built files, the licence files, the readme and the manifest.
            if grep -vE '^(package\.json|README\.md|LICENSE|NOTICE|dist/.+\.(js|d\.ts))$' files.txt; then
              echo "::error::$tarball holds files that do not belong in it (listed above)."
              exit 1
            fi
            # No tests and no maps (a `.ts` source already failed the list above).
            if grep -E '\.(test|spec)\.|\.map$' files.txt; then
              echo "::error::$tarball holds tests or maps."
              exit 1
            fi
            tar -xzOf "$tarball" package/package.json > manifest.json
            node -e '
              const m = JSON.parse(require("node:fs").readFileSync("manifest.json", "utf8"));
              const own = Object.keys({ ...m.dependencies, ...m.peerDependencies }).filter((n) => n.startsWith("@halonicjs/"));
              const allowed = ["@halonicjs/adapters"];
              const bad = own.filter((n) => !allowed.includes(n));
              if (m.private || m.version === undefined || bad.length > 0) {
                console.error("Bad manifest for " + m.name + ": private, no version or an unpublished dependency: " + bad);
                process.exit(1);
              }
              console.log(m.name + "@" + m.version, "depends on", Object.keys(m.dependencies ?? {}).join(", "));
            '
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.version.outputs.changed == 'true'
        with:
          name: kit-tarballs
          path: tarballs/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: pack
    if: needs.pack.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      # Staged publishing needs npm 11.15.0 or newer, which comes with Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Check the npm version
        run: |
          version=$(npm --version)
          echo "npm $version"
          if [ "$(printf '%s\n' 11.15.0 "$version" | sort -V | head -n1)" != "11.15.0" ]; then
            echo "::error::npm $version is too old for staged publishing (needs 11.15.0 or newer)."
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kit-tarballs
          path: tarballs
      - name: Publish, adapters first
        env:
          # Only a run by hand can be a dry run; a push publishes.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          # The testing package needs the adapters, so they go first.
          for tarball in ./tarballs/halonicjs-adapters-*.tgz ./tarballs/halonicjs-testing-*.tgz; do
            name=$(tar -xzOf "$tarball" package/package.json | node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).name')
            version=$(tar -xzOf "$tarball" package/package.json | node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).version')
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already on npm, skipping."
              continue
            fi
            if [ "$DRY_RUN" = "true" ]; then
              echo "Dry run: would stage $name@$version"
              npm stage publish "$tarball" --dry-run --access public --provenance
            else
              # A staged version is not on npm yet, so `npm view` misses it and
              # npm answers 409. That means it is already staged: skip it.
              if ! npm stage publish "$tarball" --access public --provenance 2> stage-error.txt; then
                cat stage-error.txt >&2
                if grep -qE 'E409|Cannot stage previously published version' stage-error.txt; then
                  echo "$name@$version is already staged, skipping."
                  continue
                fi
                exit 1
              fi
              cat stage-error.txt >&2
            fi
          done
