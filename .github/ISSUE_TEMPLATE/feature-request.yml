name: Idea or feature request
description: Something Halonic should do, or do better.
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Still a loose thought? Start a discussion in [Ideas](https://github.com/halonic-com/halonic/discussions/categories/ideas) instead.

        0.1.0 is our first release, so a good idea may have to wait. If it does, we'll say why. We don't give dates.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: And what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How it should work, from your side. A workaround you use now helps too.
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Links, examples, or whether you'd like to work on it yourself.
  - type: textarea
    id: ai
    attributes:
      label: AI assistance used
      description: If an AI tool helped write this, name it (tool / model). Otherwise write "None".
    validations:
      required: true
