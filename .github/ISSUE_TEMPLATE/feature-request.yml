name: Feature request
description: Suggest something Halonic should do.
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. If it's still a loose idea, start a discussion in [Ideas](https://github.com/halonic-com/halonic/discussions/categories/ideas) instead; we can turn it into an issue later.

        Halonic 0.1.0 is our first release, so a good idea may still have to wait. If it does, we'll say why. We don't give dates.
  - type: checkboxes
    id: searched
    attributes:
      label: Before you suggest
      options:
        - label: I searched the open issues and the Ideas discussions, and this isn't there yet.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you're trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: How should it work, from the user's side? If you can, say it as "When ..., Halonic shall ...".
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Other ways to solve it, including workarounds you use now.
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to work on this?
      options:
        - "No"
        - Yes, with some guidance
        - Yes, I have a plan
    validations:
      required: true
  - type: textarea
    id: ai
    attributes:
      label: AI assistance used
      description: If an AI tool helped write this request, name it (tool / model). Otherwise write "None".
    validations:
      required: true
